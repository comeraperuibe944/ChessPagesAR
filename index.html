        if (ev.beta === null || ev.gamma === null) return;
        const rad = Math.PI / 180;
        const alpha = (ev.alpha || 0) * rad;
        const beta = ev.beta * rad;
        const gamma = ev.gamma * rad;
        const orient = (window.screen && window.screen.orientation && typeof window.screen.orientation.angle === 'number'
          ? window.screen.orientation.angle
          : (window.orientation || 0)) * rad;

        _imuEuler.set(beta, alpha, -gamma, 'YXZ');
        imuSensor.currentQuat.setFromEuler(_imuEuler).multiply(_imuQ1).multiply(_imuQ0.setFromAxisAngle(_imuZee, -orient));

        if (imuSensor.hasPrev && !appState.handVisible && !appState.heldPiece) {
          _imuDelta.copy(imuSensor.currentQuat).invert().multiply(imuSensor.prevQuat);
          const angleDelta = 2 * Math.acos(Math.min(1, Math.abs(_imuDelta.w)));
          const minThresh = (appState.boardMode === 'real' && appState.realLostFrames === 0) ? 0.0045 : 0.0012;
          if (angleDelta > minThresh && angleDelta < 0.25) {
            appState.targetQuat.premultiply(_imuDelta).normalize();
            appState.targetPos.applyQuaternion(_imuDelta);
          }
        }
        imuSensor.prevQuat.copy(imuSensor.currentQuat);
        imuSensor.hasPrev = true;
      }, { passive: true });
    }

    function computeShiTomasiScore(gray, cx, cy) {
      let sxx = 0, syy = 0, sxy = 0;
      for (let dy = -2; dy <= 2; dy++) {
        const r0 = (cy + dy) * cvW;
        const rUp = (cy + dy - 1) * cvW;
        const rDn = (cy + dy + 1) * cvW;
        for (let dx = -2; dx <= 2; dx++) {
          const ix = gray[r0 + cx + dx + 1] - gray[r0 + cx + dx - 1];
          const iy = gray[rDn + cx + dx] - gray[rUp + cx + dx];
          sxx += ix * ix;
          syy += iy * iy;
          sxy += ix * iy;
        }
      }
      const trace = sxx + syy;
      const disc = Math.sqrt(Math.max(0, (sxx - syy) * (sxx - syy) + 4 * sxy * sxy));
      return (trace - disc) * 0.5;
    }

    function copyPatch7x7(gray, cx, cy) {
      const buf = new Uint8Array(49);
      let k = 0;
      for (let dy = -3; dy <= 3; dy++) {
        const ro = (cy + dy) * cvW;
        for (let dx = -3; dx <= 3; dx++) buf[k++] = gray[ro + cx + dx];
      }
      return buf;
    }

    function seedBackgroundQuadrants(gray) {
      const candidates = [];
      for (let y = 16; y <= cvH - 16; y += 8) {
        for (let x = 16; x <= cvW - 16; x += 8) {
          const score = computeShiTomasiScore(gray, x, y);
          if (score > 450) {
            const quad = (y < cvH * 0.5 ? 0 : 2) + (x < cvW * 0.5 ? 0 : 1);
            candidates.push({ x, y, score, quad });
          }
        }
      }
      candidates.sort((a, b) => b.score - a.score);
      const perQuad = [0, 0, 0, 0];
      for (const f of surfaceFeatures) {
        const q = (f.y < cvH * 0.5 ? 0 : 2) + (f.x < cvW * 0.5 ? 0 : 1);
        perQuad[q]++;
      }
      for (const c of candidates) {
        if (surfaceFeatures.length >= 20) break;
        if (perQuad[c.quad] >= 5) continue;
        if (!surfaceFeatures.some(f => Math.hypot(f.x - c.x, f.y - c.y) < 16)) {
          surfaceFeatures.push({ x: c.x, y: c.y, quad: c.quad, patch: copyPatch7x7(gray, c.x, c.y) });
          perQuad[c.quad]++;
        }
      }
    }

    const _egoDeltaQ = new THREE.Quaternion();
    const _egoEuler = new THREE.Euler();

    function trackCameraEgoMotion6DoF(gray) {
      if (!prevGray || surfaceFeatures.length < 6) {
        prevGray = new Uint8Array(gray);
        seedBackgroundQuadrants(gray);
        return;
      }

      let centerDiff = 0, borderDiff = 0, centerCnt = 0, borderCnt = 0;
      for (let y = 12; y < cvH - 12; y += 6) {
        for (let x = 12; x < cvW - 12; x += 6) {
          const d = Math.abs(gray[y * cvW + x] - prevGray[y * cvW + x]);
          if (x > 70 && x < 250 && y > 48 && y < 192) { centerDiff += d; centerCnt++; }
          else { borderDiff += d; borderCnt++; }
        }
      }
      const avgCenterDiff = centerDiff / Math.max(centerCnt, 1);
      const avgBorderDiff = borderDiff / Math.max(borderCnt, 1);
      if (avgCenterDiff > 14 && avgCenterDiff > avgBorderDiff * 2.1) {
        prevGray.set(gray);
        return;
      }

      const searchR = 10;
      const matches = [];
      for (const f of surfaceFeatures) {
        const ix = Math.round(f.x);
        const iy = Math.round(f.y);
        if (ix < 14 || ix >= cvW - 14 || iy < 14 || iy >= cvH - 14) continue;

        let bestSad = Infinity, bestX = ix, bestY = iy;
        for (let sy = -searchR; sy <= searchR; sy++) {
          const cy = iy + sy;
          for (let sx = -searchR; sx <= searchR; sx++) {
            const cx = ix + sx;
            let sad = 0, k = 0;
            for (let dy = -3; dy <= 3; dy++) {
              const ro = (cy + dy) * cvW;
              for (let dx = -3; dx <= 3; dx++) sad += Math.abs(gray[ro + cx + dx] - f.patch[k++]);
            }
            if (sad < bestSad) { bestSad = sad; bestX = cx; bestY = cy; }
          }
        }
        if (bestSad / 49 < 16) {
          const quad = (bestY < cvH * 0.5 ? 0 : 2) + (bestX < cvW * 0.5 ? 0 : 1);
          matches.push({ x0: f.x, y0: f.y, x1: bestX, y1: bestY, dx: bestX - f.x, dy: bestY - f.y, quad });
        }
      }

      if (matches.length >= 6) {
        const dxs = matches.map(m => m.dx).sort((a, b) => a - b);
        const dys = matches.map(m => m.dy).sort((a, b) => a - b);
        const medDx = dxs[dxs.length >> 1];
        const medDy = dys[dys.length >> 1];
        const inliers = matches.filter(m => Math.hypot(m.dx - medDx, m.dy - medDy) < 3.2);
        const activeQuads = new Set(inliers.map(m => m.quad)).size;

        if (inliers.length >= 5 && activeQuads >= 3) {
          let c0x = 0, c0y = 0, c1x = 0, c1y = 0;
          for (const m of inliers) { c0x += m.x0; c0y += m.y0; c1x += m.x1; c1y += m.y1; }
          c0x /= inliers.length; c0y /= inliers.length; c1x /= inliers.length; c1y /= inliers.length;
          const meanDx = c1x - c0x;
          const meanDy = c1y - c0y;

          if (Math.hypot(meanDx, meanDy) > 0.65) {
            const screenDx = (appState.mirrorVideo ? -meanDx : meanDx) / cvW;
            const screenDy = meanDy / cvH;
            const depth = Math.max(5.0, -appState.targetPos.z);
            const halfH = Math.tan(THREE.MathUtils.degToRad(camera.fov * 0.5)) * depth;
            const halfW = halfH * camera.aspect;
            appState.targetPos.x = Math.max(-halfW * 0.78, Math.min(halfW * 0.78, appState.targetPos.x + screenDx * halfW * 1.7));
            appState.targetPos.y = Math.max(-halfH * 0.72, Math.min(halfH * 0.72, appState.targetPos.y - screenDy * halfH * 1.7));
          }

          let dot = 0, cross = 0, norm0 = 0;
          for (const m of inliers) {
            const u0x = m.x0 - c0x, u0y = m.y0 - c0y;
            const u1x = m.x1 - c1x, u1y = m.y1 - c1y;
            dot += u0x * u1x + u0y * u1y;
            cross += u0x * u1y - u0y * u1x;
            norm0 += u0x * u0x + u0y * u0y;
          }
          if (norm0 > 240 && inliers.length >= 6) {
            const dTheta = Math.atan2(cross, dot);
            if (Math.abs(dTheta) > 0.005 && Math.abs(dTheta) < 0.16) {
              const signedTheta = appState.mirrorVideo ? -dTheta : dTheta;
              _egoEuler.set(0, 0, -signedTheta * 0.75, 'YXZ');
              _egoDeltaQ.setFromEuler(_egoEuler);
              appState.targetQuat.premultiply(_egoDeltaQ).normalize();
            }
          }
        }

        surfaceFeatures.length = 0;
        for (const m of inliers) {
          surfaceFeatures.push({ x: m.x1, y: m.y1, quad: m.quad, patch: copyPatch7x7(gray, m.x1, m.y1) });
        }
      } else {
        surfaceFeatures.length = 0;
      }

      if (surfaceFeatures.length < 12) seedBackgroundQuadrants(gray);
      prevGray.set(gray);
    }

    const _candPos = new THREE.Vector3();
    const _candQuat = new THREE.Quaternion();

    function computeLockedBoardCvRoi(sw, sh, fovDeg) {
      let minX = cvW, maxX = 0, minY = cvH, maxY = 0;
      let count = 0;
      for (const lx of [-3, 0, 3]) {
        for (const lz of [-3, 0, 3]) {
          const sp = projectLocalPointWithPose(appState.targetPos, appState.targetQuat, lx, 0, lz, sw, sh, fovDeg);
          if (!sp) continue;
          const cvPt = screenToCv(sp.x, sp.y);
          if (cvPt.x < minX) minX = cvPt.x;
          if (cvPt.x > maxX) maxX = cvPt.x;
          if (cvPt.y < minY) minY = cvPt.y;
          if (cvPt.y > maxY) maxY = cvPt.y;
          count++;
        }
      }
      if (count < 4) return null;
      return {
        minX: Math.max(8, Math.floor(minX - 18)),
        maxX: Math.min(cvW - 8, Math.ceil(maxX + 18)),
        minY: Math.max(8, Math.floor(minY - 18)),
        maxY: Math.min(cvH - 8, Math.ceil(maxY + 18))
      };
    }

    function processGrayFrame(rawGray, sw, sh, fovDeg) {
      smoothGray3x3(rawGray, smoothBuf, cvW, cvH);

      // 1) Se ja estamos travados no tabuleiro real, usa ROI local antes de varrer a imagem toda!
      if (appState.boardMode === 'real' && appState.realLostFrames < 4) {
        const roi = computeLockedBoardCvRoi(sw, sh, fovDeg);
        if (roi) {
          const roiPeaks = detectChessSaddlePeaks(smoothBuf, cvW, cvH, roi);
          const tracked = trackLockedRealBoard(smoothBuf, roiPeaks, sw, sh, fovDeg);
          if (tracked.ok) {
            appState.realLostFrames = 0;
            if (!tracked.frozen) {
              appState.targetPos.copy(tracked.pos);
              appState.targetQuat.copy(tracked.quat);
              appState.lockedInnerCornersScreen = tracked.quad;
            }
            return { mode: 'real_tracked', frozen: tracked.frozen };
          }
        }
      }

      const peaks = detectChessSaddlePeaks(smoothBuf, cvW, cvH, null);

      // 2) Detector completo multi-escala ChESS + rede 7x7 -> janela 8x8 -> 6DoF PnP
      const det = findExact8x8BoardFromLattice(smoothBuf, peaks, cvW, cvH);
      if (det) {
        const oriented = orientQuadWithQueenParity(
          det,
          videoToScreen,
          appState.boardMode === 'real' ? appState.lockedInnerCornersScreen : null
        );
        if (solveExactBoard6DoFPose(oriented.screenQuad, sw, sh, fovDeg, _candPos, _candQuat, oriented.matchedInner)) {
          const cx = (oriented.screenQuad[0].x + oriented.screenQuad[1].x + oriented.screenQuad[2].x + oriented.screenQuad[3].x) * 0.25;
          const cy = (oriented.screenQuad[0].y + oriented.screenQuad[1].y + oriented.screenQuad[2].y + oriented.screenQuad[3].y) * 0.25;

          if (appState.lastBoardCenterPx && Math.hypot(cx - appState.lastBoardCenterPx.x, cy - appState.lastBoardCenterPx.y) > 45) {
            appState.realLockHits = 1;
          } else {
            appState.realLockHits++;
          }
          appState.lastBoardCenterPx = { x: cx, y: cy };
          appState.realLostFrames = 0;

          if (appState.boardMode === 'real' || appState.realLockHits >= 2) {
            const wasReal = appState.boardMode === 'real';
            applyBoardVisualMode('real');
            if (!wasReal) SoundFX.boardDetected();
            appState.targetPos.copy(_candPos);
            appState.targetQuat.copy(_candQuat);
            if (!wasReal) {
              appState.currentPos.copy(_candPos);
              appState.currentQuat.copy(_candQuat);
            }
            appState.lockedInnerCornersScreen = oriented.screenQuad;
          }
          return { mode: 'real_detected', screenQuad: oriented.screenQuad, matchedInner: oriented.matchedInner };
        }
      }

      // 3) Nao detectou tabuleiro neste frame
      appState.realLockHits = Math.max(0, appState.realLockHits - 1);
      appState.realLostFrames++;

      if (appState.boardMode === 'real' && appState.realLostFrames > 45) {
        applyBoardVisualMode('virtual');
        appState.lockedInnerCornersScreen = null;
      }

      trackCameraEgoMotion6DoF(rawGray);
      return { mode: 'virtual' };
    }

    function runArVisionStep(now) {
      if (!appState.videoReady || videoEl.videoWidth === 0) return;

      // TOLERANCIA TOTAL COM A MAO NA FRENTE:
      // Enquanto o jogador estiver com a mao visivel (ou ate 750ms apos retirar a mao),
      // trava completamente a pose 3D do tabuleiro para jogar com 100% de estabilidade!
      if (appState.handVisible || appState.heldPiece || (now - appState.lastHandSeenTime < 750)) {
        prevGray = null;
        return;
      }

      cvCtx.drawImage(videoEl, 0, 0, cvW, cvH);
      const data = cvCtx.getImageData(0, 0, cvW, cvH).data;
      for (let i = 0, j = 0; i < data.length; i += 4, j++) {
        grayBuf[j] = (data[i] * 77 + data[i + 1] * 150 + data[i + 2] * 29) >> 8;
      }

      processGrayFrame(grayBuf, window.innerWidth, window.innerHeight, camera.fov);
    }

    // =========================================================================
    // 8. MEDIAPIPE HANDS + FUNCAO DE PINCA PRECISA E RESPONSIVA
    // =========================================================================
    const handTracker = {
      isPinching: false,
      sx: 0,
      sy: 0,
      initialized: false,
      lmScreen: null,
      pinchRatio: 1.0
    };
    let latestLandmarks = [];
    let isProcessingHand = false;
    let mpHands = null;

    function videoToScreen(nx, ny) {
      const sw = window.innerWidth;
      const sh = window.innerHeight;
      const vw = videoEl.videoWidth || 1280;
      const vh = videoEl.videoHeight || 720;
      const scale = Math.max(sw / vw, sh / vh);
      const dw = vw * scale;
      const dh = vh * scale;
      const ox = (sw - dw) * 0.5;
      const oy = (sh - dh) * 0.5;
      const px = appState.mirrorVideo ? ox + (1 - nx) * dw : ox + nx * dw;
      const py = oy + ny * dh;
      return { x: px, y: py };
    }

    function onHandResults(results) {
      isProcessingHand = false;
      latestLandmarks = results.multiHandLandmarks || [];

      if (latestLandmarks.length === 0) {
        appState.handVisible = false;
        if (handTracker.isPinching) {
          handTracker.isPinching = false;
          endPinchAction(handTracker.sx, handTracker.sy);
        }
        handTracker.initialized = false;
        handTracker.lmScreen = null;
        appState.hoveredPiece = null;
        return;
      }

      appState.handVisible = true;
      appState.lastHandSeenTime = performance.now();

      const lm = latestLandmarks[0];
      const pts = lm.map(p => videoToScreen(p.x, p.y));
      handTracker.lmScreen = pts;

      // Escala da mao robusta a inclinacao 3D (usa o maior eixo visivel da palma em pixels de tela)
      const dWristMiddle = Math.hypot(pts[0].x - pts[9].x, pts[0].y - pts[9].y);
      const dPalmWidth = Math.hypot(pts[5].x - pts[17].x, pts[5].y - pts[17].y) * 1.18;
      const dWristIndex = Math.hypot(pts[0].x - pts[5].x, pts[0].y - pts[5].y);
      const handScalePx = Math.max(dWristMiddle, dPalmWidth, dWristIndex, 32);

      // Distancia entre a ponta do polegar (4) e a ponta do indicador (8)
      const tipDistPx = Math.hypot(pts[4].x - pts[8].x, pts[4].y - pts[8].y);
      const ratio = tipDistPx / handScalePx;
      handTracker.pinchRatio = ratio;

      const rawX = (pts[4].x + pts[8].x) * 0.5;
      const rawY = (pts[4].y + pts[8].y) * 0.5;
      if (!handTracker.initialized) {
        handTracker.sx = rawX;
        handTracker.sy = rawY;
        handTracker.initialized = true;
      } else {
        handTracker.sx += (rawX - handTracker.sx) * 0.45;
        handTracker.sy += (rawY - handTracker.sy) * 0.45;
      }

      // Pinca calibrada: exige encostar polegar no indicador (ratio < 0.25), sem travas que falhem com a mao perto da camera
      if (!handTracker.isPinching && ratio < 0.25) {
        handTracker.isPinching = true;
        startPinchAction(handTracker.sx, handTracker.sy);
      } else if (handTracker.isPinching && ratio > 0.34) {
        handTracker.isPinching = false;
        endPinchAction(handTracker.sx, handTracker.sy);
      }

      movePinchAction(handTracker.sx, handTracker.sy);
    }

    const FINGER_CHAINS = [
      [0, 1, 2, 3, 4],
      [0, 5, 6, 7, 8],
      [0, 9, 10, 11, 12],
      [0, 13, 14, 15, 16],
      [0, 17, 18, 19, 20]
    ];

    function renderTransparentHand() {
      const sw = handCanvas.width;
      const sh = handCanvas.height;
      handCtx.clearRect(0, 0, sw, sh);

      const pts = handTracker.lmScreen;
      if (!pts) return;

      const isPinch = handTracker.isPinching;
      handCtx.save();

      // Contorno muito leve e transparente para enxergar perfeitamente todas as pecas atras da mao
      handCtx.strokeStyle = 'rgba(255, 255, 255, 0.16)';
      handCtx.lineWidth = 1.2;
      handCtx.lineCap = 'round';
      handCtx.lineJoin = 'round';

      for (const chain of FINGER_CHAINS) {
        handCtx.beginPath();
        chain.forEach((idx, k) => {
          if (k === 0) handCtx.moveTo(pts[idx].x, pts[idx].y);
          else handCtx.lineTo(pts[idx].x, pts[idx].y);
        });
        handCtx.stroke();
      }

      // Aneis vazados nas pontas do polegar (4) e indicador (8)
      for (const tipIdx of [4, 8]) {
        handCtx.beginPath();
        handCtx.arc(pts[tipIdx].x, pts[tipIdx].y, 4.5, 0, Math.PI * 2);
        handCtx.lineWidth = isPinch ? 2.0 : 1.5;
        handCtx.strokeStyle = isPinch ? 'rgba(200, 62, 123, 0.85)' : 'rgba(130, 200, 243, 0.65)';
        handCtx.stroke();
      }

      if (isPinch) {
        handCtx.beginPath();
        handCtx.arc(handTracker.sx, handTracker.sy, 3.2, 0, Math.PI * 2);
        handCtx.fillStyle = 'rgba(200, 62, 123, 0.88)';
        handCtx.fill();
      }

      handCtx.restore();
    }

    async function initMediaPipeHands() {
      if (typeof window.Hands === 'undefined') return;
      mpHands = new window.Hands({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
      });
      mpHands.setOptions({
        maxNumHands: 1,
        modelComplexity: 1,
        minDetectionConfidence: 0.58,
        minTrackingConfidence: 0.58
      });
      mpHands.onResults(onHandResults);
    }

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            width: { ideal: 1280 },
            height: { ideal: 720 },
            facingMode: { ideal: 'environment' }
          },
          audio: false
        });
        videoEl.srcObject = stream;
        await videoEl.play();
        const track = stream.getVideoTracks()[0];
        const settings = track && track.getSettings ? track.getSettings() : {};
        appState.mirrorVideo = settings.facingMode === 'user';
        videoEl.classList.toggle('mirrored', appState.mirrorVideo);
        appState.videoReady = true;
        videoEl.classList.add('active');
      } catch (err) {
        appState.videoReady = false;
      }
    }

    window.addEventListener('resize', updateCameraViewport);

    // =========================================================================
    // 9. LOOP PRINCIPAL 6DoF (ATUALIZACAO DE POSE 3D + PECAS + AR)
    // =========================================================================
    let lastHandInferTime = 0;

    function animate(now) {
      requestAnimationFrame(animate);

      const posErr = appState.currentPos.distanceTo(appState.targetPos);
      const angErr = appState.currentQuat.angleTo(appState.targetQuat);
      const alphaPos = posErr > 1.2 ? 0.36 : (posErr > 0.15 ? 0.24 : 0.16);
      const alphaRot = angErr > 0.25 ? 0.36 : (angErr > 0.04 ? 0.24 : 0.16);

      appState.currentPos.lerp(appState.targetPos, alphaPos);
      appState.currentQuat.slerp(appState.targetQuat, alphaRot);
      boardGroup.position.copy(appState.currentPos);
      boardGroup.quaternion.copy(appState.currentQuat);

      keyLight.position.set(
        boardGroup.position.x + 4,
        boardGroup.position.y + 12,
        boardGroup.position.z + 6
      );
      keyLight.target.position.copy(boardGroup.position);
      keyLight.target.updateMatrixWorld();

      const activeFocusPiece = appState.heldPiece || appState.hoveredPiece;
      if (activeFocusPiece) {
        if (appState.heldPiece) {
          const sx = Math.abs(activeFocusPiece.targetPos.x) <= 4.05 && Math.abs(activeFocusPiece.targetPos.z) <= 4.05
            ? Math.round(activeFocusPiece.targetPos.x + 3.5) - 3.5
            : activeFocusPiece.targetPos.x;
          const sz = Math.abs(activeFocusPiece.targetPos.x) <= 4.05 && Math.abs(activeFocusPiece.targetPos.z) <= 4.05
            ? Math.round(activeFocusPiece.targetPos.z + 3.5) - 3.5
            : activeFocusPiece.targetPos.z;
          focusRingMesh.position.set(sx, 0.045, sz);
          focusRingMat.color.setHex(0xF6B3D0);
          focusRingMat.opacity = 0.72;
        } else {
          focusRingMesh.position.set(activeFocusPiece.targetPos.x, 0.045, activeFocusPiece.targetPos.z);
          focusRingMat.color.setHex(0x82C8F3);
          focusRingMat.opacity = 0.56;
        }
      } else {
        focusRingMat.opacity = 0;
      }

      for (const p of pieces) {
        const lerpSpeed = p === appState.heldPiece ? 0.44 : 0.24;
        p.mesh.position.lerp(p.targetPos, lerpSpeed);

        if (p === appState.heldPiece) {
          p.mat.emissive.setHex(0xF6B3D0);
          p.mat.emissiveIntensity = 0.44;
        } else if (p === appState.hoveredPiece) {
          p.mat.emissive.setHex(0x82C8F3);
          p.mat.emissiveIntensity = 0.36;
        } else {
          p.mat.emissive.setHex(0x000000);
          p.mat.emissiveIntensity = 0;
        }
      }

      renderer.render(scene, camera);
      renderTransparentHand();

      if (appState.videoReady && mpHands && !isProcessingHand && videoEl.readyState >= 2 && (now - lastHandInferTime > 30)) {
        isProcessingHand = true;
        lastHandInferTime = now;
        mpHands.send({ image: videoEl }).catch(() => {
          isProcessingHand = false;
        });
      }

      if (now - lastCvTime > 42) {
        lastCvTime = now;
        runArVisionStep(now);
      }
    }

    window.__ChessARCore = {
      cvW,
      cvH,
      appState,
      camera,
      boardGroup,
      smoothGray3x3,
      detectChessSaddlePeaks,
      fitHomographyDLT,
      applyH,
      growChessboardLattice,
      findExact8x8BoardFromLattice,
      orientQuadWithQueenParity,
      solveExactBoard6DoFPose,
      trackLockedRealBoard,
      projectLocalPointWithPose,
      processGrayFrame,
      applyBoardVisualMode,
      videoToScreen,
      screenToCv
    };

    updateCameraViewport();
    setupBoard();
    initMediaPipeHands();
    startCamera();
    requestAnimationFrame(animate);
  })();
  </script>
</body>
