<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#F6B3D0">
  <title>ChessPages AR</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      border: none !important;
      outline: none !important;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #F8FAFC;
      position: relative;
    }

    .ambient-bg {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: linear-gradient(180deg, #FDFCFB 0%, #F4F8FC 50%, #FEF9FB 100%);
    }

    #cameraVideo {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 2;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    #cameraVideo.active {
      opacity: 1;
    }

    #cameraVideo.mirrored {
      transform: scaleX(-1);
    }

    #threeCanvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 10;
      display: block;
      touch-action: none;
    }

    #handOverlayCanvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 20;
      pointer-events: none;
      display: block;
    }
  </style>
</head>
<body>
  <div class="ambient-bg" aria-hidden="true"></div>
  <video id="cameraVideo" autoplay playsinline muted></video>
  <canvas id="threeCanvas"></canvas>
  <canvas id="handOverlayCanvas"></canvas>

  <script>
  (function () {
    'use strict';

    // =========================================================================
    // 1. MOTOR DE AUDIO PROCEDURAL (Web Audio API)
    // =========================================================================
    const SoundFX = (() => {
      let ctx = null;

      function ensureCtx() {
        if (!ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return null;
          ctx = new AudioCtx();
        }
        if (ctx.state === 'suspended') {
          ctx.resume().catch(() => {});
        }
        return ctx;
      }

      function tone(freq, endFreq, dur, type, vol, delay = 0) {
        const c = ensureCtx();
        if (!c) return;
        const now = c.currentTime + delay;
        const osc = c.createOscillator();
        const gain = c.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, now);
        if (endFreq && endFreq !== freq) {
          osc.frequency.exponentialRampToValueAtTime(Math.max(20, endFreq), now + dur);
        }
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.linearRampToValueAtTime(vol, now + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);
        osc.connect(gain);
        gain.connect(c.destination);
        osc.start(now);
        osc.stop(now + dur + 0.02);
      }

      return {
        unlock: ensureCtx,
        pinchGrab() {
          tone(540, 820, 0.055, 'sine', 0.08);
        },
        piecePlace() {
          tone(175, 62, 0.095, 'triangle', 0.15);
        },
        pieceSide() {
          tone(145, 50, 0.12, 'triangle', 0.14);
          tone(440, 620, 0.10, 'sine', 0.06, 0.02);
        },
        boardDetected() {
          tone(523.25, 659.25, 0.11, 'sine', 0.06, 0);
          tone(783.99, 1046.5, 0.14, 'sine', 0.06, 0.065);
        }
      };
    })();

    // =========================================================================
    // 2. ESTADO GLOBAL 6DoF AR COM ESTABILIDADE E IMUNIDADE A MAO
    // =========================================================================
    const videoEl = document.getElementById('cameraVideo');
    const threeCanvas = document.getElementById('threeCanvas');
    const handCanvas = document.getElementById('handOverlayCanvas');
    const handCtx = handCanvas.getContext('2d');

    const appState = {
      boardMode: 'virtual',     // 'virtual' (ancora em superficie) | 'real' (tabuleiro fisico)
      mirrorVideo: false,
      videoReady: false,

      // Pose 6DoF RIGIDA no espaco da camera (Camera em 0,0,0 olhando para -Z)
      currentPos: new THREE.Vector3(0, -0.97, -13.6),
      targetPos: new THREE.Vector3(0, -0.97, -13.6),
      currentQuat: new THREE.Quaternion(),
      targetQuat: new THREE.Quaternion(),

      // Estado de rastreamento do tabuleiro real (estilo Pokemon GO)
      realLockHits: 0,
      realLostFrames: 0,
      lastBoardCenterPx: null,
      lockedInnerCornersScreen: null,

      heldPiece: null,
      hoveredPiece: null,
      handVisible: false,
      lastHandSeenTime: 0
    };

    {
      const initEuler = new THREE.Euler(0.78, 0, 0, 'YXZ');
      appState.currentQuat.setFromEuler(initEuler);
      appState.targetQuat.copy(appState.currentQuat);
    }

    // =========================================================================
    // 3. CENA 3D AR COM CAMERA OPTICA EM (0, 0, 0) OLHANDO PARA -Z
    // =========================================================================
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(48, window.innerWidth / window.innerHeight, 0.1, 120);
    camera.position.set(0, 0, 0);
    camera.lookAt(0, 0, -1);

    const renderer = new THREE.WebGLRenderer({
      canvas: threeCanvas,
      alpha: true,
      antialias: true,
      powerPreference: 'high-performance'
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x000000, 0);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    scene.add(new THREE.HemisphereLight(0xFFFFFF, 0xF6B3D0, 0.92));

    const keyLight = new THREE.DirectionalLight(0xFFFDF7, 0.92);
    keyLight.position.set(5, 14, 6);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.width = 2048;
    keyLight.shadow.mapSize.height = 2048;
    keyLight.shadow.camera.near = 1;
    keyLight.shadow.camera.far = 45;
    keyLight.shadow.camera.left = -12;
    keyLight.shadow.camera.right = 12;
    keyLight.shadow.camera.top = 12;
    keyLight.shadow.camera.bottom = -12;
    keyLight.shadow.bias = -0.0005;
    scene.add(keyLight);
    scene.add(keyLight.target);

    const rimLight = new THREE.DirectionalLight(0x82C8F3, 0.44);
    rimLight.position.set(-7, 6, 4);
    scene.add(rimLight);

    function updateCameraViewport() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      const aspect = w / Math.max(h, 1);
      camera.aspect = aspect;
      camera.fov = aspect < 0.85 ? 58 : 48;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
      handCanvas.width = w;
      handCanvas.height = h;
    }

    const boardGroup = new THREE.Group();
    scene.add(boardGroup);

    // Anel sutil de ancoragem AR na superficie
    const arSurfaceRingMat = new THREE.MeshBasicMaterial({
      color: 0x82C8F3,
      transparent: true,
      opacity: 0.20,
      side: THREE.DoubleSide
    });
    const arSurfaceRing = new THREE.Mesh(new THREE.RingGeometry(4.55, 4.70, 48), arSurfaceRingMat);
    arSurfaceRing.rotation.x = -Math.PI / 2;
    arSurfaceRing.position.y = -0.08;
    boardGroup.add(arSurfaceRing);

    // Moldura luminosa 3D quando um Tabuleiro Fisico Real e reconhecido
    const realBoardFrameGroup = new THREE.Group();
    const realFrameMat = new THREE.MeshBasicMaterial({
      color: 0x38BDF8,
      transparent: true,
      opacity: 0.86,
      side: THREE.DoubleSide
    });
    const bracketPositions = [
      [-4.05, 0.02, -4.05, 0],
      [4.05, 0.02, -4.05, -Math.PI / 2],
      [4.05, 0.02, 4.05, Math.PI],
      [-4.05, 0.02, 4.05, Math.PI / 2]
    ];
    bracketPositions.forEach(([bx, by, bz, rotY]) => {
      const cornerGrp = new THREE.Group();
      cornerGrp.position.set(bx, by, bz);
      cornerGrp.rotation.y = rotY;
      const armA = new THREE.Mesh(new THREE.PlaneGeometry(0.95, 0.10), realFrameMat);
      armA.rotation.x = -Math.PI / 2;
      armA.position.set(0.42, 0, 0);
      const armB = new THREE.Mesh(new THREE.PlaneGeometry(0.10, 0.95), realFrameMat);
      armB.rotation.x = -Math.PI / 2;
      armB.position.set(0, 0, 0.42);
      cornerGrp.add(armA);
      cornerGrp.add(armB);
      realBoardFrameGroup.add(cornerGrp);
    });
    realBoardFrameGroup.visible = false;
    boardGroup.add(realBoardFrameGroup);

    // Base do tabuleiro virtual AR
    const boardBaseMesh = new THREE.Mesh(
      new THREE.BoxGeometry(8.45, 0.20, 8.45),
      new THREE.MeshStandardMaterial({
        color: 0xFFFFFF,
        roughness: 0.35,
        metalness: 0.05,
        transparent: true,
        opacity: 0.92
      })
    );
    boardBaseMesh.position.y = -0.13;
    boardBaseMesh.receiveShadow = true;
    boardGroup.add(boardBaseMesh);

    // Plano receptor de sombra sobre a superficie real
    const realShadowPlane = new THREE.Mesh(
      new THREE.PlaneGeometry(18, 18),
      new THREE.ShadowMaterial({ opacity: 0.28 })
    );
    realShadowPlane.rotation.x = -Math.PI / 2;
    realShadowPlane.position.y = 0.004;
    realShadowPlane.receiveShadow = true;
    boardGroup.add(realShadowPlane);

    const lightTileMat = new THREE.MeshStandardMaterial({
      color: 0xFFFDF8,
      roughness: 0.42,
      metalness: 0.04,
      transparent: true,
      opacity: 0.93
    });
    const darkTileMat = new THREE.MeshStandardMaterial({
      color: 0x6EB9E8,
      roughness: 0.38,
      metalness: 0.08,
      transparent: true,
      opacity: 0.91
    });

    const tileGeo = new THREE.BoxGeometry(0.98, 0.055, 0.98);
    for (let r = 0; r < 8; r++) {
      for (let c = 0; c < 8; c++) {
        const isLight = (r + c) % 2 === 0;
        const tile = new THREE.Mesh(tileGeo, isLight ? lightTileMat : darkTileMat);
        tile.position.set(c - 3.5, 0, r - 3.5);
        tile.receiveShadow = true;
        boardGroup.add(tile);
      }
    }

    // Anel sutil sob a peca apontada ou segurada
    const focusRingMat = new THREE.MeshBasicMaterial({
      color: 0x82C8F3,
      transparent: true,
      opacity: 0,
      side: THREE.DoubleSide
    });
    const focusRingMesh = new THREE.Mesh(new THREE.RingGeometry(0.32, 0.46, 28), focusRingMat);
    focusRingMesh.rotation.x = -Math.PI / 2;
    focusRingMesh.position.y = 0.045;
    boardGroup.add(focusRingMesh);

    // =========================================================================
    // 4. MODELAGEM 3D PROCEDURAL DAS 32 PECAS STAUNTON
    // =========================================================================
    function createWhiteMat() {
      return new THREE.MeshStandardMaterial({
        color: 0xFFFDF8,
        roughness: 0.26,
        metalness: 0.08,
        emissive: 0x000000,
        emissiveIntensity: 0
      });
    }

    function createBlackMat() {
      return new THREE.MeshStandardMaterial({
        color: 0x1E293B,
        roughness: 0.28,
        metalness: 0.24,
        emissive: 0x000000,
        emissiveIntensity: 0
      });
    }

    function latheFromProfile(points, segments = 24) {
      return new THREE.LatheGeometry(points.map(([x, y]) => new THREE.Vector2(x, y)), segments);
    }

    function buildPieceMesh(type, color) {
      const mat = color === 'w' ? createWhiteMat() : createBlackMat();
      const group = new THREE.Group();

      function addMesh(geo, x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0) {
        const m = new THREE.Mesh(geo, mat);
        m.position.set(x, y, z);
        m.rotation.set(rx, ry, rz);
        m.castShadow = true;
        m.receiveShadow = true;
        group.add(m);
        return m;
      }

      if (type === 'p') {
        addMesh(latheFromProfile([
          [0, 0], [0.30, 0], [0.30, 0.08], [0.24, 0.14], [0.14, 0.24],
          [0.10, 0.48], [0.16, 0.54], [0.11, 0.58], [0, 0.58]
        ]));
        addMesh(new THREE.SphereGeometry(0.165, 20, 16), 0, 0.72, 0);
      } else if (type === 'r') {
        addMesh(latheFromProfile([
          [0, 0], [0.33, 0], [0.33, 0.09], [0.27, 0.16], [0.18, 0.26],
          [0.17, 0.70], [0.24, 0.80], [0.24, 0.94], [0.15, 0.94], [0.15, 0.84], [0, 0.84]
        ]));
        for (let i = 0; i < 6; i++) {
          const ang = (i / 6) * Math.PI * 2;
          addMesh(new THREE.BoxGeometry(0.10, 0.12, 0.08), Math.cos(ang) * 0.20, 1.0, Math.sin(ang) * 0.20, 0, -ang, 0);
        }
      } else if (type === 'n') {
        addMesh(latheFromProfile([
          [0, 0], [0.33, 0], [0.33, 0.09], [0.27, 0.17], [0.20, 0.28], [0, 0.28]
        ]));
        const dir = color === 'w' ? -1 : 1;
        addMesh(new THREE.CylinderGeometry(0.13, 0.21, 0.48, 16), 0, 0.48, -dir * 0.02, dir * 0.22, 0, 0);
        addMesh(new THREE.BoxGeometry(0.20, 0.28, 0.34), 0, 0.78, dir * 0.09, dir * 0.36, 0, 0);
        addMesh(new THREE.BoxGeometry(0.14, 0.17, 0.24), 0, 0.75, dir * 0.26, dir * 0.65, 0, 0);
        addMesh(new THREE.ConeGeometry(0.055, 0.16, 10), -0.075, 0.97, dir * 0.02);
        addMesh(new THREE.ConeGeometry(0.055, 0.16, 10), 0.075, 0.97, dir * 0.02);
      } else if (type === 'b') {
        addMesh(latheFromProfile([
          [0, 0], [0.32, 0], [0.32, 0.09], [0.26, 0.16], [0.15, 0.28],
          [0.11, 0.66], [0.19, 0.73], [0.13, 0.77], [0.18, 0.90],
          [0.14, 1.04], [0.06, 1.14], [0, 1.16]
        ]));
        addMesh(new THREE.SphereGeometry(0.065, 14, 14), 0, 1.21, 0);
      } else if (type === 'q') {
        addMesh(latheFromProfile([
          [0, 0], [0.36, 0], [0.36, 0.10], [0.29, 0.18], [0.17, 0.34],
          [0.12, 0.80], [0.21, 0.88], [0.15, 0.93], [0.24, 1.15], [0.14, 1.18], [0, 1.18]
        ]));
        addMesh(new THREE.SphereGeometry(0.14, 18, 16), 0, 1.24, 0);
        addMesh(new THREE.SphereGeometry(0.055, 12, 12), 0, 1.40, 0);
        for (let i = 0; i < 8; i++) {
          const ang = (i / 8) * Math.PI * 2;
          addMesh(new THREE.SphereGeometry(0.036, 10, 10), Math.cos(ang) * 0.21, 1.20, Math.sin(ang) * 0.21);
        }
      } else if (type === 'k') {
        addMesh(latheFromProfile([
          [0, 0], [0.38, 0], [0.38, 0.11], [0.31, 0.19], [0.18, 0.36],
          [0.13, 0.86], [0.22, 0.95], [0.16, 1.00], [0.24, 1.24], [0.18, 1.32], [0, 1.34]
        ]));
        addMesh(new THREE.BoxGeometry(0.075, 0.26, 0.075), 0, 1.47, 0);
        addMesh(new THREE.BoxGeometry(0.20, 0.075, 0.075), 0, 1.50, 0);
      }

      const hitMesh = new THREE.Mesh(
        new THREE.CylinderGeometry(0.48, 0.48, 1.55, 12),
        new THREE.MeshBasicMaterial({ visible: false })
      );
      hitMesh.position.y = 0.75;
      group.add(hitMesh);

      return { group, mat, hitMesh };
    }

    // =========================================================================
    // 5. TABULEIRO LIVRE (SEM REGRAS, SEM VEZ, COM DESLOCAMENTO NATURAL)
    // =========================================================================
    const pieces = [];
    const pieceHitMeshes = [];
    const grid = Array.from({ length: 8 }, () => Array(8).fill(null));

    function inBounds(r, c) {
      return r >= 0 && r < 8 && c >= 0 && c < 8;
    }

    function spawnPiece(type, color, row, col) {
      const built = buildPieceMesh(type, color);
      const piece = {
        type,
        color,
        row,
        col,
        mesh: built.group,
        mat: built.mat,
        hitMesh: built.hitMesh,
        targetPos: new THREE.Vector3(col - 3.5, 0.03, row - 3.5)
      };
      built.hitMesh.userData = { piece };
      built.group.position.copy(piece.targetPos);
      boardGroup.add(built.group);
      pieces.push(piece);
      pieceHitMeshes.push(built.hitMesh);
      grid[row][col] = piece;
    }

    function setupBoard() {
      const backRank = ['r', 'n', 'b', 'q', 'k', 'b', 'n', 'r'];
      for (let c = 0; c < 8; c++) {
        spawnPiece(backRank[c], 'b', 0, c);
        spawnPiece('p', 'b', 1, c);
        spawnPiece('p', 'w', 6, c);
        spawnPiece(backRank[c], 'w', 7, c);
      }
    }

    function clearGridCell(piece) {
      if (piece.row >= 0 && piece.col >= 0 && grid[piece.row]?.[piece.col] === piece) {
        grid[piece.row][piece.col] = null;
      }
    }

    function slideDisplacedPieceBesideBoard(piece, preferredZ) {
      clearGridCell(piece);
      piece.row = -1;
      piece.col = -1;
      const sideSign = piece.color === 'b' ? -1 : 1;
      let tx = sideSign * 4.95;
      let tz = Math.max(-3.6, Math.min(3.6, preferredZ));
      for (let attempt = 0; attempt < 16; attempt++) {
        let collision = false;
        for (const other of pieces) {
          if (other !== piece && other.row === -1 && Math.hypot(other.targetPos.x - tx, other.targetPos.z - tz) < 0.72) {
            collision = true;
            break;
          }
        }
        if (!collision) break;
        const col = attempt % 2;
        const row = Math.floor(attempt / 2);
        tx = sideSign * (4.9 + col * 0.85);
        tz = -3.2 + row * 0.92;
      }
      piece.targetPos.set(tx, 0.01, tz);
    }

    function placePieceOnTable(piece, localX, localZ) {
      const targetCol = Math.round(localX + 3.5);
      const targetRow = Math.round(localZ + 3.5);

      if (inBounds(targetRow, targetCol) && Math.abs(localX) <= 4.05 && Math.abs(localZ) <= 4.05) {
        const occupant = grid[targetRow][targetCol];
        if (occupant && occupant !== piece) {
          slideDisplacedPieceBesideBoard(occupant, targetRow - 3.5);
          SoundFX.pieceSide();
        } else {
          SoundFX.piecePlace();
        }
        clearGridCell(piece);
        piece.row = targetRow;
        piece.col = targetCol;
        piece.targetPos.set(targetCol - 3.5, 0.03, targetRow - 3.5);
        grid[targetRow][targetCol] = piece;
      } else {
        clearGridCell(piece);
        piece.row = -1;
        piece.col = -1;
        const cx = Math.max(-8.0, Math.min(8.0, localX));
        const cz = Math.max(-5.5, Math.min(5.5, localZ));
        piece.targetPos.set(cx, 0.01, cz);
        SoundFX.pieceSide();
      }
    }

    function applyBoardVisualMode(mode) {
      if (appState.boardMode === mode) return;
      appState.boardMode = mode;
      const isReal = mode === 'real';
      boardBaseMesh.visible = !isReal;
      arSurfaceRing.visible = !isReal;
      realBoardFrameGroup.visible = isReal;
      lightTileMat.opacity = isReal ? 0.03 : 0.93;
      darkTileMat.opacity = isReal ? 0.06 : 0.91;
    }

    // =========================================================================
    // 6. INTERACAO POR PINCELADA PRECISA (PROJECCAO 2D DE TELA + PLANO 3D)
    // =========================================================================
    const raycaster = new THREE.Raycaster();
    const tmpNormal = new THREE.Vector3();
    const tmpPoint = new THREE.Vector3();
    const projVec = new THREE.Vector3();
    const dynamicGroundPlane = new THREE.Plane();
    const dynamicDragPlane = new THREE.Plane();

    function screenToNdc(sx, sy) {
      return new THREE.Vector2(
        (sx / window.innerWidth) * 2 - 1,
        -(sy / window.innerHeight) * 2 + 1
      );
    }

    function updateDynamicPlanes() {
      boardGroup.updateMatrixWorld(true);
      tmpNormal.set(0, 1, 0).applyQuaternion(boardGroup.quaternion).normalize();
      dynamicGroundPlane.setFromNormalAndCoplanarPoint(tmpNormal, boardGroup.position);
      tmpPoint.set(0, 0.75, 0);
      boardGroup.localToWorld(tmpPoint);
      dynamicDragPlane.setFromNormalAndCoplanarPoint(tmpNormal, tmpPoint);
    }

    function raycastBoardGround(sx, sy) {
      updateDynamicPlanes();
      raycaster.setFromCamera(screenToNdc(sx, sy), camera);
      const hit = new THREE.Vector3();
      return raycaster.ray.intersectPlane(dynamicGroundPlane, hit) ? hit : null;
    }

    function raycastDragPlane(sx, sy) {
      updateDynamicPlanes();
      raycaster.setFromCamera(screenToNdc(sx, sy), camera);
      const hit = new THREE.Vector3();
      return raycaster.ray.intersectPlane(dynamicDragPlane, hit) ? hit : null;
    }

    function worldToBoardLocal(worldPt) {
      boardGroup.updateMatrixWorld(true);
      return boardGroup.worldToLocal(worldPt.clone());
    }

    function findPieceNear(sx, sy) {
      boardGroup.updateMatrixWorld(true);

      // 1) Raycast 3D direto nos cilindros das pecas
      raycaster.setFromCamera(screenToNdc(sx, sy), camera);
      const hits = raycaster.intersectObjects(pieceHitMeshes, false);
      if (hits.length > 0) {
        return hits[0].object.userData.piece;
      }

      // 2) Busca em espaco de tela 2D (projeta o centro do corpo de cada peca na tela para eliminar erro de paralaxe)
      const sw = window.innerWidth;
      const sh = window.innerHeight;
      const maxScreenDistPx = Math.max(42, Math.min(sw, sh) * 0.068);
      let bestScreenPiece = null;
      let bestScreenDist = maxScreenDistPx;

      for (const p of pieces) {
        projVec.set(p.targetPos.x, 0.45, p.targetPos.z);
        boardGroup.localToWorld(projVec);
        projVec.project(camera);
        if (projVec.z > 1.0) continue;
        const px = (projVec.x * 0.5 + 0.5) * sw;
        const py = (-projVec.y * 0.5 + 0.5) * sh;
        const dPx = Math.hypot(px - sx, py - sy);
        if (dPx < bestScreenDist) {
          bestScreenDist = dPx;
          bestScreenPiece = p;
        }
      }
      if (bestScreenPiece) return bestScreenPiece;

      // 3) Fallback no plano do tabuleiro
      const groundWorld = raycastBoardGround(sx, sy);
      if (!groundWorld) return null;
      const local = worldToBoardLocal(groundWorld);

      let bestPiece = null;
      let bestDist = 0.72;
      for (const p of pieces) {
        const d = Math.hypot(p.targetPos.x - local.x, p.targetPos.z - local.z);
        if (d < bestDist) {
          bestDist = d;
          bestPiece = p;
        }
      }
      return bestPiece;
    }

    function startPinchAction(sx, sy) {
      SoundFX.unlock();
      if (appState.heldPiece) return;
      const piece = findPieceNear(sx, sy);
      if (piece) {
        appState.heldPiece = piece;
        SoundFX.pinchGrab();
      }
    }

    function movePinchAction(sx, sy) {
      if (appState.heldPiece) {
        const dragWorld = raycastDragPlane(sx, sy) || raycastBoardGround(sx, sy);
        if (dragWorld) {
          const local = worldToBoardLocal(dragWorld);
          appState.heldPiece.targetPos.set(local.x, 1.25, local.z);
        }
      } else {
        appState.hoveredPiece = findPieceNear(sx, sy);
      }
    }

    function endPinchAction(sx, sy) {
      const piece = appState.heldPiece;
      if (!piece) return;
      appState.heldPiece = null;

      const dragWorld = raycastDragPlane(sx, sy) || raycastBoardGround(sx, sy);
      const local = dragWorld ? worldToBoardLocal(dragWorld) : piece.targetPos.clone();
      placePieceOnTable(piece, local.x, local.z);
    }

    let pointerDownActive = false;
    threeCanvas.addEventListener('pointerdown', (e) => {
      pointerDownActive = true;
      startPinchAction(e.clientX, e.clientY);
    });
    window.addEventListener('pointermove', (e) => {
      movePinchAction(e.clientX, e.clientY);
    });
    window.addEventListener('pointerup', (e) => {
      if (pointerDownActive) {
        pointerDownActive = false;
        endPinchAction(e.clientX, e.clientY);
      }
    });

    // =========================================================================
    // 7. MOTOR AR 6DoF DE ALTA PRECISAO:
    //    - DETECTOR CHESS MULTI-ESCALA SUB-PIXEL (R=3, 5, 7)
    //    - GRAFO TOPOLOGICO DE REDE 7x7 -> JANELA EXATA 8x8 + PARIDADE RAINHA (d1)
    //    - SOLVER RIGIDO 6DoF COM ESCORÇO ANALITICO + GAUSS-NEWTON PnP
    //    - RASTREAMENTO PREDITIVO ESTILO POKEMON GO COM DEADBAND ANTI-TREMOR
    // =========================================================================
    const cvW = 320;
    const cvH = 240;
    const cvCanvas = document.createElement('canvas');
    cvCanvas.width = cvW;
    cvCanvas.height = cvH;
    const cvCtx = cvCanvas.getContext('2d', { willReadFrequently: true });
    const grayBuf = new Uint8Array(cvW * cvH);
    const smoothBuf = new Uint8Array(cvW * cvH);
    let lastCvTime = 0;

    const CHESS_RINGS = [
      [
        [3, 0], [3, 1], [2, 2], [1, 3], [0, 3], [-1, 3], [-2, 2], [-3, 1],
        [-3, 0], [-3, -1], [-2, -2], [-1, -3], [0, -3], [1, -3], [2, -2], [3, -1]
      ],
      [
        [5, 0], [5, 2], [4, 4], [2, 5], [0, 5], [-2, 5], [-4, 4], [-5, 2],
        [-5, 0], [-5, -2], [-4, -4], [-2, -5], [0, -5], [2, -5], [4, -4], [5, -2]
      ],
      [
        [7, 0], [6, 3], [5, 5], [3, 6], [0, 7], [-3, 6], [-5, 5], [-6, 3],
        [-7, 0], [-6, -3], [-5, -5], [-3, -6], [0, -7], [3, -6], [5, -5], [6, -3]
      ]
    ];
    const RING_WEIGHTS = [1.0, 1.03, 1.05];
    const RING_OFFSETS = new Int32Array(3 * 16);
    for (let rIdx = 0; rIdx < 3; rIdx++) {
      for (let k = 0; k < 16; k++) {
        RING_OFFSETS[(rIdx << 4) + k] = CHESS_RINGS[rIdx][k][1] * cvW + CHESS_RINGS[rIdx][k][0];
      }
    }

    function smoothGray3x3(src, dst, w, h) {
      for (let x = 0; x < w; x++) {
        dst[x] = src[x];
        dst[(h - 1) * w + x] = src[(h - 1) * w + x];
      }
      for (let y = 1; y < h - 1; y++) {
        const ro = y * w;
        const rUp = ro - w;
        const rDn = ro + w;
        dst[ro] = src[ro];
        dst[ro + w - 1] = src[ro + w - 1];
        for (let x = 1; x < w - 1; x++) {
          const v =
            (src[ro + x] << 2) +
            ((src[ro + x - 1] + src[ro + x + 1] + src[rUp + x] + src[rDn + x]) << 1) +
            src[rUp + x - 1] + src[rUp + x + 1] + src[rDn + x - 1] + src[rDn + x + 1];
          dst[ro + x] = v >> 4;
        }
      }
    }

    function sampleBilinearGray(buf, u, v, w, h) {
      if (u < 0.5 || u >= w - 1.5 || v < 0.5 || v >= h - 1.5) return -1;
      const ix = u | 0;
      const iy = v | 0;
      const fx = u - ix;
      const fy = v - iy;
      const idx = iy * w + ix;
      const v00 = buf[idx];
      const v10 = buf[idx + 1];
      const v01 = buf[idx + w];
      const v11 = buf[idx + w + 1];
      return (v00 * (1 - fx) + v10 * fx) * (1 - fy) + (v01 * (1 - fx) + v11 * fx) * fy;
    }

    let _chessC0 = 0;
    let _chessC2 = 0;

    function evalChessAt(gray, w, x, y, ringIdx) {
      const idx = y * w + x;
      const base = ringIdx << 4;
      const o = RING_OFFSETS;

      const v0 = gray[idx + o[base]];
      const v4 = gray[idx + o[base + 4]];
      const v8 = gray[idx + o[base + 8]];
      const v12 = gray[idx + o[base + 12]];
      const c0 = (v0 + v8) - (v4 + v12);

      const v2 = gray[idx + o[base + 2]];
      const v6 = gray[idx + o[base + 6]];
      const v10 = gray[idx + o[base + 10]];
      const v14 = gray[idx + o[base + 14]];
      const c2 = (v2 + v10) - (v6 + v14);

      if ((c0 < 0 ? -c0 : c0) + (c2 < 0 ? -c2 : c2) < 24) return -1;

      const v1 = gray[idx + o[base + 1]];
      const v3 = gray[idx + o[base + 3]];
      const v5 = gray[idx + o[base + 5]];
      const v7 = gray[idx + o[base + 7]];
      const v9 = gray[idx + o[base + 9]];
      const v11 = gray[idx + o[base + 11]];
      const v13 = gray[idx + o[base + 13]];
      const v15 = gray[idx + o[base + 15]];

      const c1 = (v1 + v9) - (v5 + v13);
      const c3 = (v3 + v11) - (v7 + v15);
      const sr =
        (c0 < 0 ? -c0 : c0) +
        (c1 < 0 ? -c1 : c1) +
        (c2 < 0 ? -c2 : c2) +
        (c3 < 0 ? -c3 : c3);
      if (sr < 52) return -1;

      const d0 = v0 - v8, d1 = v1 - v9, d2 = v2 - v10, d3 = v3 - v11;
      const d4 = v4 - v12, d5 = v5 - v13, d6 = v6 - v14, d7 = v7 - v15;
      const dr =
        (d0 < 0 ? -d0 : d0) + (d1 < 0 ? -d1 : d1) +
        (d2 < 0 ? -d2 : d2) + (d3 < 0 ? -d3 : d3) +
        (d4 < 0 ? -d4 : d4) + (d5 < 0 ? -d5 : d5) +
        (d6 < 0 ? -d6 : d6) + (d7 < 0 ? -d7 : d7);

      const ringMean = (v0 + v1 + v2 + v3 + v4 + v5 + v6 + v7 + v8 + v9 + v10 + v11 + v12 + v13 + v14 + v15) * 0.0625;
      const centerMean = (
        (gray[idx] << 2) +
        gray[idx - 1] + gray[idx + 1] +
        gray[idx - w] + gray[idx + w]
      ) * 0.125;
      const mrDiff = ringMean - centerMean;
      const mr = mrDiff < 0 ? -mrDiff : mrDiff;

      const score = (sr - 1.15 * dr - 6.0 * mr) * RING_WEIGHTS[ringIdx];
      if (score <= 24) return -1;

      _chessC0 = c0;
      _chessC2 = c2;
      return score;
    }

    function refineSaddleSubPixel(gray, w, h, ix, iy) {
      if (ix < 4 || ix >= w - 4 || iy < 4 || iy >= h - 4) {
        return { x: ix, y: iy };
      }
      let a00 = 0, a01 = 0, a11 = 0, b0 = 0, b1 = 0;
      for (let dy = -2; dy <= 2; dy++) {
        const ro = (iy + dy) * w;
        for (let dx = -2; dx <= 2; dx++) {
          const idx = ro + ix + dx;
          const gx = 0.5 * (gray[idx + 1] - gray[idx - 1]);
          const gy = 0.5 * (gray[idx + w] - gray[idx - w]);
          const dot = gx * dx + gy * dy;
          a00 += gx * gx;
          a01 += gx * gy;
          a11 += gy * gy;
          b0 += gx * dot;
          b1 += gy * dot;
        }
      }
      const det = a00 * a11 - a01 * a01;
      const trace = a00 + a11;
      if (det > 80 && (trace * trace) / det < 28) {
        const sx = (a11 * b0 - a01 * b1) / det;
        const sy = (a00 * b1 - a01 * b0) / det;
        if (Math.hypot(sx, sy) < 1.15) {
          return { x: ix + sx, y: iy + sy };
        }
      }
      return { x: ix, y: iy };
    }

    function detectChessSaddlePeaks(gray, w, h, roi = null) {
      const margin = 8;
      const yStart = roi ? Math.max(margin, roi.minY & ~1) : margin;
      const yEnd = roi ? Math.min(h - margin, roi.maxY) : (h - margin);
      const xStart = roi ? Math.max(margin, roi.minX & ~1) : margin;
      const xEnd = roi ? Math.min(w - margin, roi.maxX) : (w - margin);
      const candidates = [];

      // Precalcula offsets escalares para o anel rapido R=4 na varredura grossa
      const o0 = 4,          o1 = 2 * w + 4,  o2 = 3 * w + 3,  o3 = 4 * w + 2;
      const o4 = 4 * w,      o5 = 4 * w - 2,  o6 = 3 * w - 3,  o7 = 2 * w - 4;
      const o8 = -4,         o9 = -2 * w - 4, o10 = -3 * w - 3, o11 = -4 * w - 2;
      const o12 = -4 * w,    o13 = -4 * w + 2, o14 = -3 * w + 3, o15 = -2 * w + 4;

      for (let y = yStart; y < yEnd; y += 2) {
        const ro = y * w;
        for (let x = xStart; x < xEnd; x += 2) {
          const idx = ro + x;
          const v0 = gray[idx + o0], v4 = gray[idx + o4], v8 = gray[idx + o8], v12 = gray[idx + o12];
          const c0 = (v0 + v8) - (v4 + v12);
          const v2 = gray[idx + o2], v6 = gray[idx + o6], v10 = gray[idx + o10], v14 = gray[idx + o14];
          const c2 = (v2 + v10) - (v6 + v14);
          if ((c0 < 0 ? -c0 : c0) + (c2 < 0 ? -c2 : c2) < 24) continue;

          const v1 = gray[idx + o1], v3 = gray[idx + o3], v5 = gray[idx + o5], v7 = gray[idx + o7];
          const v9 = gray[idx + o9], v11 = gray[idx + o11], v13 = gray[idx + o13], v15 = gray[idx + o15];
          const c1 = (v1 + v9) - (v5 + v13);
          const c3 = (v3 + v11) - (v7 + v15);
          const sr = (c0 < 0 ? -c0 : c0) + (c1 < 0 ? -c1 : c1) + (c2 < 0 ? -c2 : c2) + (c3 < 0 ? -c3 : c3);
          if (sr < 52) continue;

          const d0 = v0 - v8, d1 = v1 - v9, d2 = v2 - v10, d3 = v3 - v11;
          const d4 = v4 - v12, d5 = v5 - v13, d6 = v6 - v14, d7 = v7 - v15;
          const dr =
            (d0 < 0 ? -d0 : d0) + (d1 < 0 ? -d1 : d1) + (d2 < 0 ? -d2 : d2) + (d3 < 0 ? -d3 : d3) +
            (d4 < 0 ? -d4 : d4) + (d5 < 0 ? -d5 : d5) + (d6 < 0 ? -d6 : d6) + (d7 < 0 ? -d7 : d7);
          const ringMean = (v0 + v1 + v2 + v3 + v4 + v5 + v6 + v7 + v8 + v9 + v10 + v11 + v12 + v13 + v14 + v15) * 0.0625;
          const centerMean = ((gray[idx] << 2) + gray[idx - 1] + gray[idx + 1] + gray[idx - w] + gray[idx + w]) * 0.125;
          const mrDiff = ringMean - centerMean;
          const sc = sr - 1.15 * dr - 6.0 * (mrDiff < 0 ? -mrDiff : mrDiff);
          if (sc > 26) {
            candidates.push({ x, y, score: sc, rIdx: 0 });
          }
        }
      }

      candidates.sort((a, b) => b.score - a.score);
      const roughPeaks = [];
      for (let i = 0; i < candidates.length; i++) {
        const c = candidates[i];
        let suppressed = false;
        for (let j = 0; j < roughPeaks.length; j++) {
          const p = roughPeaks[j];
          if (Math.hypot(p.x - c.x, p.y - c.y) < 5.5) {
            suppressed = true;
            break;
          }
        }
        if (!suppressed) {
          roughPeaks.push(c);
          if (roughPeaks.length >= 96) break;
        }
      }

      const refined = [];
      for (let i = 0; i < roughPeaks.length; i++) {
        const rp = roughPeaks[i];
        let bx = rp.x;
        let by = rp.y;
        let bestRIdx = 0;
        let bestScore = -1;
        let bestC0 = 0;
        let bestC2 = 0;

        for (let rIdx = 0; rIdx < 3; rIdx++) {
          const sc = evalChessAt(gray, w, bx, by, rIdx);
          if (sc > bestScore) {
            bestScore = sc;
            bestRIdx = rIdx;
            bestC0 = _chessC0;
            bestC2 = _chessC2;
          }
        }

        for (let dy = -1; dy <= 1; dy++) {
          const ny = rp.y + dy;
          if (ny < margin || ny >= h - margin) continue;
          for (let dx = -1; dx <= 1; dx++) {
            const nx = rp.x + dx;
            if (nx < margin || nx >= w - margin) continue;
            const sc = evalChessAt(gray, w, nx, ny, bestRIdx);
            if (sc > bestScore) {
              bestScore = sc;
              bestC0 = _chessC0;
              bestC2 = _chessC2;
              bx = nx;
              by = ny;
            }
          }
        }
        if (bestScore <= 24) continue;

        const mag2 = Math.hypot(bestC0, bestC2);
        if (mag2 < 1e-3) continue;

        const sub = refineSaddleSubPixel(gray, w, h, bx, by);
        let dup = false;
        for (let j = 0; j < refined.length; j++) {
          if (Math.hypot(refined[j].x - sub.x, refined[j].y - sub.y) < 5.0) {
            dup = true;
            break;
          }
        }
        if (dup) continue;

        const ang4 = Math.atan2(bestC2, bestC0) * 2;
        refined.push({
          x: sub.x,
          y: sub.y,
          score: bestScore,
          rIdx: bestRIdx,
          n2x: bestC0 / mag2,
          n2y: bestC2 / mag2,
          u4: Math.cos(ang4),
          v4: Math.sin(ang4)
        });
      }

      return refined;
    }

    // Normalised 9x9 DLT Homography via Jacobi Eigensolver (handles 4..49+ pontos sem vies!)
    function fitHomographyDLT(srcPts, dstPts, weights) {
      const n = srcPts.length;
      if (n < 4) return null;

      let mU = 0, mV = 0, mX = 0, mY = 0, wSum = 0;
      for (let i = 0; i < n; i++) {
        const w = weights ? weights[i] : 1;
        mU += srcPts[i].u * w;
        mV += srcPts[i].v * w;
        mX += dstPts[i].x * w;
        mY += dstPts[i].y * w;
        wSum += w;
      }
      if (wSum < 1e-9) return null;
      mU /= wSum; mV /= wSum; mX /= wSum; mY /= wSum;

      let dSrc = 0, dDst = 0;
      for (let i = 0; i < n; i++) {
        const w = weights ? weights[i] : 1;
        dSrc += Math.hypot(srcPts[i].u - mU, srcPts[i].v - mV) * w;
        dDst += Math.hypot(dstPts[i].x - mX, dstPts[i].y - mY) * w;
      }
      dSrc /= wSum;
      dDst /= wSum;
      if (dSrc < 1e-6 || dDst < 1e-6) return null;
      const sSrc = Math.SQRT2 / dSrc;
      const sDst = Math.SQRT2 / dDst;

      const ata = new Float64Array(81);
      for (let i = 0; i < n; i++) {
        const w = weights ? weights[i] : 1;
        const u = (srcPts[i].u - mU) * sSrc;
        const v = (srcPts[i].v - mV) * sSrc;
        const x = (dstPts[i].x - mX) * sDst;
        const y = (dstPts[i].y - mY) * sDst;

        const r1 = [u, v, 1, 0, 0, 0, -x * u, -x * v, -x];
        const r2 = [0, 0, 0, u, v, 1, -y * u, -y * v, -y];
        for (let a = 0; a < 9; a++) {
          const wa1 = w * r1[a];
          const wa2 = w * r2[a];
          const ro = a * 9;
          for (let b = a; b < 9; b++) {
            ata[ro + b] += wa1 * r1[b] + wa2 * r2[b];
          }
        }
      }
      for (let a = 0; a < 9; a++) {
        for (let b = 0; b < a; b++) ata[a * 9 + b] = ata[b * 9 + a];
      }

      const V = new Float64Array(81);
      for (let i = 0; i < 9; i++) V[i * 9 + i] = 1;

      for (let sweep = 0; sweep < 28; sweep++) {
        let maxOff = 0;
        for (let p = 0; p < 8; p++) {
          for (let q = p + 1; q < 9; q++) {
            const apq = ata[p * 9 + q];
            const absApq = Math.abs(apq);
            if (absApq > maxOff) maxOff = absApq;
            if (absApq < 1e-12) continue;

            const app = ata[p * 9 + p];
            const aqq = ata[q * 9 + q];
            const tau = (aqq - app) / (2 * apq);
            const t = tau >= 0
              ? 1 / (tau + Math.sqrt(1 + tau * tau))
              : -1 / (-tau + Math.sqrt(1 + tau * tau));
            const c = 1 / Math.sqrt(1 + t * t);
            const s = t * c;

            ata[p * 9 + p] = app - t * apq;
            ata[q * 9 + q] = aqq + t * apq;
            ata[p * 9 + q] = 0;
            ata[q * 9 + p] = 0;

            for (let k = 0; k < 9; k++) {
              if (k !== p && k !== q) {
                const akp = ata[k * 9 + p];
                const akq = ata[k * 9 + q];
                const np = c * akp - s * akq;
                const nq = s * akp + c * akq;
                ata[k * 9 + p] = np; ata[p * 9 + k] = np;
                ata[k * 9 + q] = nq; ata[q * 9 + k] = nq;
              }
              const vkp = V[k * 9 + p];
              const vkq = V[k * 9 + q];
              V[k * 9 + p] = c * vkp - s * vkq;
              V[k * 9 + q] = s * vkp + c * vkq;
            }
          }
        }
        if (maxOff < 1e-10) break;
      }

      let minCol = 0;
      let minVal = ata[0];
      for (let i = 1; i < 9; i++) {
        if (ata[i * 9 + i] < minVal) {
          minVal = ata[i * 9 + i];
          minCol = i;
        }
      }

      const hn = new Float64Array(9);
      for (let i = 0; i < 9; i++) hn[i] = V[i * 9 + minCol];

      // H = T_dst^-1 * H_norm * T_src
      const invS = 1 / sDst;
      // Primeiro M = T_dst^-1 * H_norm
      const M = new Float64Array([
        hn[0] * invS + mX * hn[6], hn[1] * invS + mX * hn[7], hn[2] * invS + mX * hn[8],
        hn[3] * invS + mY * hn[6], hn[4] * invS + mY * hn[7], hn[5] * invS + mY * hn[8],
        hn[6], hn[7], hn[8]
      ]);

      const tx = -sSrc * mU;
      const ty = -sSrc * mV;
      const H = new Float64Array([
        M[0] * sSrc, M[1] * sSrc, M[0] * tx + M[1] * ty + M[2],
        M[3] * sSrc, M[4] * sSrc, M[3] * tx + M[4] * ty + M[5],
        M[6] * sSrc, M[7] * sSrc, M[6] * tx + M[7] * ty + M[8]
      ]);

      const norm = Math.abs(H[8]) > 1e-8 ? H[8] : Math.hypot(H[6], H[7], H[8]);
      if (Math.abs(norm) < 1e-10) return null;
      for (let i = 0; i < 9; i++) H[i] /= norm;
      return H;
    }

    function applyH(H, u, v) {
      const w = H[6] * u + H[7] * v + H[8];
      if (Math.abs(w) < 1e-7) return null;
      return {
        x: (H[0] * u + H[1] * v + H[2]) / w,
        y: (H[3] * u + H[4] * v + H[5]) / w
      };
    }

    // Descobre os 2 eixos perspectivos da rede e cresce o grafo topologico (iu, iv)
    function growChessboardLattice(peaks) {
      const n = peaks.length;
      if (n < 16) return null;

      const edgesByPeak = Array.from({ length: n }, () => []);
      const numBins = 60;
      const hist = new Float64Array(numBins);

      for (let i = 0; i < n; i++) {
        const pi = peaks[i];
        const cands = [];
        for (let j = 0; j < n; j++) {
          if (i === j) continue;
          const pj = peaks[j];
          const dx = pj.x - pi.x;
          const dy = pj.y - pi.y;
          const d = Math.hypot(dx, dy);
          if (d < 6 || d > 95) continue;
          if (pi.n2x * pj.n2x + pi.n2y * pj.n2y > -0.20) continue;
          if (pi.u4 * pj.u4 + pi.v4 * pj.v4 < 0.15) continue;
          cands.push({ j, dx, dy, d });
        }
        if (cands.length === 0) continue;
        cands.sort((a, b) => a.d - b.d);
        const minD = cands[0].d;
        const limitD = minD * 2.15;
        for (let k = 0; k < cands.length && k < 6; k++) {
          const e = cands[k];
          if (e.d > limitD) break;
          edgesByPeak[i].push(e);
          let ang = Math.atan2(e.dy, e.dx);
          if (ang < 0) ang += Math.PI;
          if (ang >= Math.PI) ang -= Math.PI;
          const bin = Math.min(numBins - 1, Math.floor((ang / Math.PI) * numBins));
          hist[bin] += (pi.score + peaks[e.j].score) / (e.d + 4);
        }
      }

      const smoothHist = new Float64Array(numBins);
      for (let b = 0; b < numBins; b++) {
        const bPrev = (b + numBins - 1) % numBins;
        const bNext = (b + 1) % numBins;
        smoothHist[b] = 0.25 * hist[bPrev] + 0.5 * hist[b] + 0.25 * hist[bNext];
      }

      let bin1 = 0;
      for (let b = 1; b < numBins; b++) {
        if (smoothHist[b] > smoothHist[bin1]) bin1 = b;
      }
      if (smoothHist[bin1] <= 0) return null;
      const ang1 = ((bin1 + 0.5) / numBins) * Math.PI;

      let bin2 = -1;
      let maxH2 = -1;
      for (let b = 0; b < numBins; b++) {
        const ang = ((b + 0.5) / numBins) * Math.PI;
        let diff = Math.abs(ang - ang1);
        if (diff > Math.PI * 0.5) diff = Math.PI - diff;
        if (diff < 0.42) continue;
        if (smoothHist[b] > maxH2) {
          maxH2 = smoothHist[b];
          bin2 = b;
        }
      }
      if (bin2 < 0 || maxH2 <= 0) return null;
      const ang2 = ((bin2 + 0.5) / numBins) * Math.PI;

      const d1x = Math.cos(ang1), d1y = Math.sin(ang1);
      const d2x = Math.cos(ang2), d2y = Math.sin(ang2);

      // Seleciona sementes candidatas com vizinhos em ambos os eixos
      const seedOrder = [];
      for (let i = 0; i < n; i++) {
        if (edgesByPeak[i].length >= 2) {
          seedOrder.push({ idx: i, w: peaks[i].score * edgesByPeak[i].length });
        }
      }
      seedOrder.sort((a, b) => b.w - a.w);

      let bestLattice = null;
      const triedUsed = new Uint8Array(n);

      for (let sIdx = 0; sIdx < seedOrder.length && sIdx < 8; sIdx++) {
        const rootIdx = seedOrder[sIdx].idx;
        if (triedUsed[rootIdx]) continue;

        let initU = null, initV = null;
        for (const e of edgesByPeak[rootIdx]) {
          const ux = e.dx / e.d, uy = e.dy / e.d;
          const dot1 = ux * d1x + uy * d1y;
          const dot2 = ux * d2x + uy * d2y;
          if (Math.abs(dot1) > 0.72) {
            if (!initU || e.d < initU.d) {
              initU = dot1 >= 0 ? { x: e.dx, y: e.dy, d: e.d } : { x: -e.dx, y: -e.dy, d: e.d };
            }
          } else if (Math.abs(dot2) > 0.72) {
            if (!initV || e.d < initV.d) {
              initV = dot2 >= 0 ? { x: e.dx, y: e.dy, d: e.d } : { x: -e.dx, y: -e.dy, d: e.d };
            }
          }
        }
        if (!initU || !initV) continue;

        // Garante orientacao destra na tela: u x v > 0
        if (initU.x * initV.y - initU.y * initV.x < 0) {
          initV = { x: -initV.x, y: -initV.y, d: initV.d };
        }

        const coordMap = new Map();
        const peakUsed = new Uint8Array(n);
        const nodes = [];
        const queue = [];

        const rootNode = {
          peakIdx: rootIdx,
          iu: 0,
          iv: 0,
          x: peaks[rootIdx].x,
          y: peaks[rootIdx].y,
          ux: initU.x,
          uy: initU.y,
          vx: initV.x,
          vy: initV.y
        };
        coordMap.set('0,0', rootNode);
        peakUsed[rootIdx] = 1;
        nodes.push(rootNode);
        queue.push(rootNode);

        let qHead = 0;
        const dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]];
        while (qHead < queue.length) {
          const cur = queue[qHead++];
          const curP = peaks[cur.peakIdx];

          // Atualiza estimativa local de passo com vizinhos ja conectados
          let locUx = cur.ux, locUy = cur.uy;
          const nR = coordMap.get(`${cur.iu + 1},${cur.iv}`);
          const nL = coordMap.get(`${cur.iu - 1},${cur.iv}`);
          if (nR && nL) {
            locUx = (nR.x - nL.x) * 0.5;
            locUy = (nR.y - nL.y) * 0.5;
          } else if (nR) {
            locUx = nR.x - cur.x; locUy = nR.y - cur.y;
          } else if (nL) {
            locUx = cur.x - nL.x; locUy = cur.y - nL.y;
          }

          let locVx = cur.vx, locVy = cur.vy;
          const nD = coordMap.get(`${cur.iu},${cur.iv + 1}`);
          const nU = coordMap.get(`${cur.iu},${cur.iv - 1}`);
          if (nD && nU) {
            locVx = (nD.x - nU.x) * 0.5;
            locVy = (nD.y - nU.y) * 0.5;
          } else if (nD) {
            locVx = nD.x - cur.x; locVy = nD.y - cur.y;
          } else if (nU) {
            locVx = cur.x - nU.x; locVy = cur.y - nU.y;
          }

          const stepMin = Math.min(Math.hypot(locUx, locUy), Math.hypot(locVx, locVy));
          const searchR = Math.max(4.5, stepMin * 0.42);

          for (let dIdx = 0; dIdx < 4; dIdx++) {
            const du = dirs[dIdx][0];
            const dv = dirs[dIdx][1];
            const niu = cur.iu + du;
            const niv = cur.iv + dv;
            const key = `${niu},${niv}`;
            if (coordMap.has(key)) continue;

            const stepVecX = du * locUx + dv * locVx;
            const stepVecY = du * locUy + dv * locVy;
            const ex = cur.x + stepVecX;
            const ey = cur.y + stepVecY;
            const stepLen = Math.hypot(stepVecX, stepVecY);
            if (stepLen < 5) continue;

            let bestJ = -1;
            let bestDist = searchR;
            for (let j = 0; j < n; j++) {
              if (peakUsed[j]) continue;
              const pj = peaks[j];
              if (curP.n2x * pj.n2x + curP.n2y * pj.n2y > -0.15) continue;
              const dist = Math.hypot(pj.x - ex, pj.y - ey);
              if (dist < bestDist) {
                const vx = pj.x - cur.x;
                const vy = pj.y - cur.y;
                const vLen = Math.hypot(vx, vy);
                if (vLen > 4 && (vx * stepVecX + vy * stepVecY) / (vLen * stepLen) > 0.72) {
                  bestDist = dist;
                  bestJ = j;
                }
              }
            }

            if (bestJ >= 0) {
              const pj = peaks[bestJ];
              const nextNode = {
                peakIdx: bestJ,
                iu: niu,
                iv: niv,
                x: pj.x,
                y: pj.y,
                ux: du !== 0 ? (pj.x - cur.x) * du : locUx,
                uy: du !== 0 ? (pj.y - cur.y) * du : locUy,
                vx: dv !== 0 ? (pj.x - cur.x) * dv : locVx,
                vy: dv !== 0 ? (pj.y - cur.y) * dv : locVy
              };
              coordMap.set(key, nextNode);
              peakUsed[bestJ] = 1;
              triedUsed[bestJ] = 1;
              nodes.push(nextNode);
              queue.push(nextNode);
            }
          }
        }

        if (nodes.length >= 16) {
          let minIu = Infinity, maxIu = -Infinity, minIv = Infinity, maxIv = -Infinity;
          for (const nd of nodes) {
            if (nd.iu < minIu) minIu = nd.iu;
            if (nd.iu > maxIu) maxIu = nd.iu;
            if (nd.iv < minIv) minIv = nd.iv;
            if (nd.iv > maxIv) maxIv = nd.iv;
          }
          if ((maxIu - minIu) >= 3 && (maxIv - minIv) >= 3) {
            if (!bestLattice || nodes.length > bestLattice.nodes.length) {
              bestLattice = { nodes, minIu, maxIu, minIv, maxIv, coordMap };
              if (nodes.length >= 42) break;
            }
          }
        }
      }

      return bestLattice;
    }

    function sampleSquareMean5(buf, H, u, v, w, h) {
      const p = applyH(H, u, v);
      if (!p) return -1;
      return sampleBilinearGray(buf, p.x, p.y, w, h);
    }

    function findExact8x8BoardFromLattice(smoothGray, peaks, w, h) {
      const lattice = growChessboardLattice(peaks);
      if (!lattice) return null;

      // Ajuste inicial da homografia H_lat sobre os nos conectados
      let srcPts = lattice.nodes.map(nd => ({ u: nd.iu, v: nd.iv }));
      let dstPts = lattice.nodes.map(nd => ({ x: nd.x, y: nd.y }));
      let wts = lattice.nodes.map(nd => peaks[nd.peakIdx].score);
      let H = fitHomographyDLT(srcPts, dstPts, wts);
      if (!H) return null;

      // Recolhe todos os picos internos perdidos usando H_lat + verifica paridade de polaridade
      const rootNode = lattice.nodes[0];
      const rootPar = ((rootNode.iu + rootNode.iv) & 1);
      const rootN2x = peaks[rootNode.peakIdx].n2x;
      const rootN2y = peaks[rootNode.peakIdx].n2y;

      const uLo = lattice.minIu - 2;
      const uHi = lattice.maxIu + 2;
      const vLo = lattice.minIv - 2;
      const vHi = lattice.maxIv + 2;

      const harvested = [];
      const usedHarvestPeak = new Uint8Array(peaks.length);
      for (let iv = vLo; iv <= vHi; iv++) {
        for (let iu = uLo; iu <= uHi; iu++) {
          const pred = applyH(H, iu, iv);
          if (!pred || pred.x < 6 || pred.x >= w - 6 || pred.y < 6 || pred.y >= h - 6) continue;
          const expectedPolSign = (((iu + iv) & 1) === rootPar) ? 1 : -1;
          let bestIdx = -1;
          let bestD = 3.8;
          for (let j = 0; j < peaks.length; j++) {
            if (usedHarvestPeak[j]) continue;
            const pj = peaks[j];
            const polDot = (pj.n2x * rootN2x + pj.n2y * rootN2y) * expectedPolSign;
            if (polDot < 0.25) continue;
            const d = Math.hypot(pj.x - pred.x, pj.y - pred.y);
            if (d < bestD) {
              bestD = d;
              bestIdx = j;
            }
          }
          if (bestIdx >= 0) {
            usedHarvestPeak[bestIdx] = 1;
            harvested.push({ iu, iv, peak: peaks[bestIdx] });
          }
        }
      }

      if (harvested.length < 16) return null;
      H = fitHomographyDLT(
        harvested.map(m => ({ u: m.iu, v: m.iv })),
        harvested.map(m => ({ x: m.peak.x, y: m.peak.y })),
        harvested.map(m => m.peak.score)
      );
      if (!H) return null;

      // Filtra outliers (> 2.5px) e recalcula limites reais da rede
      const inliers = [];
      let minIu = Infinity, maxIu = -Infinity, minIv = Infinity, maxIv = -Infinity;
      for (const m of harvested) {
        const p = applyH(H, m.iu, m.iv);
        if (!p) continue;
        if (Math.hypot(p.x - m.peak.x, p.y - m.peak.y) < 2.6) {
          inliers.push(m);
          if (m.iu < minIu) minIu = m.iu;
          if (m.iu > maxIu) maxIu = m.iu;
          if (m.iv < minIv) minIv = m.iv;
          if (m.iv > maxIv) maxIv = m.iv;
        }
      }
      if (inliers.length < 16 || (maxIu - minIu) < 3 || (maxIv - minIv) < 3) return null;

      H = fitHomographyDLT(
        inliers.map(m => ({ u: m.iu, v: m.iv })),
        inliers.map(m => ({ x: m.peak.x, y: m.peak.y })),
        inliers.map(m => m.peak.score)
      );
      if (!H) return null;

      // Procura a janela exata 8x8 (u0..u0+8, v0..v0+8) onde os 49 cantos internos sao (u0+1..u0+7, v0+1..v0+7)
      const inlierSet = new Set(inliers.map(m => `${m.iu},${m.iv}`));
      const spanU = maxIu - minIu;
      const spanV = maxIv - minIv;
      const u0Start = spanU >= 6 ? Math.min(minIu - 1, maxIu - 7) : minIu - (7 - spanU);
      const u0End = spanU >= 6 ? Math.max(minIu - 1, maxIu - 7) : minIu - 1;
      const v0Start = spanV >= 6 ? Math.min(minIv - 1, maxIv - 7) : minIv - (7 - spanV);
      const v0End = spanV >= 6 ? Math.max(minIv - 1, maxIv - 7) : minIv - 1;

      let bestWin = null;
      const cellLums = new Float64Array(64);

      for (let u0 = u0Start; u0 <= u0End; u0++) {
        for (let v0 = v0Start; v0 <= v0End; v0++) {
          let cornersInWin = 0;
          for (let r = 1; r <= 7; r++) {
            for (let c = 1; c <= 7; c++) {
              if (inlierSet.has(`${u0 + c},${v0 + r}`)) cornersInWin++;
            }
          }
          if (cornersInWin < 16) continue;

          let validCells = 0;
          let evenSum = 0, evenCnt = 0, oddSum = 0, oddCnt = 0;
          for (let r = 0; r < 8; r++) {
            for (let c = 0; c < 8; c++) {
              const lum = sampleSquareMean5(smoothGray, H, u0 + c + 0.5, v0 + r + 0.5, w, h);
              cellLums[r * 8 + c] = lum;
              if (lum >= 0) {
                validCells++;
                if (((r + c) & 1) === 0) { evenSum += lum; evenCnt++; }
                else { oddSum += lum; oddCnt++; }
              }
            }
          }
          if (validCells < 52 || evenCnt < 20 || oddCnt < 20) continue;

          let signedAlt = 0, pairs = 0, consistentPairs = 0;
          for (let r = 0; r < 8; r++) {
            for (let c = 0; c < 8; c++) {
              const l0 = cellLums[r * 8 + c];
              if (l0 < 0) continue;
              const parity = ((r + c) & 1) === 0 ? 1 : -1;
              if (c < 7 && cellLums[r * 8 + c + 1] >= 0) {
                const d = (l0 - cellLums[r * 8 + c + 1]) * parity;
                signedAlt += d;
                pairs++;
                if (Math.abs(d) > 8) consistentPairs++;
              }
              if (r < 7 && cellLums[(r + 1) * 8 + c] >= 0) {
                const d = (l0 - cellLums[(r + 1) * 8 + c]) * parity;
                signedAlt += d;
                pairs++;
                if (Math.abs(d) > 8) consistentPairs++;
              }
            }
          }
          if (pairs < 64) continue;
          const interiorContrast = Math.abs(signedAlt) / pairs;
          const consistentRatio = consistentPairs / pairs;
          if (consistentRatio < 0.68 || interiorContrast < 10) continue;

          // Penaliza se imediatamente fora da janela 8x8 ainda houver casas alternadas do xadrez
          const expectedPhaseSign = signedAlt >= 0 ? 1 : -1;
          let extMatch = 0, extCnt = 0;
          const extStrips = [
            { isCol: true, outCoord: -0.5, inIdx: 0 },
            { isCol: true, outCoord: 8.5, inIdx: 7 },
            { isCol: false, outCoord: -0.5, inIdx: 0 },
            { isCol: false, outCoord: 8.5, inIdx: 7 }
          ];
          for (const st of extStrips) {
            for (let k = 0; k < 8; k++) {
              const r = st.isCol ? k : st.inIdx;
              const c = st.isCol ? st.inIdx : k;
              const inLum = cellLums[r * 8 + c];
              if (inLum < 0) continue;
              const uS = st.isCol ? (u0 + st.outCoord) : (u0 + c + 0.5);
              const vS = st.isCol ? (v0 + r + 0.5) : (v0 + st.outCoord);
              const outLum = sampleSquareMean5(smoothGray, H, uS, vS, w, h);
              if (outLum < 0) continue;
              const parity = ((r + c) & 1) === 0 ? 1 : -1;
              const diff = (inLum - outLum) * parity * expectedPhaseSign;
              if (diff > interiorContrast * 0.45) {
                extMatch += Math.min(interiorContrast, diff);
              }
              extCnt++;
            }
          }
          const extPenalty = extCnt > 0 ? (extMatch / extCnt) : 0;
          const winScore = interiorContrast * consistentRatio + 4.5 * cornersInWin - 0.9 * extPenalty;

          if (!bestWin || winScore > bestWin.winScore) {
            bestWin = {
              u0, v0, winScore,
              interiorContrast,
              consistentRatio,
              evenMean: evenSum / evenCnt,
              oddMean: oddSum / oddCnt,
              cornersInWin
            };
          }
        }
      }

      if (!bestWin) return null;

      // Extrai os 4 cantos externos [0..8]^2 e todos os cantos internos pareados [1..7]^2
      const cvOuter = [
        applyH(H, bestWin.u0, bestWin.v0),
        applyH(H, bestWin.u0 + 8, bestWin.v0),
        applyH(H, bestWin.u0 + 8, bestWin.v0 + 8),
        applyH(H, bestWin.u0, bestWin.v0 + 8)
      ];
      if (cvOuter.some(p => !p)) return null;

      const innerMatched = [];
      for (const m of inliers) {
        const ci = m.iu - bestWin.u0;
        const ri = m.iv - bestWin.v0;
        if (ci >= 1 && ci <= 7 && ri >= 1 && ri <= 7) {
          innerMatched.push({ ci, ri, cvX: m.peak.x, cvY: m.peak.y });
        }
      }

      return {
        cvOuter,
        innerMatched,
        evenMean: bestWin.evenMean,
        oddMean: bestWin.oddMean,
        contrast: bestWin.interiorContrast,
        score: bestWin.winScore
      };
    }

    function orientQuadWithQueenParity(det, mapCvToScreenFn, prevQuad) {
      const scrOuter = det.cvOuter.map(p => mapCvToScreenFn((p.x + 0.5) / cvW, (p.y + 0.5) / cvH));
      const scrInner = det.innerMatched.map(m => {
        const sp = mapCvToScreenFn((m.cvX + 0.5) / cvW, (m.cvY + 0.5) / cvH);
        return { ci: m.ci, ri: m.ri, sx: sp.x, sy: sp.y };
      });

      // 1) Garante ordem horaria na tela (Y para baixo -> area assinada positiva)
      const area2 =
        (scrOuter[1].x - scrOuter[0].x) * (scrOuter[2].y - scrOuter[0].y) -
        (scrOuter[1].y - scrOuter[0].y) * (scrOuter[2].x - scrOuter[0].x);

      let corners = scrOuter;
      let inner = scrInner;
      if (area2 < 0) {
        corners = [scrOuter[0], scrOuter[3], scrOuter[2], scrOuter[1]];
        inner = scrInner.map(m => ({ ci: m.ri, ri: m.ci, sx: m.sx, sy: m.sy }));
      }

      // 2) Garante que (r+c)%2 === 0 (casas a8, h1 e d1 Rainha Branca) caia nas casas CLARAS reais!
      // Shift k=0 ou k=2 preserva a paridade; k=1 ou k=3 inverte a paridade.
      const parityShifts = det.evenMean >= det.oddMean ? [0, 2] : [1, 3];

      let chosenShift = parityShifts[0];
      if (prevQuad) {
        const pDx = prevQuad[1].x - prevQuad[0].x;
        const pDy = prevQuad[1].y - prevQuad[0].y;
        let bestDot = -Infinity;
        for (const k of parityShifts) {
          const q0 = corners[k];
          const q1 = corners[(k + 1) % 4];
          const dot = (q1.x - q0.x) * pDx + (q1.y - q0.y) * pDy;
          if (dot > bestDot) {
            bestDot = dot;
            chosenShift = k;
          }
        }
      } else {
        // Sem trava anterior: coloca as Brancas (aresta inferior q3-q2) mais embaixo da tela
        let bestBottomScore = -Infinity;
        for (const k of parityShifts) {
          const q0 = corners[k];
          const q1 = corners[(k + 1) % 4];
          const q2 = corners[(k + 2) % 4];
          const q3 = corners[(k + 3) % 4];
          const bottomScore = (q2.y + q3.y) - (q0.y + q1.y);
          if (bottomScore > bestBottomScore) {
            bestBottomScore = bottomScore;
            chosenShift = k;
          }
        }
      }

      const orientedQuad = [
        corners[chosenShift],
        corners[(chosenShift + 1) % 4],
        corners[(chosenShift + 2) % 4],
        corners[(chosenShift + 3) % 4]
      ];

      let orientedInner = inner;
      for (let s = 0; s < chosenShift; s++) {
        orientedInner = orientedInner.map(m => ({
          ci: m.ri,
          ri: 8 - m.ci,
          sx: m.sx,
          sy: m.sy
        }));
      }

      return { screenQuad: orientedQuad, matchedInner: orientedInner };
    }

    // =========================================================================
    // SOLVER RIGIDO 6DoF COM ESCORÇO ANALITICO + REFINAMENTO GAUSS-NEWTON PnP
    // =========================================================================
    function solveLinearSystem(A, b, n) {
      for (let col = 0; col < n; col++) {
        let maxRow = col;
        let maxVal = Math.abs(A[col * n + col]);
        for (let row = col + 1; row < n; row++) {
          const v = Math.abs(A[row * n + col]);
          if (v > maxVal) { maxVal = v; maxRow = row; }
        }
        if (maxVal < 1e-11) return null;
        if (maxRow !== col) {
          for (let k = col; k < n; k++) {
            const tmp = A[col * n + k]; A[col * n + k] = A[maxRow * n + k]; A[maxRow * n + k] = tmp;
          }
          const tb = b[col]; b[col] = b[maxRow]; b[maxRow] = tb;
        }
        const piv = A[col * n + col];
        for (let row = col + 1; row < n; row++) {
          const f = A[row * n + col] / piv;
          b[row] -= f * b[col];
          for (let k = col; k < n; k++) A[row * n + k] -= f * A[col * n + k];
        }
      }
      const x = new Float64Array(n);
      for (let row = n - 1; row >= 0; row--) {
        let s = b[row];
        for (let k = row + 1; k < n; k++) s -= A[row * n + k] * x[k];
        x[row] = s / A[row * n + row];
      }
      return x;
    }

    function solveHomographySquare4(dstPts) {
      const srcU = [-4, 4, 4, -4];
      const srcV = [-4, -4, 4, 4];
      const A = new Float64Array(64);
      const b = new Float64Array(8);
      for (let i = 0; i < 4; i++) {
        const u = srcU[i], v = srcV[i];
        const X = dstPts[i].x, Y = dstPts[i].y;
        const r0 = (2 * i) * 8;
        A[r0 + 0] = u; A[r0 + 1] = v; A[r0 + 2] = 1;
        A[r0 + 6] = -u * X; A[r0 + 7] = -v * X;
        b[2 * i] = X;
        const r1 = (2 * i + 1) * 8;
        A[r1 + 3] = u; A[r1 + 4] = v; A[r1 + 5] = 1;
        A[r1 + 6] = -u * Y; A[r1 + 7] = -v * Y;
        b[2 * i + 1] = Y;
      }
      return solveLinearSystem(A, b, 8);
    }

    function cross3(ax, ay, az, bx, by, bz) {
      return [ay * bz - az * by, az * bx - ax * bz, ax * by - ay * bx];
    }

    function norm3(x, y, z) {
      const l = Math.hypot(x, y, z);
      return l > 1e-12 ? [x / l, y / l, z / l] : [0, 0, 0];
    }

    function orthonormalizeBasisXZ(rx, ry, rz) {
      let [xx, xy, xz] = norm3(rx[0], rx[1], rx[2]);
      let [zx, zy, zz] = norm3(rz[0], rz[1], rz[2]);
      const [sx, sy, sz] = norm3(xx + zx, xy + zy, xz + zz);
      const [dx, dy, dz] = norm3(xx - zx, xy - zy, xz - zz);
      [xx, xy, xz] = norm3(sx + dx, sy + dy, sz + dz);
      [zx, zy, zz] = norm3(sx - dx, sy - dy, sz - dz);
      const [yx, yy, yz] = norm3(...cross3(zx, zy, zz, xx, xy, xz));
      // Matriz column-major [rx | ry | rz]
      return [
        xx, yx, zx,
        xy, yy, zy,
        xz, yz, zz
      ];
    }

    function mulMat3(A, B) {
      const C = new Float64Array(9);
      for (let r = 0; r < 3; r++) {
        for (let c = 0; c < 3; c++) {
          C[r * 3 + c] = A[r * 3 + 0] * B[c] + A[r * 3 + 1] * B[3 + c] + A[r * 3 + 2] * B[6 + c];
        }
      }
      return C;
    }

    function rotMatFromExpVec(wx, wy, wz) {
      const theta = Math.hypot(wx, wy, wz);
      if (theta < 1e-10) {
        return [
          1, -wz, wy,
          wz, 1, -wx,
          -wy, wx, 1
        ];
      }
      const kx = wx / theta, ky = wy / theta, kz = wz / theta;
      const c = Math.cos(theta), s = Math.sin(theta), v = 1 - c;
      return [
        kx * kx * v + c,      kx * ky * v - kz * s, kx * kz * v + ky * s,
        ky * kx * v + kz * s, ky * ky * v + c,      ky * kz * v - kx * s,
        kz * kx * v - ky * s, kz * ky * v + kx * s, kz * kz * v + c
      ];
    }

    function evalObsReprojSSE(pos, R, obs, sw, sh, tX, tY, outPred) {
      let sse = 0;
      const halfW = sw * 0.5, halfH = sh * 0.5;
      for (let i = 0; i < obs.length; i++) {
        const o = obs[i];
        const xc = R[0] * o.lx + R[2] * o.lz + pos[0];
        const yc = R[3] * o.lx + R[5] * o.lz + pos[1];
        const zc = R[6] * o.lx + R[8] * o.lz + pos[2];
        if (zc > -0.15) return Infinity;
        const invZ = 1.0 / (-zc);
        const px = ((xc * invZ) / tX + 1.0) * halfW;
        const py = (-(yc * invZ) / tY + 1.0) * halfH;
        if (outPred) {
          outPred[2 * i] = px;
          outPred[2 * i + 1] = py;
        }
        const ex = px - o.sx;
        const ey = py - o.sy;
        sse += ex * ex + ey * ey;
      }
      return sse;
    }

    function refinePnPGaussNewton(pos, R, obs, sw, sh, tX, tY, iters = 8) {
      const curPos = [pos[0], pos[1], pos[2]];
      let curR = Float64Array.from(R);
      const pred0 = new Float64Array(obs.length * 2);
      const predP = new Float64Array(obs.length * 2);
      let curSSE = evalObsReprojSSE(curPos, curR, obs, sw, sh, tX, tY, pred0);
      if (!Number.isFinite(curSSE)) return { pos: curPos, R: curR, rmse: Infinity };

      let lambda = 1e-3;
      const epsPos = 1e-4;
      const epsRot = 1e-5;

      for (let it = 0; it < iters; it++) {
        const JTJ = new Float64Array(36);
        const JTr = new Float64Array(6);

        const cols = [];
        for (let k = 0; k < 6; k++) {
          const pTest = [curPos[0], curPos[1], curPos[2]];
          let rTest = curR;
          const eps = k < 3 ? epsPos : epsRot;
          if (k === 0) pTest[0] += eps;
          else if (k === 1) pTest[1] += eps;
          else if (k === 2) pTest[2] += eps;
          else if (k === 3) rTest = mulMat3(rotMatFromExpVec(eps, 0, 0), curR);
          else if (k === 4) rTest = mulMat3(rotMatFromExpVec(0, eps, 0), curR);
          else rTest = mulMat3(rotMatFromExpVec(0, 0, eps), curR);

          const sseP = evalObsReprojSSE(pTest, rTest, obs, sw, sh, tX, tY, predP);
          const colArr = new Float64Array(obs.length * 2);
          if (Number.isFinite(sseP)) {
            for (let m = 0; m < colArr.length; m++) colArr[m] = (predP[m] - pred0[m]) / eps;
          }
          cols.push(colArr);
        }

        for (let a = 0; a < 6; a++) {
          const ca = cols[a];
          let rhs = 0;
          for (let m = 0; m < obs.length; m++) {
            const rx = pred0[2 * m] - obs[m].sx;
            const ry = pred0[2 * m + 1] - obs[m].sy;
            rhs += ca[2 * m] * rx + ca[2 * m + 1] * ry;
          }
          JTr[a] = -rhs;
          for (let b = a; b < 6; b++) {
            const cb = cols[b];
            let s = 0;
            for (let m = 0; m < ca.length; m++) s += ca[m] * cb[m];
            JTJ[a * 6 + b] = s;
            JTJ[b * 6 + a] = s;
          }
        }

        for (let a = 0; a < 6; a++) {
          JTJ[a * 6 + a] += lambda * Math.max(1e-6, JTJ[a * 6 + a]);
        }

        const delta = solveLinearSystem(JTJ, JTr, 6);
        if (!delta) { lambda *= 5; continue; }

        const candPos = [curPos[0] + delta[0], curPos[1] + delta[1], curPos[2] + delta[2]];
        const candR = mulMat3(rotMatFromExpVec(delta[3], delta[4], delta[5]), curR);
        const candSSE = evalObsReprojSSE(candPos, candR, obs, sw, sh, tX, tY, predP);

        if (candSSE < curSSE) {
          curPos[0] = candPos[0]; curPos[1] = candPos[1]; curPos[2] = candPos[2];
          curR = candR;
          curSSE = candSSE;
          pred0.set(predP);
          lambda = Math.max(1e-6, lambda * 0.35);
          let stepNorm = 0;
          for (let a = 0; a < 6; a++) stepNorm += delta[a] * delta[a];
          if (stepNorm < 1e-10) break;
        } else {
          lambda *= 4.5;
        }
      }

      const finalR = orthonormalizeBasisXZ([curR[0], curR[3], curR[6]], [curR[1], curR[4], curR[7]], [curR[2], curR[5], curR[8]]);
      const finalSSE = evalObsReprojSSE(curPos, finalR, obs, sw, sh, tX, tY, null);
      return { pos: curPos, R: finalR, rmse: Math.sqrt(finalSSE / Math.max(1, obs.length)) };
    }

    const _poseMat4 = new THREE.Matrix4();

    function solveExactBoard6DoFPose(screenQuad, sw, sh, fovDeg, outPos, outQuat, matchedInner = null) {
      if (sw < 10 || sh < 10) return false;

      // Verifica convexidade minima do quadrilatero
      const area2 =
        (screenQuad[1].x - screenQuad[0].x) * (screenQuad[2].y - screenQuad[0].y) -
        (screenQuad[1].y - screenQuad[0].y) * (screenQuad[2].x - screenQuad[0].x) +
        (screenQuad[2].x - screenQuad[0].x) * (screenQuad[3].y - screenQuad[0].y) -
        (screenQuad[2].y - screenQuad[0].y) * (screenQuad[3].x - screenQuad[0].x);
      if (Math.abs(area2) < 400) return false;

      const tY = Math.tan((fovDeg * Math.PI / 180) * 0.5);
      const aspect = sw / sh;
      const tX = tY * aspect;

      const rays = screenQuad.map(p => ({
        x: ((p.x / sw) * 2.0 - 1.0) * tX,
        y: (-(p.y / sh) * 2.0 + 1.0) * tY
      }));

      const hCam = solveHomographySquare4(rays);
      if (!hCam) return false;

      // Rotaciona o referencial para que o centro do tabuleiro fique no eixo optico -Z'
      const [fx, fy, fz] = norm3(hCam[2], hCam[5], -1.0);
      const bzx = -fx, bzy = -fy, bzz = -fz;
      let [bxx, bxy, bxz] = norm3(bzz, 0, -bzx);
      if (Math.hypot(bxx, bxy, bxz) < 0.5) { bxx = 1; bxy = 0; bxz = 0; }
      const [byx, byy, byz] = norm3(...cross3(bzx, bzy, bzz, bxx, bxy, bxz));

      // Matriz R_view = [bx | by | bz]
      const Rview = [
        bxx, byx, bzx,
        bxy, byy, bzy,
        bxz, byz, bzz
      ];

      const primeRays = [];
      for (let i = 0; i < 4; i++) {
        const dx = rays[i].x, dy = rays[i].y, dz = -1.0;
        const px = bxx * dx + bxy * dy + bxz * dz;
        const py = byx * dx + byy * dy + byz * dz;
        const pz = bzx * dx + bzy * dy + bzz * dz;
        if (pz > -0.05) return false;
        primeRays.push({ x: px / (-pz), y: py / (-pz) });
      }

      const hp = solveHomographySquare4(primeRays);
      if (!hp) return false;

      // Jacobiano 2D no eixo optico central -> recuperacao exata de escorço e profundidade
      const a0 = hp[0] - hp[2] * hp[6];
      const a1 = hp[3] - hp[5] * hp[6];
      const b0 = hp[1] - hp[2] * hp[7];
      const b1 = hp[4] - hp[5] * hp[7];

      const A = a0 * a0 + a1 * a1;
      const B = b0 * b0 + b1 * b1;
      const C = a0 * b0 + a1 * b1;
      const disc = Math.sqrt(Math.max(0, (A - B) * (A - B) + 4 * C * C));
      const s2 = ((A + B) + disc) * 0.5;
      const s = Math.sqrt(Math.max(1e-10, s2));

      const tzP = -1.0 / s;
      if (!Number.isFinite(tzP) || tzP > -3.0 || tzP < -45.0) return false;
      const txP = hp[2] / s;
      const tyP = hp[5] / s;

      const rxX = a0 / s, rxY = a1 / s;
      const rzX = b0 / s, rzY = b1 / s;

      const z1Mag = Math.sqrt(Math.max(0, 1.0 - A / s2));
      const z2Mag = Math.sqrt(Math.max(0, 1.0 - B / s2));
      let z1Base, z2Base;
      if (z1Mag >= z2Mag) {
        z1Base = z1Mag;
        z2Base = (C <= 0 ? 1 : -1) * z2Mag;
      } else {
        z2Base = z2Mag;
        z1Base = (C <= 0 ? 1 : -1) * z1Mag;
      }

      // Observacoes para PnP Gauss-Newton: usa todos os cantos internos pareados se disponiveis, ou os 4 cantos externos
      const obs = (matchedInner && matchedInner.length >= 8)
        ? matchedInner.map(m => ({ lx: m.ci - 4, lz: m.ri - 4, sx: m.sx, sy: m.sy }))
        : [
            { lx: -4, lz: -4, sx: screenQuad[0].x, sy: screenQuad[0].y },
            { lx: 4, lz: -4, sx: screenQuad[1].x, sy: screenQuad[1].y },
            { lx: 4, lz: 4, sx: screenQuad[2].x, sy: screenQuad[2].y },
            { lx: -4, lz: 4, sx: screenQuad[3].x, sy: screenQuad[3].y }
          ];

      let bestSol = null;
      for (const sgn of [1, -1]) {
        const Rp = orthonormalizeBasisXZ(
          [rxX, rxY, sgn * z1Base],
          [0, 1, 0],
          [rzX, rzY, sgn * z2Base]
        );
        // Normal do tabuleiro deve apontar para a camera (ry_p.z > 0)
        if (Rp[7] < 0.02) continue;

        const posCam = [
          Rview[0] * txP + Rview[1] * tyP + Rview[2] * tzP,
          Rview[3] * txP + Rview[4] * tyP + Rview[5] * tzP,
          Rview[6] * txP + Rview[7] * tyP + Rview[8] * tzP
        ];
        const Rcam = mulMat3(Rview, Rp);
        const sol = refinePnPGaussNewton(posCam, Rcam, obs, sw, sh, tX, tY, 8);
        if (!Number.isFinite(sol.rmse) || sol.pos[2] > -3.0 || sol.pos[2] < -45.0) continue;

        // Verifica que normal do tabuleiro aponta para a camera (-pos)
        const nDotCam = sol.R[1] * (-sol.pos[0]) + sol.R[4] * (-sol.pos[1]) + sol.R[7] * (-sol.pos[2]);
        if (nDotCam <= 0) continue;

        // Em casos quase ortograficos (diferenca < 0.35px), prefere normal voltada para cima (ry > 0)
        if (!bestSol || (sol.rmse + 0.35 < bestSol.rmse) || (Math.abs(sol.rmse - bestSol.rmse) <= 0.35 && sol.R[4] > bestSol.R[4])) {
          bestSol = sol;
        }
      }

      if (!bestSol) return false;

      outPos.set(bestSol.pos[0], bestSol.pos[1], bestSol.pos[2]);
      _poseMat4.set(
        bestSol.R[0], bestSol.R[1], bestSol.R[2], 0,
        bestSol.R[3], bestSol.R[4], bestSol.R[5], 0,
        bestSol.R[6], bestSol.R[7], bestSol.R[8], 0,
        0, 0, 0, 1
      );
      outQuat.setFromRotationMatrix(_poseMat4).normalize();
      return true;
    }

    // =========================================================================
    // RASTREAMENTO PREDITIVO LOCAL QUANDO O TABULEIRO ESTA TRAVADO (ESTILO POKEMON GO)
    // =========================================================================
    const _projTmp = new THREE.Vector3();
    const _trackMatrix = new THREE.Matrix4();
    const _unitScale = new THREE.Vector3(1, 1, 1);

    function projectLocalPointWithPose(pos, quat, lx, ly, lz, sw, sh, fovDeg) {
      _trackMatrix.compose(pos, quat, _unitScale);
      _projTmp.set(lx, ly, lz).applyMatrix4(_trackMatrix);
      if (_projTmp.z > -0.2) return null;
      const tY = Math.tan((fovDeg * Math.PI / 180) * 0.5);
      const tX = tY * (sw / Math.max(sh, 1));
      const invZ = 1.0 / (-_projTmp.z);
      return {
        x: ((_projTmp.x * invZ) / tX * 0.5 + 0.5) * sw,
        y: (-(_projTmp.y * invZ) / tY * 0.5 + 0.5) * sh
      };
    }

    function videoToScreen(nx, ny) {
      const sw = window.innerWidth;
      const sh = window.innerHeight;
      const vw = videoEl.videoWidth || 1280;
      const vh = videoEl.videoHeight || 720;
      const scale = Math.max(sw / vw, sh / vh);
      const dw = vw * scale;
      const dh = vh * scale;
      const ox = (sw - dw) * 0.5;
      const oy = (sh - dh) * 0.5;
      const px = appState.mirrorVideo ? ox + (1 - nx) * dw : ox + nx * dw;
      const py = oy + ny * dh;
      return { x: px, y: py };
    }

    function screenToCv(sx, sy) {
      const sw = window.innerWidth;
      const sh = window.innerHeight;
      const vw = videoEl.videoWidth || 1280;
      const vh = videoEl.videoHeight || 720;
      const scale = Math.max(sw / vw, sh / vh);
      const dw = vw * scale;
      const dh = vh * scale;
      const ox = (sw - dw) * 0.5;
      const oy = (sh - dh) * 0.5;
      let nx = (sx - ox) / dw;
      if (appState.mirrorVideo) nx = 1 - nx;
      const ny = (sy - oy) / dh;
      return { x: nx * cvW - 0.5, y: ny * cvH - 0.5 };
    }

    function trackLockedRealBoard(smoothGray, peaks, sw, sh, fovDeg) {
      if (peaks.length < 10) return { ok: false };

      const predInner = [];
      for (let ri = 1; ri <= 7; ri++) {
        for (let ci = 1; ci <= 7; ci++) {
          const sp = projectLocalPointWithPose(appState.targetPos, appState.targetQuat, ci - 4, 0, ri - 4, sw, sh, fovDeg);
          if (!sp) continue;
          const cvPt = screenToCv(sp.x, sp.y);
          if (cvPt.x < 8 || cvPt.x >= cvW - 8 || cvPt.y < 8 || cvPt.y >= cvH - 8) continue;
          predInner.push({ ci, ri, predSx: sp.x, predSy: sp.y, cvX: cvPt.x, cvY: cvPt.y });
        }
      }
      if (predInner.length < 12) return { ok: false };

      // Estima deslocamento global rapido (pan) entre picos previstos e picos detectados
      const searchRad = 11.0;
      const roughMatches = [];
      for (let i = 0; i < predInner.length; i++) {
        const pr = predInner[i];
        let bestJ = -1, bestD = searchRad;
        for (let j = 0; j < peaks.length; j++) {
          const d = Math.hypot(peaks[j].x - pr.cvX, peaks[j].y - pr.cvY);
          if (d < bestD) { bestD = d; bestJ = j; }
        }
        if (bestJ >= 0) {
          roughMatches.push({
            pr,
            peak: peaks[bestJ],
            dx: peaks[bestJ].x - pr.cvX,
            dy: peaks[bestJ].y - pr.cvY
          });
        }
      }

      if (roughMatches.length < 10) return { ok: false };

      const dxs = roughMatches.map(m => m.dx).sort((a, b) => a - b);
      const dys = roughMatches.map(m => m.dy).sort((a, b) => a - b);
      const medDx = dxs[dxs.length >> 1];
      const medDy = dys[dys.length >> 1];

      // Remapeia cada canto interno usando a compensacao mediana de pan
      const matched = [];
      const usedPk = new Uint8Array(peaks.length);
      for (let i = 0; i < predInner.length; i++) {
        const pr = predInner[i];
        const cx = pr.cvX + medDx;
        const cy = pr.cvY + medDy;
        let bestJ = -1, bestD = 4.5;
        for (let j = 0; j < peaks.length; j++) {
          if (usedPk[j]) continue;
          const d = Math.hypot(peaks[j].x - cx, peaks[j].y - cy);
          if (d < bestD) { bestD = d; bestJ = j; }
        }
        if (bestJ >= 0) {
          usedPk[bestJ] = 1;
          matched.push({ pr, peak: peaks[bestJ] });
        }
      }
      if (matched.length < 12) return { ok: false };

      // Verifica consistencia de polaridade com paridade (ci + ri) % 2
      let polVotesX = 0, polVotesY = 0;
      for (const m of matched) {
        const sign = (((m.pr.ci + m.pr.ri) & 1) === 0) ? 1 : -1;
        polVotesX += m.peak.n2x * sign;
        polVotesY += m.peak.n2y * sign;
      }
      const polLen = Math.hypot(polVotesX, polVotesY);
      if (polLen < matched.length * 0.45) return { ok: false };
      const refPx = polVotesX / polLen;
      const refPy = polVotesY / polLen;

      const cleanMatches = matched.filter(m => {
        const sign = (((m.pr.ci + m.pr.ri) & 1) === 0) ? 1 : -1;
        return (m.peak.n2x * refPx + m.peak.n2y * refPy) * sign > 0.25;
      });
      if (cleanMatches.length < 12) return { ok: false };

      // Calcula deslocamento medio na tela em pixels para o Deadband Anti-Tremor!
      const screenObs = [];
      let sumShiftPx = 0;
      for (const m of cleanMatches) {
        const sp = videoToScreen((m.peak.x + 0.5) / cvW, (m.peak.y + 0.5) / cvH);
        const shiftPx = Math.hypot(sp.x - m.pr.predSx, sp.y - m.pr.predSy);
        sumShiftPx += shiftPx;
        screenObs.push({ ci: m.pr.ci, ri: m.pr.ri, sx: sp.x, sy: sp.y, score: m.peak.score });
      }
      const meanShiftPx = sumShiftPx / screenObs.length;

      // DEADBAND ESTILO POKEMON GO: abaixo de 1.7px de movimento medio, mantem pose 100% congelada sem tremor!
      if (meanShiftPx < 1.7) {
        return { ok: true, frozen: true, meanShiftPx };
      }

      // Ajusta homografia para obter os 4 cantos externos atualizados
      const H = fitHomographyDLT(
        screenObs.map(o => ({ u: o.ci, v: o.ri })),
        screenObs.map(o => ({ x: o.sx, y: o.sy })),
        screenObs.map(o => o.score)
      );
      if (!H) return { ok: false };

      const quad = [
        applyH(H, 0, 0),
        applyH(H, 8, 0),
        applyH(H, 8, 8),
        applyH(H, 0, 8)
      ];
      if (quad.some(p => !p)) return { ok: false };

      const nextPos = new THREE.Vector3();
      const nextQuat = new THREE.Quaternion();
      if (!solveExactBoard6DoFPose(quad, sw, sh, fovDeg, nextPos, nextQuat, screenObs)) {
        return { ok: false };
      }

      return { ok: true, frozen: false, pos: nextPos, quat: nextQuat, quad, meanShiftPx };
    }

    // =========================================================================
    // RASTREADOR 6DoF DE EGO-MOTION + GIROSCOPIO IMU (MODO VIRTUAL E PONTE)
    // =========================================================================
    const surfaceFeatures = [];
    let prevGray = null;

    const imuSensor = {
      currentQuat: new THREE.Quaternion(),
      prevQuat: new THREE.Quaternion(),
      hasPrev: false
    };
    const _imuZee = new THREE.Vector3(0, 0, 1);
    const _imuEuler = new THREE.Euler();
    const _imuQ0 = new THREE.Quaternion();
    const _imuQ1 = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5));
    const _imuDelta = new THREE.Quaternion();

    if (window.DeviceOrientationEvent) {
      window.addEventListener('deviceorientation', (ev) => {
