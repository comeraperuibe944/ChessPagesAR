<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#F6B3D0">
  <title>ChessPages AR</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      border: none !important;
      outline: none !important;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #F8FAFC;
      position: relative;
    }

    .ambient-bg {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: linear-gradient(180deg, #FDFCFB 0%, #F4F8FC 50%, #FEF9FB 100%);
    }

    #cameraVideo {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 2;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    #cameraVideo.active {
      opacity: 1;
    }

    #cameraVideo.mirrored {
      transform: scaleX(-1);
    }

    #threeCanvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 10;
      display: block;
      touch-action: none;
    }

    #handOverlayCanvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 20;
      pointer-events: none;
      display: block;
    }
  </style>
</head>
<body>
  <div class="ambient-bg" aria-hidden="true"></div>
  <video id="cameraVideo" class="mirrored" autoplay playsinline muted></video>
  <canvas id="threeCanvas"></canvas>
  <canvas id="handOverlayCanvas"></canvas>

  <script>
  (function () {
    'use strict';

    // =========================================================================
    // 1. MOTOR DE AUDIO PROCEDURAL (Web Audio API)
    // =========================================================================
    const SoundFX = (() => {
      let ctx = null;

      function ensureCtx() {
        if (!ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return null;
          ctx = new AudioCtx();
        }
        if (ctx.state === 'suspended') {
          ctx.resume().catch(() => {});
        }
        return ctx;
      }

      function tone(freq, endFreq, dur, type, vol, delay = 0) {
        const c = ensureCtx();
        if (!c) return;
        const now = c.currentTime + delay;
        const osc = c.createOscillator();
        const gain = c.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, now);
        if (endFreq && endFreq !== freq) {
          osc.frequency.exponentialRampToValueAtTime(Math.max(20, endFreq), now + dur);
        }
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.linearRampToValueAtTime(vol, now + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);
        osc.connect(gain);
        gain.connect(c.destination);
        osc.start(now);
        osc.stop(now + dur + 0.02);
      }

      return {
        unlock: ensureCtx,
        pinchGrab() {
          tone(540, 820, 0.055, 'sine', 0.08);
        },
        piecePlace() {
          tone(175, 62, 0.095, 'triangle', 0.15);
        },
        pieceSide() {
          tone(145, 50, 0.12, 'triangle', 0.14);
          tone(440, 620, 0.10, 'sine', 0.06, 0.02);
        },
        boardDetected() {
          tone(523.25, 659.25, 0.11, 'sine', 0.06, 0);
          tone(783.99, 1046.5, 0.14, 'sine', 0.06, 0.065);
        }
      };
    })();

    // =========================================================================
    // 2. ESTADO GLOBAL 6DoF AR COM ESTABILIDADE E IMUNIDADE A MAO
    // =========================================================================
    const videoEl = document.getElementById('cameraVideo');
    const threeCanvas = document.getElementById('threeCanvas');
    const handCanvas = document.getElementById('handOverlayCanvas');
    const handCtx = handCanvas.getContext('2d');

    const appState = {
      boardMode: 'virtual',     // 'virtual' (ancora em superficie) | 'real' (tabuleiro fisico)
      mirrorVideo: true,
      videoReady: false,

      // Pose 6DoF da superficie ancorada no espaco da camera (Camera em 0,0,0 olhando para -Z)
      anchorU: 0.0,
      anchorV: 0.08,
      targetAnchorU: 0.0,
      targetAnchorV: 0.08,

      boardDepth: 13.6,
      targetBoardDepth: 13.6,

      boardPitch: 0.78,
      targetBoardPitch: 0.78,

      boardYaw: 0.0,
      targetBoardYaw: 0.0,

      boardRoll: 0.0,
      targetBoardRoll: 0.0,

      heldPiece: null,
      hoveredPiece: null,
      handVisible: false,
      lastHandSeenTime: 0
    };

    // =========================================================================
    // 3. CENA 3D AR COM CAMERA OPTICA EM (0, 0, 0) OLHANDO PARA -Z
    // =========================================================================
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(48, window.innerWidth / window.innerHeight, 0.1, 120);
    camera.position.set(0, 0, 0);
    camera.lookAt(0, 0, -1);

    const renderer = new THREE.WebGLRenderer({
      canvas: threeCanvas,
      alpha: true,
      antialias: true,
      powerPreference: 'high-performance'
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x000000, 0);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    scene.add(new THREE.HemisphereLight(0xFFFFFF, 0xF6B3D0, 0.92));

    const keyLight = new THREE.DirectionalLight(0xFFFDF7, 0.92);
    keyLight.position.set(5, 14, 6);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.width = 2048;
    keyLight.shadow.mapSize.height = 2048;
    keyLight.shadow.camera.near = 1;
    keyLight.shadow.camera.far = 45;
    keyLight.shadow.camera.left = -12;
    keyLight.shadow.camera.right = 12;
    keyLight.shadow.camera.top = 12;
    keyLight.shadow.camera.bottom = -12;
    keyLight.shadow.bias = -0.0005;
    scene.add(keyLight);
    scene.add(keyLight.target);

    const rimLight = new THREE.DirectionalLight(0x82C8F3, 0.44);
    rimLight.position.set(-7, 6, 4);
    scene.add(rimLight);

    function updateCameraViewport() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      const aspect = w / Math.max(h, 1);
      camera.aspect = aspect;
      camera.fov = aspect < 0.85 ? 58 : 48;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
      handCanvas.width = w;
      handCanvas.height = h;
    }

    const boardGroup = new THREE.Group();
    scene.add(boardGroup);

    // Anel sutil de ancoragem AR na superficie
    const arSurfaceRingMat = new THREE.MeshBasicMaterial({
      color: 0x82C8F3,
      transparent: true,
      opacity: 0.20,
      side: THREE.DoubleSide
    });
    const arSurfaceRing = new THREE.Mesh(new THREE.RingGeometry(4.55, 4.70, 48), arSurfaceRingMat);
    arSurfaceRing.rotation.x = -Math.PI / 2;
    arSurfaceRing.position.y = -0.08;
    boardGroup.add(arSurfaceRing);

    // Moldura luminosa 3D quando um Tabuleiro Fisico Real e reconhecido
    const realBoardFrameGroup = new THREE.Group();
    const realFrameMat = new THREE.MeshBasicMaterial({
      color: 0x82C8F3,
      transparent: true,
      opacity: 0.78,
      side: THREE.DoubleSide
    });
    const bracketPositions = [
      [-4.05, 0.02, -4.05, 0],
      [4.05, 0.02, -4.05, -Math.PI / 2],
      [4.05, 0.02, 4.05, Math.PI],
      [-4.05, 0.02, 4.05, Math.PI / 2]
    ];
    bracketPositions.forEach(([bx, by, bz, rotY]) => {
      const cornerGrp = new THREE.Group();
      cornerGrp.position.set(bx, by, bz);
      cornerGrp.rotation.y = rotY;
      const armA = new THREE.Mesh(new THREE.PlaneGeometry(0.95, 0.10), realFrameMat);
      armA.rotation.x = -Math.PI / 2;
      armA.position.set(0.42, 0, 0);
      const armB = new THREE.Mesh(new THREE.PlaneGeometry(0.10, 0.95), realFrameMat);
      armB.rotation.x = -Math.PI / 2;
      armB.position.set(0, 0, 0.42);
      cornerGrp.add(armA);
      cornerGrp.add(armB);
      realBoardFrameGroup.add(cornerGrp);
    });
    realBoardFrameGroup.visible = false;
    boardGroup.add(realBoardFrameGroup);

    // Base do tabuleiro virtual AR
    const boardBaseMesh = new THREE.Mesh(
      new THREE.BoxGeometry(8.45, 0.20, 8.45),
      new THREE.MeshStandardMaterial({
        color: 0xFFFFFF,
        roughness: 0.35,
        metalness: 0.05,
        transparent: true,
        opacity: 0.92
      })
    );
    boardBaseMesh.position.y = -0.13;
    boardBaseMesh.receiveShadow = true;
    boardGroup.add(boardBaseMesh);

    // Plano receptor de sombra sobre a superficie real
    const realShadowPlane = new THREE.Mesh(
      new THREE.PlaneGeometry(18, 18),
      new THREE.ShadowMaterial({ opacity: 0.28 })
    );
    realShadowPlane.rotation.x = -Math.PI / 2;
    realShadowPlane.position.y = 0.004;
    realShadowPlane.receiveShadow = true;
    boardGroup.add(realShadowPlane);

    const lightTileMat = new THREE.MeshStandardMaterial({
      color: 0xFFFDF8,
      roughness: 0.42,
      metalness: 0.04,
      transparent: true,
      opacity: 0.93
    });
    const darkTileMat = new THREE.MeshStandardMaterial({
      color: 0x6EB9E8,
      roughness: 0.38,
      metalness: 0.08,
      transparent: true,
      opacity: 0.91
    });

    const tileGeo = new THREE.BoxGeometry(0.98, 0.055, 0.98);
    for (let r = 0; r < 8; r++) {
      for (let c = 0; c < 8; c++) {
        const isLight = (r + c) % 2 === 0;
        const tile = new THREE.Mesh(tileGeo, isLight ? lightTileMat : darkTileMat);
        tile.position.set(c - 3.5, 0, r - 3.5);
        tile.receiveShadow = true;
        boardGroup.add(tile);
      }
    }

    // Anel sutil sob a peca apontada ou segurada
    const focusRingMat = new THREE.MeshBasicMaterial({
      color: 0x82C8F3,
      transparent: true,
      opacity: 0,
      side: THREE.DoubleSide
    });
    const focusRingMesh = new THREE.Mesh(new THREE.RingGeometry(0.32, 0.46, 28), focusRingMat);
    focusRingMesh.rotation.x = -Math.PI / 2;
    focusRingMesh.position.y = 0.045;
    boardGroup.add(focusRingMesh);

    // =========================================================================
    // 4. MODELAGEM 3D PROCEDURAL DAS 32 PECAS STAUNTON
    // =========================================================================
    function createWhiteMat() {
      return new THREE.MeshStandardMaterial({
        color: 0xFFFDF8,
        roughness: 0.26,
        metalness: 0.08,
        emissive: 0x000000,
        emissiveIntensity: 0
      });
    }

    function createBlackMat() {
      return new THREE.MeshStandardMaterial({
        color: 0x1E293B,
        roughness: 0.28,
        metalness: 0.24,
        emissive: 0x000000,
        emissiveIntensity: 0
      });
    }

    function latheFromProfile(points, segments = 24) {
      return new THREE.LatheGeometry(points.map(([x, y]) => new THREE.Vector2(x, y)), segments);
    }

    function buildPieceMesh(type, color) {
      const mat = color === 'w' ? createWhiteMat() : createBlackMat();
      const group = new THREE.Group();

      function addMesh(geo, x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0) {
        const m = new THREE.Mesh(geo, mat);
        m.position.set(x, y, z);
        m.rotation.set(rx, ry, rz);
        m.castShadow = true;
        m.receiveShadow = true;
        group.add(m);
        return m;
      }

      if (type === 'p') {
        addMesh(latheFromProfile([
          [0, 0], [0.30, 0], [0.30, 0.08], [0.24, 0.14], [0.14, 0.24],
          [0.10, 0.48], [0.16, 0.54], [0.11, 0.58], [0, 0.58]
        ]));
        addMesh(new THREE.SphereGeometry(0.165, 20, 16), 0, 0.72, 0);
      } else if (type === 'r') {
        addMesh(latheFromProfile([
          [0, 0], [0.33, 0], [0.33, 0.09], [0.27, 0.16], [0.18, 0.26],
          [0.17, 0.70], [0.24, 0.80], [0.24, 0.94], [0.15, 0.94], [0.15, 0.84], [0, 0.84]
        ]));
        for (let i = 0; i < 6; i++) {
          const ang = (i / 6) * Math.PI * 2;
          addMesh(new THREE.BoxGeometry(0.10, 0.12, 0.08), Math.cos(ang) * 0.20, 1.0, Math.sin(ang) * 0.20, 0, -ang, 0);
        }
      } else if (type === 'n') {
        addMesh(latheFromProfile([
          [0, 0], [0.33, 0], [0.33, 0.09], [0.27, 0.17], [0.20, 0.28], [0, 0.28]
        ]));
        const dir = color === 'w' ? -1 : 1;
        addMesh(new THREE.CylinderGeometry(0.13, 0.21, 0.48, 16), 0, 0.48, -dir * 0.02, dir * 0.22, 0, 0);
        addMesh(new THREE.BoxGeometry(0.20, 0.28, 0.34), 0, 0.78, dir * 0.09, dir * 0.36, 0, 0);
        addMesh(new THREE.BoxGeometry(0.14, 0.17, 0.24), 0, 0.75, dir * 0.26, dir * 0.65, 0, 0);
        addMesh(new THREE.ConeGeometry(0.055, 0.16, 10), -0.075, 0.97, dir * 0.02);
        addMesh(new THREE.ConeGeometry(0.055, 0.16, 10), 0.075, 0.97, dir * 0.02);
      } else if (type === 'b') {
        addMesh(latheFromProfile([
          [0, 0], [0.32, 0], [0.32, 0.09], [0.26, 0.16], [0.15, 0.28],
          [0.11, 0.66], [0.19, 0.73], [0.13, 0.77], [0.18, 0.90],
          [0.14, 1.04], [0.06, 1.14], [0, 1.16]
        ]));
        addMesh(new THREE.SphereGeometry(0.065, 14, 14), 0, 1.21, 0);
      } else if (type === 'q') {
        addMesh(latheFromProfile([
          [0, 0], [0.36, 0], [0.36, 0.10], [0.29, 0.18], [0.17, 0.34],
          [0.12, 0.80], [0.21, 0.88], [0.15, 0.93], [0.24, 1.15], [0.14, 1.18], [0, 1.18]
        ]));
        addMesh(new THREE.SphereGeometry(0.14, 18, 16), 0, 1.24, 0);
        addMesh(new THREE.SphereGeometry(0.055, 12, 12), 0, 1.40, 0);
        for (let i = 0; i < 8; i++) {
          const ang = (i / 8) * Math.PI * 2;
          addMesh(new THREE.SphereGeometry(0.036, 10, 10), Math.cos(ang) * 0.21, 1.20, Math.sin(ang) * 0.21);
        }
      } else if (type === 'k') {
        addMesh(latheFromProfile([
          [0, 0], [0.38, 0], [0.38, 0.11], [0.31, 0.19], [0.18, 0.36],
          [0.13, 0.86], [0.22, 0.95], [0.16, 1.00], [0.24, 1.24], [0.18, 1.32], [0, 1.34]
        ]));
        addMesh(new THREE.BoxGeometry(0.075, 0.26, 0.075), 0, 1.47, 0);
        addMesh(new THREE.BoxGeometry(0.20, 0.075, 0.075), 0, 1.50, 0);
      }

      const hitMesh = new THREE.Mesh(
        new THREE.CylinderGeometry(0.48, 0.48, 1.55, 12),
        new THREE.MeshBasicMaterial({ visible: false })
      );
      hitMesh.position.y = 0.75;
      group.add(hitMesh);

      return { group, mat, hitMesh };
    }

    // =========================================================================
    // 5. TABULEIRO LIVRE (SEM REGRAS, SEM VEZ, COM DESLOCAMENTO NATURAL)
    // =========================================================================
    const pieces = [];
    const pieceHitMeshes = [];
    const grid = Array.from({ length: 8 }, () => Array(8).fill(null));

    function inBounds(r, c) {
      return r >= 0 && r < 8 && c >= 0 && c < 8;
    }

    function spawnPiece(type, color, row, col) {
      const built = buildPieceMesh(type, color);
      const piece = {
        type,
        color,
        row,
        col,
        mesh: built.group,
        mat: built.mat,
        hitMesh: built.hitMesh,
        targetPos: new THREE.Vector3(col - 3.5, 0.03, row - 3.5)
      };
      built.hitMesh.userData = { piece };
      built.group.position.copy(piece.targetPos);
      boardGroup.add(built.group);
      pieces.push(piece);
      pieceHitMeshes.push(built.hitMesh);
      grid[row][col] = piece;
    }

    function setupBoard() {
      const backRank = ['r', 'n', 'b', 'q', 'k', 'b', 'n', 'r'];
      for (let c = 0; c < 8; c++) {
        spawnPiece(backRank[c], 'b', 0, c);
        spawnPiece('p', 'b', 1, c);
        spawnPiece('p', 'w', 6, c);
        spawnPiece(backRank[c], 'w', 7, c);
      }
    }

    function clearGridCell(piece) {
      if (piece.row >= 0 && piece.col >= 0 && grid[piece.row]?.[piece.col] === piece) {
        grid[piece.row][piece.col] = null;
      }
    }

    function slideDisplacedPieceBesideBoard(piece, preferredZ) {
      clearGridCell(piece);
      piece.row = -1;
      piece.col = -1;
      const sideSign = piece.color === 'b' ? -1 : 1;
      let tx = sideSign * 4.95;
      let tz = Math.max(-3.6, Math.min(3.6, preferredZ));
      for (let attempt = 0; attempt < 16; attempt++) {
        let collision = false;
        for (const other of pieces) {
          if (other !== piece && other.row === -1 && Math.hypot(other.targetPos.x - tx, other.targetPos.z - tz) < 0.72) {
            collision = true;
            break;
          }
        }
        if (!collision) break;
        const col = attempt % 2;
        const row = Math.floor(attempt / 2);
        tx = sideSign * (4.9 + col * 0.85);
        tz = -3.2 + row * 0.92;
      }
      piece.targetPos.set(tx, 0.01, tz);
    }

    function placePieceOnTable(piece, localX, localZ) {
      const targetCol = Math.round(localX + 3.5);
      const targetRow = Math.round(localZ + 3.5);

      if (inBounds(targetRow, targetCol) && Math.abs(localX) <= 4.05 && Math.abs(localZ) <= 4.05) {
        const occupant = grid[targetRow][targetCol];
        if (occupant && occupant !== piece) {
          slideDisplacedPieceBesideBoard(occupant, targetRow - 3.5);
          SoundFX.pieceSide();
        } else {
          SoundFX.piecePlace();
        }
        clearGridCell(piece);
        piece.row = targetRow;
        piece.col = targetCol;
        piece.targetPos.set(targetCol - 3.5, 0.03, targetRow - 3.5);
        grid[targetRow][targetCol] = piece;
      } else {
        clearGridCell(piece);
        piece.row = -1;
        piece.col = -1;
        const cx = Math.max(-8.0, Math.min(8.0, localX));
        const cz = Math.max(-5.5, Math.min(5.5, localZ));
        piece.targetPos.set(cx, 0.01, cz);
        SoundFX.pieceSide();
      }
    }

    function applyBoardVisualMode(mode) {
      if (appState.boardMode === mode) return;
      appState.boardMode = mode;
      const isReal = mode === 'real';
      boardBaseMesh.visible = !isReal;
      arSurfaceRing.visible = !isReal;
      realBoardFrameGroup.visible = isReal;
      lightTileMat.opacity = isReal ? 0.04 : 0.93;
      darkTileMat.opacity = isReal ? 0.08 : 0.91;
    }

    // =========================================================================
    // 6. INTERACAO POR PINCELADA PRECISA (PROJECCAO 2D DE TELA + PLANO 3D)
    // =========================================================================
    const raycaster = new THREE.Raycaster();
    const tmpNormal = new THREE.Vector3();
    const tmpPoint = new THREE.Vector3();
    const projVec = new THREE.Vector3();
    const dynamicGroundPlane = new THREE.Plane();
    const dynamicDragPlane = new THREE.Plane();

    function screenToNdc(sx, sy) {
      return new THREE.Vector2(
        (sx / window.innerWidth) * 2 - 1,
        -(sy / window.innerHeight) * 2 + 1
      );
    }

    function updateDynamicPlanes() {
      boardGroup.updateMatrixWorld(true);
      tmpNormal.set(0, 1, 0).applyQuaternion(boardGroup.quaternion).normalize();
      dynamicGroundPlane.setFromNormalAndCoplanarPoint(tmpNormal, boardGroup.position);
      tmpPoint.set(0, 0.75, 0);
      boardGroup.localToWorld(tmpPoint);
      dynamicDragPlane.setFromNormalAndCoplanarPoint(tmpNormal, tmpPoint);
    }

    function raycastBoardGround(sx, sy) {
      updateDynamicPlanes();
      raycaster.setFromCamera(screenToNdc(sx, sy), camera);
      const hit = new THREE.Vector3();
      return raycaster.ray.intersectPlane(dynamicGroundPlane, hit) ? hit : null;
    }

    function raycastDragPlane(sx, sy) {
      updateDynamicPlanes();
      raycaster.setFromCamera(screenToNdc(sx, sy), camera);
      const hit = new THREE.Vector3();
      return raycaster.ray.intersectPlane(dynamicDragPlane, hit) ? hit : null;
    }

    function worldToBoardLocal(worldPt) {
      boardGroup.updateMatrixWorld(true);
      return boardGroup.worldToLocal(worldPt.clone());
    }

    function findPieceNear(sx, sy) {
      boardGroup.updateMatrixWorld(true);

      // 1) Raycast 3D direto nos cilindros das pecas
      raycaster.setFromCamera(screenToNdc(sx, sy), camera);
      const hits = raycaster.intersectObjects(pieceHitMeshes, false);
      if (hits.length > 0) {
        return hits[0].object.userData.piece;
      }

      // 2) Busca em espaco de tela 2D (projeta o centro do corpo de cada peca na tela para eliminar erro de paralaxe)
      const sw = window.innerWidth;
      const sh = window.innerHeight;
      const maxScreenDistPx = Math.max(42, Math.min(sw, sh) * 0.068);
      let bestScreenPiece = null;
      let bestScreenDist = maxScreenDistPx;

      for (const p of pieces) {
        projVec.set(p.targetPos.x, 0.45, p.targetPos.z);
        boardGroup.localToWorld(projVec);
        projVec.project(camera);
        if (projVec.z > 1.0) continue;
        const px = (projVec.x * 0.5 + 0.5) * sw;
        const py = (-projVec.y * 0.5 + 0.5) * sh;
        const dPx = Math.hypot(px - sx, py - sy);
        if (dPx < bestScreenDist) {
          bestScreenDist = dPx;
          bestScreenPiece = p;
        }
      }
      if (bestScreenPiece) return bestScreenPiece;

      // 3) Fallback no plano do tabuleiro
      const groundWorld = raycastBoardGround(sx, sy);
      if (!groundWorld) return null;
      const local = worldToBoardLocal(groundWorld);

      let bestPiece = null;
      let bestDist = 0.72;
      for (const p of pieces) {
        const d = Math.hypot(p.targetPos.x - local.x, p.targetPos.z - local.z);
        if (d < bestDist) {
          bestDist = d;
          bestPiece = p;
        }
      }
      return bestPiece;
    }

    function startPinchAction(sx, sy) {
      SoundFX.unlock();
      if (appState.heldPiece) return;
      const piece = findPieceNear(sx, sy);
      if (piece) {
        appState.heldPiece = piece;
        SoundFX.pinchGrab();
      }
    }

    function movePinchAction(sx, sy) {
      if (appState.heldPiece) {
        const dragWorld = raycastDragPlane(sx, sy) || raycastBoardGround(sx, sy);
        if (dragWorld) {
          const local = worldToBoardLocal(dragWorld);
          appState.heldPiece.targetPos.set(local.x, 1.25, local.z);
        }
      } else {
        appState.hoveredPiece = findPieceNear(sx, sy);
      }
    }

    function endPinchAction(sx, sy) {
      const piece = appState.heldPiece;
      if (!piece) return;
      appState.heldPiece = null;

      const dragWorld = raycastDragPlane(sx, sy) || raycastBoardGround(sx, sy);
      const local = dragWorld ? worldToBoardLocal(dragWorld) : piece.targetPos.clone();
      placePieceOnTable(piece, local.x, local.z);
    }

    let pointerDownActive = false;
    threeCanvas.addEventListener('pointerdown', (e) => {
      pointerDownActive = true;
      startPinchAction(e.clientX, e.clientY);
    });
    window.addEventListener('pointermove', (e) => {
      movePinchAction(e.clientX, e.clientY);
    });
    window.addEventListener('pointerup', (e) => {
      if (pointerDownActive) {
        pointerDownActive = false;
        endPinchAction(e.clientX, e.clientY);
      }
    });

    // =========================================================================
    // 7. MOTOR AR ESTAVEL: IMUNE A MAO NA FRENTE + CONSENSO DE 4 QUADRANTES
    // =========================================================================
    const cvW = 160;
    const cvH = 120;
    const cvCanvas = document.createElement('canvas');
    cvCanvas.width = cvW;
    cvCanvas.height = cvH;
    const cvCtx = cvCanvas.getContext('2d', { willReadFrequently: true });
    let lastCvTime = 0;

    let realBoardHits = 0;
    let realBoardMisses = 0;
    let lastBoardCandCx = null;
    let lastBoardCandCy = null;

    const CHESS_RING_16 = [
      [4, 0], [4, 2], [3, 3], [2, 4],
      [0, 4], [-2, 4], [-3, 3], [-4, 2],
      [-4, 0], [-4, -2], [-3, -3], [-2, -4],
      [0, -4], [2, -4], [3, -3], [4, -2]
    ];

    // Detector ChESS de Tabuleiro Fisico (so executa quando a mao NAO esta na frente)
    function detectPhysicalChessboard(gray) {
      const candidates = [];

      for (let y = 10; y < cvH - 10; y += 2) {
        for (let x = 10; x < cvW - 10; x += 2) {
          const ring = new Int16Array(16);
          let ringSum = 0;
          for (let k = 0; k < 16; k++) {
            const v = gray[(y + CHESS_RING_16[k][1]) * cvW + (x + CHESS_RING_16[k][0])];
            ring[k] = v;
            ringSum += v;
          }
          const ringMean = ringSum >> 4;
          const centerMean = (
            gray[y * cvW + x] * 2 +
            gray[y * cvW + (x - 1)] +
            gray[y * cvW + (x + 1)] +
            gray[(y - 1) * cvW + x] +
            gray[(y + 1) * cvW + x]
          ) / 6;

          let sumResponse = 0;
          for (let k = 0; k < 4; k++) {
            sumResponse += Math.abs((ring[k] + ring[k + 8]) - (ring[k + 4] + ring[k + 12]));
          }
          if (sumResponse < 95) continue;

          let diffPenalty = 0;
          for (let k = 0; k < 8; k++) {
            diffPenalty += Math.abs(ring[k] - ring[k + 8]);
          }

          const meanPenalty = Math.abs(ringMean - centerMean) * 6;
          const chessScore = sumResponse - 1.2 * diffPenalty - 1.15 * meanPenalty;

          if (chessScore > 44) {
            const c0 = (ring[0] + ring[8]) - (ring[4] + ring[12]);
            const c2 = (ring[2] + ring[10]) - (ring[6] + ring[14]);
            const phi = Math.atan2(c2, c0);
            const angle4 = phi * 2;
            candidates.push({
              x,
              y,
              score: chessScore,
              c0,
              c2,
              ux: Math.cos(angle4),
              uy: Math.sin(angle4)
            });
          }
        }
      }

      candidates.sort((a, b) => b.score - a.score);
      const peaks = [];
      for (const c of candidates) {
        let suppressed = false;
        for (const p of peaks) {
          if (Math.hypot(p.x - c.x, p.y - c.y) < 5.5) {
            suppressed = true;
            break;
          }
        }
        if (!suppressed) {
          peaks.push(c);
          if (peaks.length >= 52) break;
        }
      }

      if (peaks.length < 12) {
        realBoardHits = Math.max(0, realBoardHits - 1);
        realBoardMisses++;
        if (realBoardMisses > 16 && appState.boardMode === 'real') {
          applyBoardVisualMode('virtual');
        }
        return false;
      }

      let sumUx = 0, sumUy = 0;
      for (const p of peaks) {
        sumUx += p.ux;
        sumUy += p.uy;
      }
      const coherence = Math.hypot(sumUx, sumUy) / peaks.length;
      const domAngle4 = Math.atan2(sumUy, sumUx);
      const domPhi = domAngle4 * 0.5;
      const cosPhi = Math.cos(domPhi);
      const sinPhi = Math.sin(domPhi);

      const gridPoints = [];
      let posPolarity = 0;
      let negPolarity = 0;

      for (let i = 0; i < peaks.length; i++) {
        const p = peaks[i];
        const phaseDiff = Math.abs(Math.atan2(Math.sin(Math.atan2(p.uy, p.ux) - domAngle4), Math.cos(Math.atan2(p.uy, p.ux) - domAngle4)));
        if (phaseDiff > 0.95) continue;

        let nearest = Infinity;
        let secondNearest = Infinity;
        for (let j = 0; j < peaks.length; j++) {
          if (i === j) continue;
          const d = Math.hypot(peaks[j].x - p.x, peaks[j].y - p.y);
          if (d < nearest) {
            secondNearest = nearest;
            nearest = d;
          } else if (d < secondNearest) {
            secondNearest = d;
          }
        }
        if (nearest >= 5 && nearest <= 32 && secondNearest <= nearest * 1.75) {
          const polarity = p.c0 * cosPhi + p.c2 * sinPhi;
          if (polarity >= 0) posPolarity++;
          else negPolarity++;
          gridPoints.push({ ...p, cellStep: nearest });
        }
      }

      if (gridPoints.length >= 12 && coherence >= 0.45 && posPolarity >= 4 && negPolarity >= 4) {
        let cx = 0, cy = 0;
        const steps = [];
        for (const gp of gridPoints) {
          cx += gp.x;
          cy += gp.y;
          steps.push(gp.cellStep);
        }
        cx /= gridPoints.length;
        cy /= gridPoints.length;

        // Exige que o centro do tabuleiro fisico seja estavel entre frames consecutivos
        if (lastBoardCandCx !== null && Math.hypot(cx - lastBoardCandCx, cy - lastBoardCandCy) > 12) {
          realBoardHits = 1;
        } else {
          realBoardHits++;
        }
        lastBoardCandCx = cx;
        lastBoardCandCy = cy;
        realBoardMisses = 0;

        if (realBoardHits >= 4) {
          steps.sort((a, b) => a - b);
          const medStep = steps[Math.floor(steps.length / 2)];

          let sxx = 0, syy = 0, sxy = 0;
          for (const gp of gridPoints) {
            const dx = gp.x - cx;
            const dy = gp.y - cy;
            sxx += dx * dx;
            syy += dy * dy;
            sxy += dx * dy;
          }
          sxx /= gridPoints.length;
          syy /= gridPoints.length;
          sxy /= gridPoints.length;

          const trace = sxx + syy;
          const det = sxx * syy - sxy * sxy;
          const disc = Math.sqrt(Math.max(0, trace * trace * 0.25 - det));
          const lambdaMajor = trace * 0.5 + disc;
          const lambdaMinor = Math.max(1, trace * 0.5 - disc);

          const aspectGrid = Math.min(0.98, Math.max(0.28, Math.sqrt(lambdaMinor / Math.max(lambdaMajor, 1))));
          const estimatedPitch = Math.asin(aspectGrid);

          const rawBoardYaw = domAngle4 * 0.25;
          const signedYaw = appState.mirrorVideo ? -rawBoardYaw : rawBoardYaw;

          const normX = cx / cvW;
          const normY = cy / cvH;
          const screenNormX = appState.mirrorVideo ? (1 - normX) : normX;
          const estDepth = Math.min(18.5, Math.max(9.0, 165 / Math.max(medStep, 6)));

          if (appState.boardMode !== 'real') {
            applyBoardVisualMode('real');
            SoundFX.boardDetected();
          }
          appState.targetAnchorU = screenNormX - 0.5;
          appState.targetAnchorV = normY - 0.5;
          appState.targetBoardDepth = estDepth;
          appState.targetBoardPitch = Math.min(1.35, Math.max(0.32, estimatedPitch));
          appState.targetBoardYaw = signedYaw;
        }
        return true;
      }

      realBoardHits = Math.max(0, realBoardHits - 1);
      realBoardMisses++;
      if (realBoardMisses > 16 && appState.boardMode === 'real') {
        applyBoardVisualMode('virtual');
      }
      return false;
    }

    // =========================================================================
    // RASTREADOR 6DoF DE CAMERA POR CONSENSO DE 4 QUADRANTES + GIROSCOPIO IMU
    // =========================================================================
    const surfaceFeatures = [];
    let prevGray = null;

    let imuLastAlpha = null;
    let imuLastBeta = null;
    let imuLastGamma = null;

    if (window.DeviceOrientationEvent) {
      window.addEventListener('deviceorientation', (ev) => {
        if (ev.beta === null || ev.gamma === null) return;
        const rad = Math.PI / 180;
        if (imuLastBeta !== null) {
          let dBeta = ev.beta - imuLastBeta;
          let dGamma = ev.gamma - imuLastGamma;
          let dAlpha = ev.alpha !== null && imuLastAlpha !== null ? ev.alpha - imuLastAlpha : 0;
          if (dAlpha > 180) dAlpha -= 360;
          if (dAlpha < -180) dAlpha += 360;

          if (Math.abs(dBeta) < 18 && Math.abs(dGamma) < 18) {
            appState.targetBoardPitch = Math.min(1.32, Math.max(0.28, appState.targetBoardPitch - dBeta * rad * 0.80));
            appState.targetBoardRoll = Math.min(0.55, Math.max(-0.55, appState.targetBoardRoll - dGamma * rad * 0.60));
            appState.targetBoardYaw += dAlpha * rad * 0.70;
            appState.targetAnchorV = Math.min(0.38, Math.max(-0.38, appState.targetAnchorV + dBeta * 0.010));
            appState.targetAnchorU = Math.min(0.42, Math.max(-0.42, appState.targetAnchorU - dGamma * 0.010));
          }
        }
        imuLastAlpha = ev.alpha;
        imuLastBeta = ev.beta;
        imuLastGamma = ev.gamma;
      }, { passive: true });
    }

    function computeShiTomasiScore(gray, cx, cy) {
      let sxx = 0, syy = 0, sxy = 0;
      for (let dy = -2; dy <= 2; dy++) {
        const r0 = (cy + dy) * cvW;
        const rUp = (cy + dy - 1) * cvW;
        const rDn = (cy + dy + 1) * cvW;
        for (let dx = -2; dx <= 2; dx++) {
          const ix = gray[r0 + cx + dx + 1] - gray[r0 + cx + dx - 1];
          const iy = gray[rDn + cx + dx] - gray[rUp + cx + dx];
          sxx += ix * ix;
          syy += iy * iy;
          sxy += ix * iy;
        }
      }
      const trace = sxx + syy;
      const disc = Math.sqrt(Math.max(0, (sxx - syy) * (sxx - syy) + 4 * sxy * sxy));
      return (trace - disc) * 0.5;
    }

    function copyPatch7x7(gray, cx, cy) {
      const buf = new Uint8Array(49);
      let k = 0;
      for (let dy = -3; dy <= 3; dy++) {
        const ro = (cy + dy) * cvW;
        for (let dx = -3; dx <= 3; dx++) {
          buf[k++] = gray[ro + cx + dx];
        }
      }
      return buf;
    }

    // Semeia pontos de fundo nos 4 quadrantes da cena (NUNCA reposiciona o tabuleiro ao semear!)
    function seedBackgroundQuadrants(gray) {
      const candidates = [];
      for (let y = 14; y <= cvH - 14; y += 6) {
        for (let x = 14; x <= cvW - 14; x += 6) {
          const score = computeShiTomasiScore(gray, x, y);
          if (score > 450) {
            const quad = (y < cvH * 0.5 ? 0 : 2) + (x < cvW * 0.5 ? 0 : 1);
            candidates.push({ x, y, score, quad });
          }
        }
      }

      candidates.sort((a, b) => b.score - a.score);
      const perQuad = [0, 0, 0, 0];
      for (const f of surfaceFeatures) {
        const q = (f.y < cvH * 0.5 ? 0 : 2) + (f.x < cvW * 0.5 ? 0 : 1);
        perQuad[q]++;
      }

      for (const c of candidates) {
        if (surfaceFeatures.length >= 20) break;
        if (perQuad[c.quad] >= 5) continue;
        let tooClose = false;
        for (const f of surfaceFeatures) {
          if (Math.hypot(f.x - c.x, f.y - c.y) < 12) {
            tooClose = true;
            break;
          }
        }
        if (!tooClose) {
          surfaceFeatures.push({
            x: c.x,
            y: c.y,
            quad: c.quad,
            patch: copyPatch7x7(gray, c.x, c.y)
          });
          perQuad[c.quad]++;
        }
      }
    }

    function trackCameraEgoMotion6DoF(gray) {
      if (!prevGray || surfaceFeatures.length < 6) {
        prevGray = gray;
        seedBackgroundQuadrants(gray);
        return;
      }

      // Verifica se uma mao/braco acabou de entrar subitamente no centro do quadro (diferenca localizada de luminancia)
      let centerDiff = 0, borderDiff = 0;
      let centerCnt = 0, borderCnt = 0;
      for (let y = 10; y < cvH - 10; y += 4) {
        for (let x = 10; x < cvW - 10; x += 4) {
          const d = Math.abs(gray[y * cvW + x] - prevGray[y * cvW + x]);
          if (x > 36 && x < 124 && y > 24 && y < 108) {
            centerDiff += d;
            centerCnt++;
          } else {
            borderDiff += d;
            borderCnt++;
          }
        }
      }
      const avgCenterDiff = centerDiff / Math.max(centerCnt, 1);
      const avgBorderDiff = borderDiff / Math.max(borderCnt, 1);

      // Se o centro mudou fortemente enquanto a borda ficou parada -> e uma mao/pessoa passando na frente da camera!
      if (avgCenterDiff > 14 && avgCenterDiff > avgBorderDiff * 2.1) {
        prevGray = gray;
        return;
      }

      const searchR = 9;
      const matches = [];

      for (const f of surfaceFeatures) {
        const ix = Math.round(f.x);
        const iy = Math.round(f.y);
        if (ix < 13 || ix >= cvW - 13 || iy < 13 || iy >= cvH - 13) continue;

        let bestSad = Infinity;
        let bestX = ix;
        let bestY = iy;

        for (let sy = -searchR; sy <= searchR; sy++) {
          const cy = iy + sy;
          for (let sx = -searchR; sx <= searchR; sx++) {
            const cx = ix + sx;
            let sad = 0;
            let k = 0;
            for (let dy = -3; dy <= 3; dy++) {
              const ro = (cy + dy) * cvW;
              for (let dx = -3; dx <= 3; dx++) {
                sad += Math.abs(gray[ro + cx + dx] - f.patch[k++]);
              }
            }
            if (sad < bestSad) {
              bestSad = sad;
              bestX = cx;
              bestY = cy;
            }
          }
        }

        if (bestSad / 49 < 16) {
          const quad = (bestY < cvH * 0.5 ? 0 : 2) + (bestX < cvW * 0.5 ? 0 : 1);
          matches.push({
            x0: f.x,
            y0: f.y,
            x1: bestX,
            y1: bestY,
            dx: bestX - f.x,
            dy: bestY - f.y,
            quad
          });
        }
      }

      if (matches.length >= 6) {
        const dxs = matches.map(m => m.dx).sort((a, b) => a - b);
        const dys = matches.map(m => m.dy).sort((a, b) => a - b);
        const medDx = dxs[Math.floor(dxs.length / 2)];
        const medDy = dys[Math.floor(dys.length / 2)];

        // Filtra inliers que concordam estritamente com o movimento global da camera (< 2.2px de desvio)
        const inliers = matches.filter(m => Math.hypot(m.dx - medDx, m.dy - medDy) < 2.2);

        // Conta em quantos quadrantes distintos da tela ha consenso de movimento da camera
        const activeQuads = new Set(inliers.map(m => m.quad)).size;

        // So move o tabuleiro se pelo menos 3 quadrantes da imagem inteira concordarem (movimento real da camera!)
        if (inliers.length >= 5 && activeQuads >= 3) {
          let c0x = 0, c0y = 0, c1x = 0, c1y = 0;
          for (const m of inliers) {
            c0x += m.x0;
            c0y += m.y0;
            c1x += m.x1;
            c1y += m.y1;
          }
          c0x /= inliers.length;
          c0y /= inliers.length;
          c1x /= inliers.length;
          c1y /= inliers.length;

          const meanDx = c1x - c0x;
          const meanDy = c1y - c0y;

          let dot = 0, cross = 0, norm0 = 0;
          let varX0 = 0, varY0 = 0, varX1 = 0, varY1 = 0;

          for (const m of inliers) {
            const u0x = m.x0 - c0x;
            const u0y = m.y0 - c0y;
            const u1x = m.x1 - c1x;
            const u1y = m.y1 - c1y;

            dot += u0x * u1x + u0y * u1y;
            cross += u0x * u1y - u0y * u1x;
            norm0 += u0x * u0x + u0y * u0y;

            varX0 += u0x * u0x;
            varY0 += u0y * u0y;
            varX1 += u1x * u1x;
            varY1 += u1y * u1y;
          }

          if (Math.hypot(meanDx, meanDy) > 0.45) {
            const screenDx = (appState.mirrorVideo ? -meanDx : meanDx) / cvW;
            const screenDy = meanDy / cvH;
            appState.targetAnchorU = Math.min(0.38, Math.max(-0.38, appState.targetAnchorU + screenDx * 0.85));
            appState.targetAnchorV = Math.min(0.36, Math.max(-0.32, appState.targetAnchorV + screenDy * 0.85));
          }

          if (norm0 > 120 && inliers.length >= 6) {
            const dTheta = Math.atan2(cross, dot);
            if (Math.abs(dTheta) > 0.005 && Math.abs(dTheta) < 0.16) {
              const signedTheta = appState.mirrorVideo ? -dTheta : dTheta;
              appState.targetBoardYaw += signedTheta * 0.85;
              appState.targetBoardRoll = Math.min(0.48, Math.max(-0.48, appState.targetBoardRoll + signedTheta * 0.30));
            }

            if (varX0 > 60 && varY0 > 60) {
              const sx = Math.sqrt(varX1 / varX0);
              const sy = Math.sqrt(varY1 / varY0);
              const tiltRatio = sy / Math.max(sx, 0.2);
              if (Math.abs(tiltRatio - 1.0) > 0.018 && Math.abs(tiltRatio - 1.0) < 0.14) {
                appState.targetBoardPitch = Math.min(1.32, Math.max(0.30, appState.targetBoardPitch + (tiltRatio - 1.0) * 0.45));
              }
            }
          }

          const opticalPitchBase = 0.76 + appState.targetAnchorV * 0.38;
          appState.targetBoardPitch = appState.targetBoardPitch * 0.94 + opticalPitchBase * 0.06;
        }

        surfaceFeatures.length = 0;
        for (const m of inliers) {
          surfaceFeatures.push({
            x: m.x1,
            y: m.y1,
            quad: m.quad,
            patch: copyPatch7x7(gray, m.x1, m.y1)
          });
        }
      } else {
        surfaceFeatures.length = 0;
      }

      if (surfaceFeatures.length < 12) {
        seedBackgroundQuadrants(gray);
      }
      prevGray = gray;
    }

    function runArVisionStep(now) {
      if (!appState.videoReady || videoEl.videoWidth === 0) return;

      // TOLERANCIA TOTAL COM A MAO NA FRENTE:
      // Enquanto o jogador estiver com a mao visivel (ou ate 750ms apos retirar a mao),
      // trava completamente a posicao e rotacao visual do tabuleiro para jogar com 100% de estabilidade!
      if (appState.handVisible || appState.heldPiece || (now - appState.lastHandSeenTime < 750)) {
        prevGray = null;
        return;
      }

      cvCtx.drawImage(videoEl, 0, 0, cvW, cvH);
      const data = cvCtx.getImageData(0, 0, cvW, cvH).data;
      const gray = new Uint8Array(cvW * cvH);
      for (let i = 0, j = 0; i < data.length; i += 4, j++) {
        gray[j] = (data[i] * 77 + data[i + 1] * 150 + data[i + 2] * 29) >> 8;
      }

      const hasRealChessboard = detectPhysicalChessboard(gray);
      if (!hasRealChessboard) {
        trackCameraEgoMotion6DoF(gray);
      }
    }

    // =========================================================================
    // 8. MEDIAPIPE HANDS + FUNCAO DE PINCA PRECISA E RESPONSIVA
    // =========================================================================
    const handTracker = {
      isPinching: false,
      sx: 0,
      sy: 0,
      initialized: false,
      lmScreen: null,
      pinchRatio: 1.0
    };
    let latestLandmarks = [];
    let isProcessingHand = false;
    let mpHands = null;

    function videoToScreen(nx, ny) {
      const sw = window.innerWidth;
      const sh = window.innerHeight;
      const vw = videoEl.videoWidth || 1280;
      const vh = videoEl.videoHeight || 720;
      const scale = Math.max(sw / vw, sh / vh);
      const dw = vw * scale;
      const dh = vh * scale;
      const ox = (sw - dw) * 0.5;
      const oy = (sh - dh) * 0.5;
      const px = appState.mirrorVideo ? ox + (1 - nx) * dw : ox + nx * dw;
      const py = oy + ny * dh;
      return { x: px, y: py };
    }

    function onHandResults(results) {
      isProcessingHand = false;
      latestLandmarks = results.multiHandLandmarks || [];

      if (latestLandmarks.length === 0) {
        appState.handVisible = false;
        if (handTracker.isPinching) {
          handTracker.isPinching = false;
          endPinchAction(handTracker.sx, handTracker.sy);
        }
        handTracker.initialized = false;
        handTracker.lmScreen = null;
        appState.hoveredPiece = null;
        return;
      }

      appState.handVisible = true;
      appState.lastHandSeenTime = performance.now();

      const lm = latestLandmarks[0];
      const pts = lm.map(p => videoToScreen(p.x, p.y));
      handTracker.lmScreen = pts;

      // Escala da mao robusta a inclinacao 3D (usa o maior eixo visivel da palma em pixels de tela)
      const dWristMiddle = Math.hypot(pts[0].x - pts[9].x, pts[0].y - pts[9].y);
      const dPalmWidth = Math.hypot(pts[5].x - pts[17].x, pts[5].y - pts[17].y) * 1.18;
      const dWristIndex = Math.hypot(pts[0].x - pts[5].x, pts[0].y - pts[5].y);
      const handScalePx = Math.max(dWristMiddle, dPalmWidth, dWristIndex, 32);

      // Distancia entre a ponta do polegar (4) e a ponta do indicador (8)
      const tipDistPx = Math.hypot(pts[4].x - pts[8].x, pts[4].y - pts[8].y);
      const ratio = tipDistPx / handScalePx;
      handTracker.pinchRatio = ratio;

      const rawX = (pts[4].x + pts[8].x) * 0.5;
      const rawY = (pts[4].y + pts[8].y) * 0.5;
      if (!handTracker.initialized) {
        handTracker.sx = rawX;
        handTracker.sy = rawY;
        handTracker.initialized = true;
      } else {
        handTracker.sx += (rawX - handTracker.sx) * 0.45;
        handTracker.sy += (rawY - handTracker.sy) * 0.45;
      }

      // Pinca calibrada: exige encostar polegar no indicador (ratio < 0.25), sem travas que falhem com a mao perto da camera
      if (!handTracker.isPinching && ratio < 0.25) {
        handTracker.isPinching = true;
        startPinchAction(handTracker.sx, handTracker.sy);
      } else if (handTracker.isPinching && ratio > 0.34) {
        handTracker.isPinching = false;
        endPinchAction(handTracker.sx, handTracker.sy);
      }

      movePinchAction(handTracker.sx, handTracker.sy);
    }

    const FINGER_CHAINS = [
      [0, 1, 2, 3, 4],
      [0, 5, 6, 7, 8],
      [0, 9, 10, 11, 12],
      [0, 13, 14, 15, 16],
      [0, 17, 18, 19, 20]
    ];

    function renderTransparentHand() {
      const sw = handCanvas.width;
      const sh = handCanvas.height;
      handCtx.clearRect(0, 0, sw, sh);

      const pts = handTracker.lmScreen;
      if (!pts) return;

      const isPinch = handTracker.isPinching;
      handCtx.save();

      // Contorno muito leve e transparente para enxergar perfeitamente todas as pecas atras da mao
      handCtx.strokeStyle = 'rgba(255, 255, 255, 0.16)';
      handCtx.lineWidth = 1.2;
      handCtx.lineCap = 'round';
      handCtx.lineJoin = 'round';

      for (const chain of FINGER_CHAINS) {
        handCtx.beginPath();
        chain.forEach((idx, k) => {
          if (k === 0) handCtx.moveTo(pts[idx].x, pts[idx].y);
          else handCtx.lineTo(pts[idx].x, pts[idx].y);
        });
        handCtx.stroke();
      }

      // Aneis vazados nas pontas do polegar (4) e indicador (8)
      for (const tipIdx of [4, 8]) {
        handCtx.beginPath();
        handCtx.arc(pts[tipIdx].x, pts[tipIdx].y, 4.5, 0, Math.PI * 2);
        handCtx.lineWidth = isPinch ? 2.0 : 1.5;
        handCtx.strokeStyle = isPinch ? 'rgba(200, 62, 123, 0.85)' : 'rgba(130, 200, 243, 0.65)';
        handCtx.stroke();
      }

      if (isPinch) {
        handCtx.beginPath();
        handCtx.arc(handTracker.sx, handTracker.sy, 3.2, 0, Math.PI * 2);
        handCtx.fillStyle = 'rgba(200, 62, 123, 0.88)';
        handCtx.fill();
      }

      handCtx.restore();
    }

    async function initMediaPipeHands() {
      if (typeof window.Hands === 'undefined') return;
      mpHands = new window.Hands({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
      });
      mpHands.setOptions({
        maxNumHands: 1,
        modelComplexity: 1,
        minDetectionConfidence: 0.58,
        minTrackingConfidence: 0.58
      });
      mpHands.onResults(onHandResults);
    }

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            width: { ideal: 1280 },
            height: { ideal: 720 },
            facingMode: { ideal: 'environment' }
          },
          audio: false
        });
        videoEl.srcObject = stream;
        await videoEl.play();
        const track = stream.getVideoTracks()[0];
        const settings = track && track.getSettings ? track.getSettings() : {};
        appState.mirrorVideo = settings.facingMode !== 'environment';
        videoEl.classList.toggle('mirrored', appState.mirrorVideo);
        appState.videoReady = true;
        videoEl.classList.add('active');
      } catch (err) {
        appState.videoReady = false;
      }
    }

    window.addEventListener('resize', updateCameraViewport);

    // =========================================================================
    // 9. LOOP PRINCIPAL 6DoF (ATUALIZACAO DE POSE 3D + PECAS + AR)
    // =========================================================================
    let lastHandInferTime = 0;
    const qRoll = new THREE.Quaternion();
    const qPitch = new THREE.Quaternion();
    const qYaw = new THREE.Quaternion();
    const axisX = new THREE.Vector3(1, 0, 0);
    const axisY = new THREE.Vector3(0, 1, 0);
    const axisZ = new THREE.Vector3(0, 0, 1);

    function animate(now) {
      requestAnimationFrame(animate);

      appState.anchorU += (appState.targetAnchorU - appState.anchorU) * 0.18;
      appState.anchorV += (appState.targetAnchorV - appState.anchorV) * 0.18;
      appState.boardDepth += (appState.targetBoardDepth - appState.boardDepth) * 0.14;
      appState.boardPitch += (appState.targetBoardPitch - appState.boardPitch) * 0.16;
      appState.boardYaw += (appState.targetBoardYaw - appState.boardYaw) * 0.16;
      appState.boardRoll += (appState.targetBoardRoll - appState.boardRoll) * 0.16;

      const halfH = Math.tan(THREE.MathUtils.degToRad(camera.fov * 0.5)) * appState.boardDepth;
      const halfW = halfH * camera.aspect;
      boardGroup.position.set(
        appState.anchorU * halfW * 2.0,
        -appState.anchorV * halfH * 2.0,
        -appState.boardDepth
      );

      qRoll.setFromAxisAngle(axisZ, appState.boardRoll);
      qPitch.setFromAxisAngle(axisX, appState.boardPitch);
      qYaw.setFromAxisAngle(axisY, appState.boardYaw);
      boardGroup.quaternion.copy(qRoll).multiply(qPitch).multiply(qYaw);

      keyLight.position.set(
        boardGroup.position.x + 4,
        boardGroup.position.y + 12,
        boardGroup.position.z + 6
      );
      keyLight.target.position.copy(boardGroup.position);
      keyLight.target.updateMatrixWorld();

      const activeFocusPiece = appState.heldPiece || appState.hoveredPiece;
      if (activeFocusPiece) {
        if (appState.heldPiece) {
          const sx = Math.abs(activeFocusPiece.targetPos.x) <= 4.05 && Math.abs(activeFocusPiece.targetPos.z) <= 4.05
            ? Math.round(activeFocusPiece.targetPos.x + 3.5) - 3.5
            : activeFocusPiece.targetPos.x;
          const sz = Math.abs(activeFocusPiece.targetPos.x) <= 4.05 && Math.abs(activeFocusPiece.targetPos.z) <= 4.05
            ? Math.round(activeFocusPiece.targetPos.z + 3.5) - 3.5
            : activeFocusPiece.targetPos.z;
          focusRingMesh.position.set(sx, 0.045, sz);
          focusRingMat.color.setHex(0xF6B3D0);
          focusRingMat.opacity = 0.72;
        } else {
          focusRingMesh.position.set(activeFocusPiece.targetPos.x, 0.045, activeFocusPiece.targetPos.z);
          focusRingMat.color.setHex(0x82C8F3);
          focusRingMat.opacity = 0.56;
        }
      } else {
        focusRingMat.opacity = 0;
      }

      for (const p of pieces) {
        const lerpSpeed = p === appState.heldPiece ? 0.44 : 0.24;
        p.mesh.position.lerp(p.targetPos, lerpSpeed);

        if (p === appState.heldPiece) {
          p.mat.emissive.setHex(0xF6B3D0);
          p.mat.emissiveIntensity = 0.44;
        } else if (p === appState.hoveredPiece) {
          p.mat.emissive.setHex(0x82C8F3);
          p.mat.emissiveIntensity = 0.36;
        } else {
          p.mat.emissive.setHex(0x000000);
          p.mat.emissiveIntensity = 0;
        }
      }

      renderer.render(scene, camera);
      renderTransparentHand();

      if (appState.videoReady && mpHands && !isProcessingHand && videoEl.readyState >= 2 && (now - lastHandInferTime > 30)) {
        isProcessingHand = true;
        lastHandInferTime = now;
        mpHands.send({ image: videoEl }).catch(() => {
          isProcessingHand = false;
        });
      }

      if (now - lastCvTime > 55) {
        lastCvTime = now;
        runArVisionStep(now);
      }
    }

    updateCameraViewport();
    setupBoard();
    initMediaPipeHands();
    startCamera();
    requestAnimationFrame(animate);
  })();
  </script>
</body>
</html>
