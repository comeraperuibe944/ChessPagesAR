<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#F6B3D0">
  <title>ChessPages AR</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <style>
    :root {
      --rosa-principal: #F6B3D0;
      --rosa-escuro: #C83E7B;
      --azul-celeste: #82C8F3;
      --azul-ativo: #1D6FA5;
      --fundo-creme: #FFFED6;
      --texto-principal: #0F172A;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      border: none !important;
      outline: none !important;
      font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #F8FAFC;
      color: var(--texto-principal);
      position: relative;
    }

    div, button, canvas, video {
      border: none !important;
      outline: none !important;
    }

    .ambient-bg {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: linear-gradient(180deg, #FDFCFB 0%, #F4F8FC 50%, #FEF9FB 100%);
    }

    .ambient-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(95px);
      opacity: 0.52;
    }

    .orb-rose {
      width: 620px;
      height: 620px;
      top: 10%;
      left: 14%;
      background: radial-gradient(circle, rgba(246, 179, 208, 0.5) 0%, transparent 72%);
    }

    .orb-blue {
      width: 680px;
      height: 680px;
      bottom: 8%;
      right: 12%;
      background: radial-gradient(circle, rgba(130, 200, 243, 0.5) 0%, transparent 72%);
    }

    #cameraVideo {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 2;
      opacity: 0;
      transition: opacity 0.35s ease;
    }

    #cameraVideo.active {
      opacity: 1;
    }

    #cameraVideo.mirrored {
      transform: scaleX(-1);
    }

    #threeCanvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 10;
      display: block;
      touch-action: none;
    }

    /* Mao e cursor de pincelada sempre na frente do tabuleiro 3D */
    #handOverlayCanvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 20;
      pointer-events: none;
      display: block;
    }

    /* Unico elemento discreto de alternancia nao invasivo */
    #modeTogglePill {
      position: fixed;
      right: 16px;
      bottom: 16px;
      z-index: 30;
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      color: var(--texto-principal);
      border-radius: 14px;
      padding: 8px 14px;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.1px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      opacity: 0.72;
      box-shadow: 0 6px 20px rgba(15, 23, 42, 0.08);
      transition: opacity 0.18s ease, transform 0.16s ease, background 0.18s ease;
    }

    #modeTogglePill:hover,
    #modeTogglePill.pinch-hover {
      opacity: 0.96;
      background: rgba(255, 255, 255, 0.94);
      transform: translateY(-1px);
    }

    .mode-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--azul-celeste);
      flex-shrink: 0;
    }

    .mode-dot.real {
      background: var(--rosa-escuro);
    }
  </style>
</head>
<body>
  <div class="ambient-bg" aria-hidden="true">
    <div class="ambient-orb orb-rose"></div>
    <div class="ambient-orb orb-blue"></div>
  </div>

  <video id="cameraVideo" class="mirrored" autoplay playsinline muted></video>
  <canvas id="threeCanvas"></canvas>
  <canvas id="handOverlayCanvas"></canvas>

  <button id="modeTogglePill" type="button" title="Alternar entre tabuleiro virtual e real">
    <span class="mode-dot" id="modeDot"></span>
    <span id="modeLabel">Tabuleiro Virtual</span>
  </button>

  <script>
  (function () {
    'use strict';

    // =========================================================================
    // 1. AUDIO PROCEDURAL LEVE (Web Audio API)
    // =========================================================================
    const SoundFX = (() => {
      let ctx = null;
      let lastResizeTick = 0;

      function ensureCtx() {
        if (!ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return null;
          ctx = new AudioCtx();
        }
        if (ctx.state === 'suspended') {
          ctx.resume().catch(() => {});
        }
        return ctx;
      }

      function tone(freq, endFreq, dur, type, vol, delay = 0) {
        const c = ensureCtx();
        if (!c) return;
        const now = c.currentTime + delay;
        const osc = c.createOscillator();
        const gain = c.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, now);
        if (endFreq && endFreq !== freq) {
          osc.frequency.exponentialRampToValueAtTime(Math.max(20, endFreq), now + dur);
        }
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.linearRampToValueAtTime(vol, now + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);
        osc.connect(gain);
        gain.connect(c.destination);
        osc.start(now);
        osc.stop(now + dur + 0.02);
      }

      return {
        unlock: ensureCtx,
        pinchGrab() {
          tone(520, 800, 0.06, 'sine', 0.09);
        },
        piecePlace() {
          tone(175, 62, 0.10, 'triangle', 0.16);
        },
        pieceCemetery() {
          tone(145, 50, 0.14, 'triangle', 0.16);
          tone(440, 660, 0.12, 'sine', 0.07, 0.02);
        },
        boardResize(scale) {
          const now = performance.now();
          if (now - lastResizeTick < 75) return;
          lastResizeTick = now;
          const pitch = 300 + scale * 220;
          tone(pitch, pitch * 1.05, 0.03, 'sine', 0.035);
        },
        boardDetected() {
          tone(523.25, 659.25, 0.12, 'sine', 0.06, 0);
          tone(783.99, 1046.5, 0.14, 'sine', 0.06, 0.07);
        }
      };
    })();

    // =========================================================================
    // 2. ELEMENTOS E ESTADO
    // =========================================================================
    const videoEl = document.getElementById('cameraVideo');
    const threeCanvas = document.getElementById('threeCanvas');
    const handCanvas = document.getElementById('handOverlayCanvas');
    const handCtx = handCanvas.getContext('2d');
    const modeTogglePill = document.getElementById('modeTogglePill');
    const modeDot = document.getElementById('modeDot');
    const modeLabel = document.getElementById('modeLabel');

    const appState = {
      boardMode: 'virtual',   // 'virtual' | 'real'
      autoSearchReal: true,
      realBoardFound: false,
      mirrorVideo: true,
      videoReady: false,
      boardScale: 1.0,
      targetBoardScale: 1.0,
      boardPos: new THREE.Vector3(0, 0, 0),
      targetBoardPos: new THREE.Vector3(0, 0, 0),
      heldPiece: null,
      resizeDrag: null,
      dualPinch: null,
      lastPinchBtnTime: 0
    };

    // =========================================================================
    // 3. CENA 3D AR LIMPA (TABULEIRO + 32 PECAS)
    // =========================================================================
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(44, window.innerWidth / window.innerHeight, 0.1, 120);
    const renderer = new THREE.WebGLRenderer({
      canvas: threeCanvas,
      alpha: true,
      antialias: true,
      powerPreference: 'high-performance'
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x000000, 0);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    scene.add(new THREE.HemisphereLight(0xFFFFFF, 0xF6B3D0, 0.90));

    const keyLight = new THREE.DirectionalLight(0xFFFDF7, 0.92);
    keyLight.position.set(6, 16, 9);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.width = 2048;
    keyLight.shadow.mapSize.height = 2048;
    keyLight.shadow.camera.near = 2;
    keyLight.shadow.camera.far = 42;
    keyLight.shadow.camera.left = -10;
    keyLight.shadow.camera.right = 10;
    keyLight.shadow.camera.top = 10;
    keyLight.shadow.camera.bottom = -10;
    keyLight.shadow.bias = -0.0005;
    scene.add(keyLight);

    const rimLight = new THREE.DirectionalLight(0x82C8F3, 0.42);
    rimLight.position.set(-8, 8, -7);
    scene.add(rimLight);

    function updateCameraViewport() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      const aspect = w / Math.max(h, 1);
      camera.aspect = aspect;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);

      const distScale = aspect < 1.05 ? Math.max(1.14, 1.48 / Math.max(aspect, 0.55)) : 1.0;
      camera.position.set(0, 10.6 * distScale, 9.8 * distScale);
      camera.lookAt(0, -0.25, 0.1);

      handCanvas.width = w;
      handCanvas.height = h;
    }

    const boardGroup = new THREE.Group();
    scene.add(boardGroup);

    // Base minimalista sem bordas no Modo Virtual AR
    const boardBaseMesh = new THREE.Mesh(
      new THREE.BoxGeometry(8.55, 0.20, 8.55),
      new THREE.MeshStandardMaterial({
        color: 0xFFFFFF,
        roughness: 0.35,
        metalness: 0.05,
        transparent: true,
        opacity: 0.90
      })
    );
    boardBaseMesh.position.y = -0.13;
    boardBaseMesh.receiveShadow = true;
    boardGroup.add(boardBaseMesh);

    // Plano de sombras transparente para Modo Tabuleiro Real
    const realShadowPlane = new THREE.Mesh(
      new THREE.PlaneGeometry(8.5, 8.5),
      new THREE.ShadowMaterial({ opacity: 0.28 })
    );
    realShadowPlane.rotation.x = -Math.PI / 2;
    realShadowPlane.position.y = 0.01;
    realShadowPlane.receiveShadow = true;
    realShadowPlane.visible = false;
    boardGroup.add(realShadowPlane);

    const lightTileMat = new THREE.MeshStandardMaterial({
      color: 0xFFFDF8,
      roughness: 0.42,
      metalness: 0.04,
      transparent: true,
      opacity: 0.92
    });
    const darkTileMat = new THREE.MeshStandardMaterial({
      color: 0x6EB9E8,
      roughness: 0.38,
      metalness: 0.08,
      transparent: true,
      opacity: 0.90
    });

    const tileGeo = new THREE.BoxGeometry(0.98, 0.055, 0.98);
    for (let r = 0; r < 8; r++) {
      for (let c = 0; c < 8; c++) {
        const isLight = (r + c) % 2 === 0;
        const tile = new THREE.Mesh(tileGeo, isLight ? lightTileMat : darkTileMat);
        tile.position.set(c - 3.5, 0, r - 3.5);
        tile.receiveShadow = true;
        boardGroup.add(tile);
      }
    }

    // Discretos marcadores nos 4 cantos da moldura apenas para sugerir redimensionamento
    const cornerDots = [];
    const cornerPositions = [
      [-4.16, 0.02, -4.16],
      [4.16, 0.02, -4.16],
      [-4.16, 0.02, 4.16],
      [4.16, 0.02, 4.16]
    ];
    const cornerDotGeo = new THREE.CylinderGeometry(0.11, 0.11, 0.03, 16);
    cornerPositions.forEach(([cx, cy, cz]) => {
      const m = new THREE.Mesh(
        cornerDotGeo,
        new THREE.MeshBasicMaterial({ color: 0x82C8F3, transparent: true, opacity: 0.48 })
      );
      m.position.set(cx, cy, cz);
      boardGroup.add(m);
      cornerDots.push(m);
    });

    // =========================================================================
    // 4. MODELOS 3D PROCEDURAIS DAS PECAS
    // =========================================================================
    function createWhiteMat() {
      return new THREE.MeshStandardMaterial({
        color: 0xFFFDF8,
        roughness: 0.26,
        metalness: 0.08,
        emissive: 0x000000,
        emissiveIntensity: 0
      });
    }

    function createBlackMat() {
      return new THREE.MeshStandardMaterial({
        color: 0x1E293B,
        roughness: 0.28,
        metalness: 0.24,
        emissive: 0x000000,
        emissiveIntensity: 0
      });
    }

    function latheFromProfile(points, segments = 24) {
      return new THREE.LatheGeometry(points.map(([x, y]) => new THREE.Vector2(x, y)), segments);
    }

    function buildPieceMesh(type, color) {
      const mat = color === 'w' ? createWhiteMat() : createBlackMat();
      const group = new THREE.Group();

      function addMesh(geo, x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0) {
        const m = new THREE.Mesh(geo, mat);
        m.position.set(x, y, z);
        m.rotation.set(rx, ry, rz);
        m.castShadow = true;
        m.receiveShadow = true;
        group.add(m);
        return m;
      }

      if (type === 'p') {
        addMesh(latheFromProfile([
          [0, 0], [0.30, 0], [0.30, 0.08], [0.24, 0.14], [0.14, 0.24],
          [0.10, 0.48], [0.16, 0.54], [0.11, 0.58], [0, 0.58]
        ]));
        addMesh(new THREE.SphereGeometry(0.165, 20, 16), 0, 0.72, 0);
      } else if (type === 'r') {
        addMesh(latheFromProfile([
          [0, 0], [0.33, 0], [0.33, 0.09], [0.27, 0.16], [0.18, 0.26],
          [0.17, 0.70], [0.24, 0.80], [0.24, 0.94], [0.15, 0.94], [0.15, 0.84], [0, 0.84]
        ]));
        for (let i = 0; i < 6; i++) {
          const ang = (i / 6) * Math.PI * 2;
          addMesh(new THREE.BoxGeometry(0.10, 0.12, 0.08), Math.cos(ang) * 0.20, 1.0, Math.sin(ang) * 0.20, 0, -ang, 0);
        }
      } else if (type === 'n') {
        addMesh(latheFromProfile([
          [0, 0], [0.33, 0], [0.33, 0.09], [0.27, 0.17], [0.20, 0.28], [0, 0.28]
        ]));
        const dir = color === 'w' ? -1 : 1;
        addMesh(new THREE.CylinderGeometry(0.13, 0.21, 0.48, 16), 0, 0.48, -dir * 0.02, dir * 0.22, 0, 0);
        addMesh(new THREE.BoxGeometry(0.20, 0.28, 0.34), 0, 0.78, dir * 0.09, dir * 0.36, 0, 0);
        addMesh(new THREE.BoxGeometry(0.14, 0.17, 0.24), 0, 0.75, dir * 0.26, dir * 0.65, 0, 0);
        addMesh(new THREE.ConeGeometry(0.055, 0.16, 10), -0.075, 0.97, dir * 0.02);
        addMesh(new THREE.ConeGeometry(0.055, 0.16, 10), 0.075, 0.97, dir * 0.02);
      } else if (type === 'b') {
        addMesh(latheFromProfile([
          [0, 0], [0.32, 0], [0.32, 0.09], [0.26, 0.16], [0.15, 0.28],
          [0.11, 0.66], [0.19, 0.73], [0.13, 0.77], [0.18, 0.90],
          [0.14, 1.04], [0.06, 1.14], [0, 1.16]
        ]));
        addMesh(new THREE.SphereGeometry(0.065, 14, 14), 0, 1.21, 0);
      } else if (type === 'q') {
        addMesh(latheFromProfile([
          [0, 0], [0.36, 0], [0.36, 0.10], [0.29, 0.18], [0.17, 0.34],
          [0.12, 0.80], [0.21, 0.88], [0.15, 0.93], [0.24, 1.15], [0.14, 1.18], [0, 1.18]
        ]));
        addMesh(new THREE.SphereGeometry(0.14, 18, 16), 0, 1.24, 0);
        addMesh(new THREE.SphereGeometry(0.055, 12, 12), 0, 1.40, 0);
        for (let i = 0; i < 8; i++) {
          const ang = (i / 8) * Math.PI * 2;
          addMesh(new THREE.SphereGeometry(0.036, 10, 10), Math.cos(ang) * 0.21, 1.20, Math.sin(ang) * 0.21);
        }
      } else if (type === 'k') {
        addMesh(latheFromProfile([
          [0, 0], [0.38, 0], [0.38, 0.11], [0.31, 0.19], [0.18, 0.36],
          [0.13, 0.86], [0.22, 0.95], [0.16, 1.00], [0.24, 1.24], [0.18, 1.32], [0, 1.34]
        ]));
        addMesh(new THREE.BoxGeometry(0.075, 0.26, 0.075), 0, 1.47, 0);
        addMesh(new THREE.BoxGeometry(0.20, 0.075, 0.075), 0, 1.50, 0);
      }

      const hitMesh = new THREE.Mesh(
        new THREE.CylinderGeometry(0.45, 0.45, 1.45, 12),
        new THREE.MeshBasicMaterial({ visible: false })
      );
      hitMesh.position.y = 0.72;
      group.add(hitMesh);

      return { group, mat, hitMesh };
    }

    // =========================================================================
    // 5. TABULEIRO FISICO LIVRE (SEM REGRAS, SEM VEZ, COM CEMITERIO LATERAL)
    // =========================================================================
    const pieces = [];
    const pieceHitMeshes = [];
    let grid = Array.from({ length: 8 }, () => Array(8).fill(null));
    const cemeteryW = [];
    const cemeteryB = [];

    function inBounds(r, c) {
      return r >= 0 && r < 8 && c >= 0 && c < 8;
    }

    function spawnPiece(type, color, row, col) {
      const built = buildPieceMesh(type, color);
      const piece = {
        type,
        color,
        row,
        col,
        inCemetery: false,
        mesh: built.group,
        mat: built.mat,
        hitMesh: built.hitMesh,
        targetPos: new THREE.Vector3(col - 3.5, 0.03, row - 3.5),
        targetScale: 1.0
      };
      built.hitMesh.userData = { piece };
      built.group.position.copy(piece.targetPos);
      boardGroup.add(built.group);
      pieces.push(piece);
      pieceHitMeshes.push(built.hitMesh);
      grid[row][col] = piece;
    }

    function setupBoard() {
      const backRank = ['r', 'n', 'b', 'q', 'k', 'b', 'n', 'r'];
      for (let c = 0; c < 8; c++) {
        spawnPiece(backRank[c], 'b', 0, c);
        spawnPiece('p', 'b', 1, c);
        spawnPiece('p', 'w', 6, c);
        spawnPiece(backRank[c], 'w', 7, c);
      }
    }

    function removePieceFromBoardOrCemetery(piece) {
      if (piece.row >= 0 && piece.col >= 0 && grid[piece.row]?.[piece.col] === piece) {
        grid[piece.row][piece.col] = null;
      }
      const iw = cemeteryW.indexOf(piece);
      if (iw >= 0) cemeteryW.splice(iw, 1);
      const ib = cemeteryB.indexOf(piece);
      if (ib >= 0) cemeteryB.splice(ib, 1);
    }

    function findFreeCemeterySpot(desiredX, desiredZ, color, ignorePiece) {
      const sideSign = desiredX < 0 ? -1 : 1;
      let cx = Math.max(-7.5, Math.min(7.5, Math.abs(desiredX) >= 4.2 ? desiredX : sideSign * 5.2));
      let cz = Math.max(-4.2, Math.min(4.2, desiredZ));

      const overlaps = (x, z) => {
        for (const p of pieces) {
          if (p === ignorePiece || !p.inCemetery) continue;
          if (Math.hypot(p.targetPos.x - x, p.targetPos.z - z) < 0.72) return true;
        }
        return false;
      };

      if (!overlaps(cx, cz)) {
        return { x: cx, z: cz };
      }

      // Se houver outra peca no mesmo ponto, acomoda ao lado sem empilhar
      const arr = color === 'b' ? cemeteryB : cemeteryW;
      const baseX = (desiredX < 0 || (Math.abs(desiredX) < 4.2 && color === 'b')) ? -5.15 : 5.15;
      const dirX = baseX < 0 ? -1 : 1;
      for (let idx = 0; idx < 16; idx++) {
        const col = idx % 2;
        const row = Math.floor(idx / 2);
        const sx = baseX + dirX * col * 0.92;
        const sz = -3.3 + row * 0.94;
        if (!overlaps(sx, sz)) {
          return { x: sx, z: sz };
        }
      }
      return { x: cx + (arr.length % 3) * 0.4, z: cz };
    }

    function placePieceInCemetery(piece, desiredX = null, desiredZ = null) {
      removePieceFromBoardOrCemetery(piece);
      const defaultSide = piece.color === 'b' ? -5.15 : 5.15;
      const dx = desiredX !== null ? desiredX : defaultSide;
      const dz = desiredZ !== null ? desiredZ : 0;
      const spot = findFreeCemeterySpot(dx, dz, piece.color, piece);

      piece.inCemetery = true;
      piece.row = -1;
      piece.col = -1;
      piece.targetScale = 0.80;
      piece.targetPos.set(spot.x, 0.02, spot.z);
      if (piece.color === 'b') cemeteryB.push(piece);
      else cemeteryW.push(piece);
      SoundFX.pieceCemetery();
    }

    function placePieceOnSquare(piece, targetRow, targetCol) {
      const existing = grid[targetRow][targetCol];
      if (existing && existing !== piece) {
        const sideX = existing.color === 'b' ? -5.15 : 5.15;
        placePieceInCemetery(existing, sideX, (targetRow - 3.5) * 0.85);
      } else {
        SoundFX.piecePlace();
      }

      removePieceFromBoardOrCemetery(piece);
      piece.inCemetery = false;
      piece.row = targetRow;
      piece.col = targetCol;
      piece.targetScale = 1.0;
      piece.targetPos.set(targetCol - 3.5, 0.03, targetRow - 3.5);
      grid[targetRow][targetCol] = piece;
    }

    function setBoardMode(mode) {
      appState.boardMode = mode;
      const isReal = mode === 'real';

      boardBaseMesh.visible = !isReal;
      realShadowPlane.visible = isReal;
      lightTileMat.opacity = isReal ? 0.14 : 0.92;
      darkTileMat.opacity = isReal ? 0.24 : 0.90;

      modeDot.classList.toggle('real', isReal);
      modeLabel.textContent = isReal ? 'Tabuleiro Real' : 'Tabuleiro Virtual';
    }

    // =========================================================================
    // 6. INTERACAO POR PINCELADA (PEGAR, MOVER, CEMITERIO E REDIMENSIONAR)
    // =========================================================================
    const raycaster = new THREE.Raycaster();
    const dragPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -0.95);
    const boardGroundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);

    function screenToNdc(sx, sy) {
      return new THREE.Vector2(
        (sx / window.innerWidth) * 2 - 1,
        -(sy / window.innerHeight) * 2 + 1
      );
    }

    function worldToBoardLocal(worldPt) {
      return boardGroup.worldToLocal(worldPt.clone());
    }

    function raycastBoardGround(sx, sy) {
      raycaster.setFromCamera(screenToNdc(sx, sy), camera);
      const hit = new THREE.Vector3();
      return raycaster.ray.intersectPlane(boardGroundPlane, hit) ? hit : null;
    }

    function raycastDragPlane(sx, sy) {
      raycaster.setFromCamera(screenToNdc(sx, sy), camera);
      const hit = new THREE.Vector3();
      return raycaster.ray.intersectPlane(dragPlane, hit) ? hit : null;
    }

    function isNearBoardCorner(local) {
      return Math.hypot(Math.abs(local.x) - 4.16, Math.abs(local.z) - 4.16) < 1.1;
    }

    function findPieceNear(sx, sy) {
      raycaster.setFromCamera(screenToNdc(sx, sy), camera);
      const hits = raycaster.intersectObjects(pieceHitMeshes, false);
      if (hits.length > 0) {
        return hits[0].object.userData.piece;
      }

      const groundWorld = raycastBoardGround(sx, sy);
      if (!groundWorld) return null;
      const local = worldToBoardLocal(groundWorld);

      // Busca por proximidade tanto no tabuleiro quanto no cemiterio lateral
      let bestPiece = null;
      let bestDist = 0.72;
      for (const p of pieces) {
        const d = Math.hypot(p.targetPos.x - local.x, p.targetPos.z - local.z);
        if (d < bestDist) {
          bestDist = d;
          bestPiece = p;
        }
      }
      return bestPiece;
    }

    function startPinchAction(sx, sy, isHandPinch = true) {
      SoundFX.unlock();

      if (isHandPinch) {
        const el = document.elementFromPoint(sx, sy);
        const btn = el && el.closest ? el.closest('button') : null;
        if (btn) {
          const now = performance.now();
          if (now - appState.lastPinchBtnTime > 650) {
            appState.lastPinchBtnTime = now;
            SoundFX.pinchGrab();
            btn.click();
          }
          return true;
        }
      }

      if (appState.heldPiece || appState.resizeDrag) return false;

      // 1) Tenta pegar qualquer peca (no tabuleiro ou no cemiterio lateral)
      const piece = findPieceNear(sx, sy);
      if (piece) {
        appState.heldPiece = piece;
        appState.heldPiece.originPos = piece.targetPos.clone();
        appState.heldPiece.originRow = piece.row;
        appState.heldPiece.originCol = piece.col;
        appState.heldPiece.originInCemetery = piece.inCemetery;
        SoundFX.pinchGrab();
        return true;
      }

      // 2) Se pincou em um dos 4 cantos/bordas externas do tabuleiro, redimensiona pela pincelada
      const ground = raycastBoardGround(sx, sy);
      if (ground) {
        const local = worldToBoardLocal(ground);
        if (isNearBoardCorner(local)) {
          const distFromCenter = Math.hypot(ground.x - boardGroup.position.x, ground.z - boardGroup.position.z);
          appState.resizeDrag = {
            startDist: Math.max(distFromCenter, 0.7),
            startScale: appState.targetBoardScale
          };
          SoundFX.pinchGrab();
          return true;
        }
      }

      return false;
    }

    function movePinchAction(sx, sy) {
      if (appState.resizeDrag) {
        const ground = raycastBoardGround(sx, sy);
        if (ground) {
          const dist = Math.hypot(ground.x - boardGroup.position.x, ground.z - boardGroup.position.z);
          const ratio = dist / appState.resizeDrag.startDist;
          appState.targetBoardScale = Math.min(2.30, Math.max(0.45, appState.resizeDrag.startScale * ratio));
          SoundFX.boardResize(appState.targetBoardScale);
        }
        return;
      }

      if (appState.heldPiece) {
        const dragWorld = raycastDragPlane(sx, sy);
        if (dragWorld) {
          const local = worldToBoardLocal(dragWorld);
          appState.heldPiece.targetPos.set(local.x, 1.25, local.z);
        }
      }
    }

    function endPinchAction(sx, sy) {
      if (appState.resizeDrag) {
        appState.resizeDrag = null;
        return;
      }

      const piece = appState.heldPiece;
      if (!piece) return;
      appState.heldPiece = null;

      const dragWorld = raycastDragPlane(sx, sy) || raycastBoardGround(sx, sy);
      const local = dragWorld ? worldToBoardLocal(dragWorld) : piece.targetPos.clone();

      // Soltou fora do grid 8x8 -> coloca ao lado do tabuleiro (cemiterio de pecas)
      const targetCol = Math.round(local.x + 3.5);
      const targetRow = Math.round(local.z + 3.5);

      if (inBounds(targetRow, targetCol) && Math.abs(local.x) <= 4.05 && Math.abs(local.z) <= 4.05) {
        placePieceOnSquare(piece, targetRow, targetCol);
      } else {
        placePieceInCemetery(piece, local.x, local.z);
      }
    }

    // Fallback simples para mouse/touch caso usuario teste sem mao
    let pointerDownActive = false;
    threeCanvas.addEventListener('pointerdown', (e) => {
      pointerDownActive = true;
      startPinchAction(e.clientX, e.clientY, false);
    });
    window.addEventListener('pointermove', (e) => {
      if (pointerDownActive) movePinchAction(e.clientX, e.clientY);
    });
    window.addEventListener('pointerup', (e) => {
      if (pointerDownActive) {
        pointerDownActive = false;
        endPinchAction(e.clientX, e.clientY);
      }
    });
    threeCanvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      const delta = e.deltaY > 0 ? -0.08 : 0.08;
      appState.targetBoardScale = Math.min(2.30, Math.max(0.45, appState.targetBoardScale + delta));
      SoundFX.boardResize(appState.targetBoardScale);
    }, { passive: false });

    // =========================================================================
    // 7. DETECTOR DE TABULEIRO FISICO NA CAMERA
    // =========================================================================
    const cvCanvas = document.createElement('canvas');
    cvCanvas.width = 160;
    cvCanvas.height = 120;
    const cvCtx = cvCanvas.getContext('2d', { willReadFrequently: true });
    let lastCvScan = 0;
    let consecutiveBoardHits = 0;

    function scanForPhysicalChessboard() {
      if (!appState.videoReady || videoEl.videoWidth === 0) return;
      if (!appState.autoSearchReal && appState.boardMode !== 'real') return;

      const W = 160, H = 120;
      cvCtx.drawImage(videoEl, 0, 0, W, H);
      const data = cvCtx.getImageData(0, 0, W, H).data;
      const gray = new Uint8Array(W * H);
      for (let i = 0, j = 0; i < data.length; i += 4, j++) {
        gray[j] = (data[i] * 77 + data[i + 1] * 150 + data[i + 2] * 29) >> 8;
      }

      const corners = [];
      const r = 3;
      const threshold = 32;

      for (let y = r + 2; y < H - r - 2; y += 2) {
        for (let x = r + 2; x < W - r - 2; x += 2) {
          const tl = gray[(y - r) * W + (x - r)];
          const tr = gray[(y - r) * W + (x + r)];
          const bl = gray[(y + r) * W + (x - r)];
          const br = gray[(y + r) * W + (x + r)];

          const diagDiff = ((tl + br) * 0.5) - ((tr + bl) * 0.5);
          const absD = Math.abs(diagDiff);
          if (absD < threshold) continue;

          if (Math.abs(tl - br) < absD * 0.45 && Math.abs(tr - bl) < absD * 0.45) {
            corners.push({ x, y, sign: diagDiff > 0 ? 1 : -1 });
          }
        }
      }

      const filtered = [];
      for (const c of corners) {
        let tooClose = false;
        for (const f of filtered) {
          if (Math.abs(f.x - c.x) < 7 && Math.abs(f.y - c.y) < 7) {
            tooClose = true;
            break;
          }
        }
        if (!tooClose) filtered.push(c);
      }

      if (filtered.length >= 16) {
        let posCount = 0, negCount = 0;
        let sumX = 0, sumY = 0;
        let minX = W, maxX = 0, minY = H, maxY = 0;

        for (const c of filtered) {
          if (c.sign > 0) posCount++;
          else negCount++;
          sumX += c.x;
          sumY += c.y;
          if (c.x < minX) minX = c.x;
          if (c.x > maxX) maxX = c.x;
          if (c.y < minY) minY = c.y;
          if (c.y > maxY) maxY = c.y;
        }

        const spanW = maxX - minX;
        const spanH = maxY - minY;
        if (posCount >= 5 && negCount >= 5 && spanW >= 32 && spanH >= 26 && spanW <= 145 && spanH <= 110) {
          consecutiveBoardHits++;
          if (consecutiveBoardHits >= 3) {
            const normCx = (sumX / filtered.length) / W;
            const normCy = (sumY / filtered.length) / H;
            const mappedCx = appState.mirrorVideo ? (1 - normCx) : normCx;
            const estScale = Math.min(1.55, Math.max(0.65, (spanW / W) * 1.45));

            if (!appState.realBoardFound) {
              appState.realBoardFound = true;
              setBoardMode('real');
              SoundFX.boardDetected();
            }

            if (appState.boardMode === 'real' && !appState.resizeDrag && !appState.dualPinch) {
              appState.targetBoardPos.set((mappedCx - 0.5) * 4.2, 0, (normCy - 0.5) * 2.6);
              appState.targetBoardScale = estScale;
            }
          }
          return;
        }
      }

      consecutiveBoardHits = Math.max(0, consecutiveBoardHits - 1);
    }

    // =========================================================================
    // 8. MEDIAPIPE HANDS + SILHUETA LEVE NA FRENTE DO TABULEIRO + PINCELADA
    // =========================================================================
    const handTrackers = [
      { isPinching: false, sx: 0, sy: 0, initialized: false, lmScreen: null, pinchRatio: 1 },
      { isPinching: false, sx: 0, sy: 0, initialized: false, lmScreen: null, pinchRatio: 1 }
    ];
    let latestLandmarks = [];
    let isProcessingHand = false;
    let mpHands = null;

    function videoToScreen(nx, ny) {
      const sw = window.innerWidth;
      const sh = window.innerHeight;
      const vw = videoEl.videoWidth || 1280;
      const vh = videoEl.videoHeight || 720;
      const scale = Math.max(sw / vw, sh / vh);
      const dw = vw * scale;
      const dh = vh * scale;
      const ox = (sw - dw) * 0.5;
      const oy = (sh - dh) * 0.5;
      const px = appState.mirrorVideo ? ox + (1 - nx) * dw : ox + nx * dw;
      const py = oy + ny * dh;
      return { x: px, y: py };
    }

    function onHandResults(results) {
      isProcessingHand = false;
      latestLandmarks = results.multiHandLandmarks || [];
      modeTogglePill.classList.remove('pinch-hover');

      if (latestLandmarks.length === 0) {
        handTrackers.forEach((ht, idx) => {
          if (ht.isPinching) {
            ht.isPinching = false;
            if (idx === 0) endPinchAction(ht.sx, ht.sy);
          }
          ht.initialized = false;
          ht.lmScreen = null;
        });
        appState.dualPinch = null;
        return;
      }

      const activePinchHands = [];

      for (let i = 0; i < Math.min(2, latestLandmarks.length); i++) {
        const lm = latestLandmarks[i];
        const pts = lm.map(p => videoToScreen(p.x, p.y));
        const ht = handTrackers[i];
        ht.lmScreen = pts;

        const palmPx = Math.hypot(pts[0].x - pts[9].x, pts[0].y - pts[9].y);
        const pinchPx = Math.hypot(pts[4].x - pts[8].x, pts[4].y - pts[8].y);
        const ratio = pinchPx / Math.max(palmPx, 28);
        ht.pinchRatio = ratio;

        const rawX = (pts[4].x + pts[8].x) * 0.5;
        const rawY = (pts[4].y + pts[8].y) * 0.5;
        if (!ht.initialized) {
          ht.sx = rawX;
          ht.sy = rawY;
          ht.initialized = true;
        } else {
          ht.sx += (rawX - ht.sx) * 0.42;
          ht.sy += (rawY - ht.sy) * 0.42;
        }

        const wasPinching = ht.isPinching;
        if (!wasPinching && (ratio < 0.44 || pinchPx < 28)) {
          ht.isPinching = true;
          if (i === 0) startPinchAction(ht.sx, ht.sy, true);
        } else if (wasPinching && ratio > 0.58 && pinchPx > 36) {
          ht.isPinching = false;
          if (i === 0) endPinchAction(ht.sx, ht.sy);
        }

        if (ht.isPinching) {
          activePinchHands.push(ht);
        }

        if (i === 0) {
          const el = document.elementFromPoint(ht.sx, ht.sy);
          if (el && el.closest && el.closest('#modeTogglePill')) {
            modeTogglePill.classList.add('pinch-hover');
          }
        }
      }

      if (latestLandmarks.length < 2) {
        handTrackers[1].isPinching = false;
        handTrackers[1].lmScreen = null;
        handTrackers[1].initialized = false;
      }

      // Pincelada dupla com duas maos: redimensiona e posiciona o tabuleiro
      if (activePinchHands.length === 2) {
        const h0 = activePinchHands[0];
        const h1 = activePinchHands[1];
        const dist = Math.hypot(h0.sx - h1.sx, h0.sy - h1.sy);
        const midX = (h0.sx + h1.sx) * 0.5;
        const midY = (h0.sy + h1.sy) * 0.5;

        if (!appState.dualPinch) {
          if (appState.heldPiece) {
            appState.heldPiece.targetPos.copy(appState.heldPiece.originPos);
            appState.heldPiece = null;
          }
          appState.resizeDrag = null;
          appState.dualPinch = {
            startDist: Math.max(dist, 40),
            startScale: appState.targetBoardScale,
            startMidGround: raycastBoardGround(midX, midY),
            startBoardPos: appState.targetBoardPos.clone()
          };
          SoundFX.pinchGrab();
        } else {
          const ratio = dist / appState.dualPinch.startDist;
          appState.targetBoardScale = Math.min(2.30, Math.max(0.45, appState.dualPinch.startScale * ratio));
          const curMidGround = raycastBoardGround(midX, midY);
          if (curMidGround && appState.dualPinch.startMidGround) {
            appState.targetBoardPos.set(
              appState.dualPinch.startBoardPos.x + (curMidGround.x - appState.dualPinch.startMidGround.x),
              0,
              appState.dualPinch.startBoardPos.z + (curMidGround.z - appState.dualPinch.startMidGround.z)
            );
          }
          SoundFX.boardResize(appState.targetBoardScale);
        }
      } else {
        appState.dualPinch = null;
        if (handTrackers[0].isPinching) {
          movePinchAction(handTrackers[0].sx, handTrackers[0].sy);
        }
      }
    }

    const FINGER_CHAINS = [
      [0, 1, 2, 3, 4],
      [0, 5, 6, 7, 8],
      [0, 9, 10, 11, 12],
      [0, 13, 14, 15, 16],
      [0, 17, 18, 19, 20]
    ];

    function renderForegroundHand() {
      const sw = handCanvas.width;
      const sh = handCanvas.height;
      handCtx.clearRect(0, 0, sw, sh);

      if (!latestLandmarks || latestLandmarks.length === 0) return;

      for (let i = 0; i < Math.min(2, latestLandmarks.length); i++) {
        const ht = handTrackers[i];
        const pts = ht.lmScreen;
        if (!pts) continue;

        const isPinch = ht.isPinching;
        handCtx.save();

        // Contorno fino e translucido da mao na frente do tabuleiro sem obstruir as pecas
        handCtx.strokeStyle = isPinch ? 'rgba(246, 179, 208, 0.62)' : 'rgba(255, 255, 255, 0.45)';
        handCtx.lineWidth = 2.0;
        handCtx.lineCap = 'round';
        handCtx.lineJoin = 'round';

        for (const chain of FINGER_CHAINS) {
          handCtx.beginPath();
          chain.forEach((idx, k) => {
            if (k === 0) handCtx.moveTo(pts[idx].x, pts[idx].y);
            else handCtx.lineTo(pts[idx].x, pts[idx].y);
          });
          handCtx.stroke();
        }

        // Pontos de pincelada no polegar (4) e indicador (8)
        for (const tipIdx of [4, 8]) {
          handCtx.beginPath();
          handCtx.arc(pts[tipIdx].x, pts[tipIdx].y, isPinch ? 5.5 : 4.5, 0, Math.PI * 2);
          handCtx.fillStyle = isPinch ? '#C83E7B' : '#82C8F3';
          handCtx.fill();
        }

        // Linha e ponto central da pincelada
        handCtx.beginPath();
        handCtx.moveTo(pts[4].x, pts[4].y);
        handCtx.lineTo(pts[8].x, pts[8].y);
        handCtx.strokeStyle = isPinch ? 'rgba(200, 62, 123, 0.85)' : 'rgba(130, 200, 243, 0.72)';
        handCtx.lineWidth = isPinch ? 3.2 : 1.8;
        handCtx.stroke();

        const radius = isPinch ? 11 : Math.min(22, Math.max(10, ht.pinchRatio * 20));
        handCtx.beginPath();
        handCtx.arc(ht.sx, ht.sy, radius, 0, Math.PI * 2);
        handCtx.fillStyle = isPinch ? 'rgba(246, 179, 208, 0.38)' : 'rgba(255, 255, 255, 0.16)';
        handCtx.fill();
        handCtx.lineWidth = isPinch ? 2.6 : 1.5;
        handCtx.strokeStyle = isPinch ? '#C83E7B' : 'rgba(130, 200, 243, 0.85)';
        handCtx.stroke();

        handCtx.restore();
      }
    }

    async function initMediaPipeHands() {
      if (typeof window.Hands === 'undefined') return;
      mpHands = new window.Hands({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
      });
      mpHands.setOptions({
        maxNumHands: 2,
        modelComplexity: 1,
        minDetectionConfidence: 0.58,
        minTrackingConfidence: 0.58
      });
      mpHands.onResults(onHandResults);
    }

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: 'user' },
          audio: false
        });
        videoEl.srcObject = stream;
        await videoEl.play();
        appState.videoReady = true;
        videoEl.classList.add('active');
      } catch (err) {
        appState.videoReady = false;
      }
    }

    modeTogglePill.addEventListener('click', () => {
      SoundFX.unlock();
      SoundFX.pinchGrab();
      if (appState.boardMode === 'virtual') {
        appState.autoSearchReal = true;
        setBoardMode('real');
      } else {
        appState.autoSearchReal = false;
        appState.targetBoardPos.set(0, 0, 0);
        setBoardMode('virtual');
      }
    });

    window.addEventListener('resize', updateCameraViewport);

    // =========================================================================
    // 9. LOOP PRINCIPAL
    // =========================================================================
    let lastHandInferTime = 0;

    function animate(now) {
      requestAnimationFrame(animate);

      appState.boardScale += (appState.targetBoardScale - appState.boardScale) * 0.22;
      boardGroup.scale.setScalar(appState.boardScale);
      appState.boardPos.lerp(appState.targetBoardPos, 0.16);
      boardGroup.position.copy(appState.boardPos);

      for (const p of pieces) {
        const lerpSpeed = p === appState.heldPiece ? 0.44 : 0.24;
        p.mesh.position.lerp(p.targetPos, lerpSpeed);
        const s = p.mesh.scale.x + (p.targetScale - p.mesh.scale.x) * 0.22;
        p.mesh.scale.setScalar(s);

        if (p === appState.heldPiece) {
          p.mat.emissive.setHex(0xC83E7B);
          p.mat.emissiveIntensity = 0.25;
        } else {
          p.mat.emissive.setHex(0x000000);
          p.mat.emissiveIntensity = 0;
        }
      }

      cornerDots.forEach((d) => {
        const active = !!appState.resizeDrag || !!appState.dualPinch;
        d.material.color.setHex(active ? 0xC83E7B : 0x82C8F3);
        d.material.opacity = active ? 0.85 : 0.42;
      });

      renderer.render(scene, camera);
      renderForegroundHand();

      if (appState.videoReady && mpHands && !isProcessingHand && videoEl.readyState >= 2 && (now - lastHandInferTime > 30)) {
        isProcessingHand = true;
        lastHandInferTime = now;
        mpHands.send({ image: videoEl }).catch(() => {
          isProcessingHand = false;
        });
      }

      if (now - lastCvScan > 250) {
        lastCvScan = now;
        scanForPhysicalChessboard();
      }
    }

    updateCameraViewport();
    setupBoard();
    setBoardMode('virtual');
    initMediaPipeHands();
    startCamera();
    requestAnimationFrame(animate);
  })();
  </script>
</body>
</html>
