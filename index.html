        videoEl.classList.add('active');

        if (track && track.getCapabilities && track.applyConstraints) {
          try {
            const caps = track.getCapabilities();
            if (caps.zoom && typeof caps.zoom.min === 'number') {
              await track.applyConstraints({ advanced: [{ zoom: caps.zoom.min }] }).catch(() => {});
            }
          } catch (e) {}
        }
      } catch (err) {
        appState.videoReady = false;
      }
    }

    window.addEventListener('resize', updateCameraViewport);

    // =========================================================================
    // 12. LOOP PRINCIPAL 6DoF RIGIDO (SEM CISALHAMENTO)
    // =========================================================================
    let lastHandInferTime = 0;

    function animate(now) {
      requestAnimationFrame(animate);

      // Interpola suavemente posicao 3D e quaternion unitario 3D (100% rigido!)
      appState.currentPos.lerp(appState.targetPos, 0.22);
      appState.currentQuat.slerp(appState.targetQuat, 0.22);

      boardGroup.position.copy(appState.currentPos);
      boardGroup.quaternion.copy(appState.currentQuat);

      // Rotacao interna de 90/180/270 graus que garante a Rainha Branca (d1) na casa clara
      const targetInnerYaw = appState.queenRotationSteps * (Math.PI * 0.5);
      let yawDiff = targetInnerYaw - boardInnerGroup.rotation.y;
      while (yawDiff > Math.PI) yawDiff -= Math.PI * 2;
      while (yawDiff < -Math.PI) yawDiff += Math.PI * 2;
      boardInnerGroup.rotation.y += yawDiff * 0.22;

      keyLight.position.set(
        boardGroup.position.x + 4,
        boardGroup.position.y + 12,
        boardGroup.position.z + 6
      );
      keyLight.target.position.copy(boardGroup.position);
      keyLight.target.updateMatrixWorld();

      const activeFocusPiece = appState.heldPiece || appState.hoveredPiece;
      if (activeFocusPiece) {
        if (appState.heldPiece) {
          const inBoard = Math.abs(activeFocusPiece.targetPos.x) <= 4.05 && Math.abs(activeFocusPiece.targetPos.z) <= 4.05;
          const tCol = Math.round(activeFocusPiece.targetPos.x + 3.5);
          const tRow = Math.round(activeFocusPiece.targetPos.z + 3.5);
          const occ = (inBoard && inBounds(tRow, tCol)) ? grid[tRow][tCol] : null;
          const blockedSameColor = occ && occ !== activeFocusPiece && occ.color === activeFocusPiece.color;
          const sx = inBoard ? tCol - 3.5 : activeFocusPiece.targetPos.x;
          const sz = inBoard ? tRow - 3.5 : activeFocusPiece.targetPos.z;
          focusRingMesh.position.set(sx, 0.045, sz);
          focusRingMat.color.setHex(0xF6B3D0);
          focusRingMat.opacity = blockedSameColor ? 0 : 0.72;
        } else {
          focusRingMesh.position.set(activeFocusPiece.targetPos.x, 0.045, activeFocusPiece.targetPos.z);
          focusRingMat.color.setHex(0x82C8F3);
          focusRingMat.opacity = 0.56;
        }
      } else {
        focusRingMat.opacity = 0;
      }

      for (const p of pieces) {
        const lerpSpeed = p === appState.heldPiece ? 0.44 : 0.24;
        p.mesh.position.lerp(p.targetPos, lerpSpeed);

        if (p === appState.heldPiece) {
          p.mat.emissive.setHex(0xF6B3D0);
          p.mat.emissiveIntensity = 0.44;
        } else if (p === appState.hoveredPiece) {
          p.mat.emissive.setHex(0x82C8F3);
          p.mat.emissiveIntensity = 0.36;
        } else {
          p.mat.emissive.setHex(0x000000);
          p.mat.emissiveIntensity = 0;
        }
      }

      renderer.render(scene, camera);
      renderOverlay2D();

      if (appState.videoReady && mpHands && !isProcessingHand && videoEl.readyState >= 2 && (now - lastHandInferTime > 30)) {
        isProcessingHand = true;
        lastHandInferTime = now;
        mpHands.send({ image: videoEl }).catch(() => {
          isProcessingHand = false;
        });
      }

      if (now - lastCvTime > 48) {
        lastCvTime = now;
        runArVisionStep(now);
      }
    }

    updateCameraViewport();
    setupBoard();
    restorePersistentMemory();
    updateHudUI();
    initMediaPipeHands();
    startCamera();
    requestAnimationFrame(animate);
  })();
  </script>
</body>
</html>
