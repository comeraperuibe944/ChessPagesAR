<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#F6B3D0">
  <title>ChessPages AR</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      border: none !important;
      outline: none !important;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #F8FAFC;
      position: relative;
    }

    .ambient-bg {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: linear-gradient(180deg, #FDFCFB 0%, #F4F8FC 50%, #FEF9FB 100%);
    }

    #cameraVideo {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 2;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    #cameraVideo.active {
      opacity: 1;
    }

    #cameraVideo.mirrored {
      transform: scaleX(-1);
    }

    #threeCanvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 10;
      display: block;
      touch-action: none;
    }

    #handOverlayCanvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 20;
      pointer-events: none;
      display: block;
    }
  </style>
</head>
<body>
  <div class="ambient-bg" aria-hidden="true"></div>
  <video id="cameraVideo" class="mirrored" autoplay playsinline muted></video>
  <canvas id="threeCanvas"></canvas>
  <canvas id="handOverlayCanvas"></canvas>

  <script>
  (function () {
    'use strict';

    // =========================================================================
    // 1. AUDIO PROCEDURAL (Web Audio API)
    // =========================================================================
    const SoundFX = (() => {
      let ctx = null;

      function ensureCtx() {
        if (!ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return null;
          ctx = new AudioCtx();
        }
        if (ctx.state === 'suspended') {
          ctx.resume().catch(() => {});
        }
        return ctx;
      }

      function tone(freq, endFreq, dur, type, vol, delay = 0) {
        const c = ensureCtx();
        if (!c) return;
        const now = c.currentTime + delay;
        const osc = c.createOscillator();
        const gain = c.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, now);
        if (endFreq && endFreq !== freq) {
          osc.frequency.exponentialRampToValueAtTime(Math.max(20, endFreq), now + dur);
        }
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.linearRampToValueAtTime(vol, now + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);
        osc.connect(gain);
        gain.connect(c.destination);
        osc.start(now);
        osc.stop(now + dur + 0.02);
      }

      return {
        unlock: ensureCtx,
        pinchGrab() {
          tone(540, 820, 0.055, 'sine', 0.08);
        },
        piecePlace() {
          tone(175, 62, 0.095, 'triangle', 0.15);
        },
        pieceSide() {
          tone(145, 50, 0.12, 'triangle', 0.14);
          tone(440, 620, 0.10, 'sine', 0.06, 0.02);
        },
        boardDetected() {
          tone(523.25, 659.25, 0.11, 'sine', 0.055, 0);
          tone(783.99, 1046.5, 0.13, 'sine', 0.055, 0.065);
        }
      };
    })();

    // =========================================================================
    // 2. ELEMENTOS E ESTADO AR AUTOMATICO
    // =========================================================================
    const videoEl = document.getElementById('cameraVideo');
    const threeCanvas = document.getElementById('threeCanvas');
    const handCanvas = document.getElementById('handOverlayCanvas');
    const handCtx = handCanvas.getContext('2d');

    const appState = {
      boardMode: 'virtual',   // 'virtual' (ancora em mesa) | 'real' (tabuleiro fisico)
      mirrorVideo: true,
      videoReady: false,
      boardScale: 1.0,
      targetBoardScale: 1.0,
      boardPos: new THREE.Vector3(0, 0, 0),
      targetBoardPos: new THREE.Vector3(0, 0, 0),
      boardYaw: 0,
      targetBoardYaw: 0,
      heldPiece: null,
      hoveredPiece: null
    };

    // =========================================================================
    // 3. CENA 3D AR LIMPA (ZERO UI, ZERO CEMITERIO VISIVEL)
    // =========================================================================
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(44, window.innerWidth / window.innerHeight, 0.1, 120);
    const renderer = new THREE.WebGLRenderer({
      canvas: threeCanvas,
      alpha: true,
      antialias: true,
      powerPreference: 'high-performance'
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x000000, 0);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    scene.add(new THREE.HemisphereLight(0xFFFFFF, 0xF6B3D0, 0.90));

    const keyLight = new THREE.DirectionalLight(0xFFFDF7, 0.92);
    keyLight.position.set(6, 16, 9);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.width = 2048;
    keyLight.shadow.mapSize.height = 2048;
    keyLight.shadow.camera.near = 2;
    keyLight.shadow.camera.far = 42;
    keyLight.shadow.camera.left = -10;
    keyLight.shadow.camera.right = 10;
    keyLight.shadow.camera.top = 10;
    keyLight.shadow.camera.bottom = -10;
    keyLight.shadow.bias = -0.0005;
    scene.add(keyLight);

    const rimLight = new THREE.DirectionalLight(0x82C8F3, 0.42);
    rimLight.position.set(-8, 8, -7);
    scene.add(rimLight);

    function updateCameraViewport() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      const aspect = w / Math.max(h, 1);
      camera.aspect = aspect;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);

      const distScale = aspect < 1.05 ? Math.max(1.14, 1.48 / Math.max(aspect, 0.55)) : 1.0;
      camera.position.set(0, 10.6 * distScale, 9.8 * distScale);
      camera.lookAt(0, -0.25, 0.1);

      handCanvas.width = w;
      handCanvas.height = h;
    }

    const boardGroup = new THREE.Group();
    scene.add(boardGroup);

    // Base do tabuleiro virtual AR
    const boardBaseMesh = new THREE.Mesh(
      new THREE.BoxGeometry(8.45, 0.20, 8.45),
      new THREE.MeshStandardMaterial({
        color: 0xFFFFFF,
        roughness: 0.35,
        metalness: 0.05,
        transparent: true,
        opacity: 0.90
      })
    );
    boardBaseMesh.position.y = -0.13;
    boardBaseMesh.receiveShadow = true;
    boardGroup.add(boardBaseMesh);

    // Plano receptor de sombra sobre a superficie real (mesa ou tabuleiro fisico)
    const realShadowPlane = new THREE.Mesh(
      new THREE.PlaneGeometry(16, 12),
      new THREE.ShadowMaterial({ opacity: 0.28 })
    );
    realShadowPlane.rotation.x = -Math.PI / 2;
    realShadowPlane.position.y = 0.005;
    realShadowPlane.receiveShadow = true;
    boardGroup.add(realShadowPlane);

    const lightTileMat = new THREE.MeshStandardMaterial({
      color: 0xFFFDF8,
      roughness: 0.42,
      metalness: 0.04,
      transparent: true,
      opacity: 0.92
    });
    const darkTileMat = new THREE.MeshStandardMaterial({
      color: 0x6EB9E8,
      roughness: 0.38,
      metalness: 0.08,
      transparent: true,
      opacity: 0.90
    });

    const tileGeo = new THREE.BoxGeometry(0.98, 0.055, 0.98);
    for (let r = 0; r < 8; r++) {
      for (let c = 0; c < 8; c++) {
        const isLight = (r + c) % 2 === 0;
        const tile = new THREE.Mesh(tileGeo, isLight ? lightTileMat : darkTileMat);
        tile.position.set(c - 3.5, 0, r - 3.5);
        tile.receiveShadow = true;
        boardGroup.add(tile);
      }
    }

    // Anel sutil no plano da mesa/casa abaixo da peca apontada ou segurada
    const focusRingMat = new THREE.MeshBasicMaterial({
      color: 0x82C8F3,
      transparent: true,
      opacity: 0,
      side: THREE.DoubleSide
    });
    const focusRingMesh = new THREE.Mesh(new THREE.RingGeometry(0.32, 0.44, 28), focusRingMat);
    focusRingMesh.rotation.x = -Math.PI / 2;
    focusRingMesh.position.y = 0.045;
    boardGroup.add(focusRingMesh);

    // =========================================================================
    // 4. PECAS 3D STAUNTON
    // =========================================================================
    function createWhiteMat() {
      return new THREE.MeshStandardMaterial({
        color: 0xFFFDF8,
        roughness: 0.26,
        metalness: 0.08,
        emissive: 0x000000,
        emissiveIntensity: 0
      });
    }

    function createBlackMat() {
      return new THREE.MeshStandardMaterial({
        color: 0x1E293B,
        roughness: 0.28,
        metalness: 0.24,
        emissive: 0x000000,
        emissiveIntensity: 0
      });
    }

    function latheFromProfile(points, segments = 24) {
      return new THREE.LatheGeometry(points.map(([x, y]) => new THREE.Vector2(x, y)), segments);
    }

    function buildPieceMesh(type, color) {
      const mat = color === 'w' ? createWhiteMat() : createBlackMat();
      const group = new THREE.Group();

      function addMesh(geo, x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0) {
        const m = new THREE.Mesh(geo, mat);
        m.position.set(x, y, z);
        m.rotation.set(rx, ry, rz);
        m.castShadow = true;
        m.receiveShadow = true;
        group.add(m);
        return m;
      }

      if (type === 'p') {
        addMesh(latheFromProfile([
          [0, 0], [0.30, 0], [0.30, 0.08], [0.24, 0.14], [0.14, 0.24],
          [0.10, 0.48], [0.16, 0.54], [0.11, 0.58], [0, 0.58]
        ]));
        addMesh(new THREE.SphereGeometry(0.165, 20, 16), 0, 0.72, 0);
      } else if (type === 'r') {
        addMesh(latheFromProfile([
          [0, 0], [0.33, 0], [0.33, 0.09], [0.27, 0.16], [0.18, 0.26],
          [0.17, 0.70], [0.24, 0.80], [0.24, 0.94], [0.15, 0.94], [0.15, 0.84], [0, 0.84]
        ]));
        for (let i = 0; i < 6; i++) {
          const ang = (i / 6) * Math.PI * 2;
          addMesh(new THREE.BoxGeometry(0.10, 0.12, 0.08), Math.cos(ang) * 0.20, 1.0, Math.sin(ang) * 0.20, 0, -ang, 0);
        }
      } else if (type === 'n') {
        addMesh(latheFromProfile([
          [0, 0], [0.33, 0], [0.33, 0.09], [0.27, 0.17], [0.20, 0.28], [0, 0.28]
        ]));
        const dir = color === 'w' ? -1 : 1;
        addMesh(new THREE.CylinderGeometry(0.13, 0.21, 0.48, 16), 0, 0.48, -dir * 0.02, dir * 0.22, 0, 0);
        addMesh(new THREE.BoxGeometry(0.20, 0.28, 0.34), 0, 0.78, dir * 0.09, dir * 0.36, 0, 0);
        addMesh(new THREE.BoxGeometry(0.14, 0.17, 0.24), 0, 0.75, dir * 0.26, dir * 0.65, 0, 0);
        addMesh(new THREE.ConeGeometry(0.055, 0.16, 10), -0.075, 0.97, dir * 0.02);
        addMesh(new THREE.ConeGeometry(0.055, 0.16, 10), 0.075, 0.97, dir * 0.02);
      } else if (type === 'b') {
        addMesh(latheFromProfile([
          [0, 0], [0.32, 0], [0.32, 0.09], [0.26, 0.16], [0.15, 0.28],
          [0.11, 0.66], [0.19, 0.73], [0.13, 0.77], [0.18, 0.90],
          [0.14, 1.04], [0.06, 1.14], [0, 1.16]
        ]));
        addMesh(new THREE.SphereGeometry(0.065, 14, 14), 0, 1.21, 0);
      } else if (type === 'q') {
        addMesh(latheFromProfile([
          [0, 0], [0.36, 0], [0.36, 0.10], [0.29, 0.18], [0.17, 0.34],
          [0.12, 0.80], [0.21, 0.88], [0.15, 0.93], [0.24, 1.15], [0.14, 1.18], [0, 1.18]
        ]));
        addMesh(new THREE.SphereGeometry(0.14, 18, 16), 0, 1.24, 0);
        addMesh(new THREE.SphereGeometry(0.055, 12, 12), 0, 1.40, 0);
        for (let i = 0; i < 8; i++) {
          const ang = (i / 8) * Math.PI * 2;
          addMesh(new THREE.SphereGeometry(0.036, 10, 10), Math.cos(ang) * 0.21, 1.20, Math.sin(ang) * 0.21);
        }
      } else if (type === 'k') {
        addMesh(latheFromProfile([
          [0, 0], [0.38, 0], [0.38, 0.11], [0.31, 0.19], [0.18, 0.36],
          [0.13, 0.86], [0.22, 0.95], [0.16, 1.00], [0.24, 1.24], [0.18, 1.32], [0, 1.34]
        ]));
        addMesh(new THREE.BoxGeometry(0.075, 0.26, 0.075), 0, 1.47, 0);
        addMesh(new THREE.BoxGeometry(0.20, 0.075, 0.075), 0, 1.50, 0);
      }

      const hitMesh = new THREE.Mesh(
        new THREE.CylinderGeometry(0.45, 0.45, 1.45, 12),
        new THREE.MeshBasicMaterial({ visible: false })
      );
      hitMesh.position.y = 0.72;
      group.add(hitMesh);

      return { group, mat, hitMesh };
    }

    // =========================================================================
    // 5. TABULEIRO LIVRE (SEM REGRAS, SEM VEZ, SEM CEMITERIO VISUAL)
    // =========================================================================
    const pieces = [];
    const pieceHitMeshes = [];
    const grid = Array.from({ length: 8 }, () => Array(8).fill(null));

    function inBounds(r, c) {
      return r >= 0 && r < 8 && c >= 0 && c < 8;
    }

    function spawnPiece(type, color, row, col) {
      const built = buildPieceMesh(type, color);
      const piece = {
        type,
        color,
        row,
        col,
        mesh: built.group,
        mat: built.mat,
        hitMesh: built.hitMesh,
        targetPos: new THREE.Vector3(col - 3.5, 0.03, row - 3.5)
      };
      built.hitMesh.userData = { piece };
      built.group.position.copy(piece.targetPos);
      boardGroup.add(built.group);
      pieces.push(piece);
      pieceHitMeshes.push(built.hitMesh);
      grid[row][col] = piece;
    }

    function setupBoard() {
      const backRank = ['r', 'n', 'b', 'q', 'k', 'b', 'n', 'r'];
      for (let c = 0; c < 8; c++) {
        spawnPiece(backRank[c], 'b', 0, c);
        spawnPiece('p', 'b', 1, c);
        spawnPiece('p', 'w', 6, c);
        spawnPiece(backRank[c], 'w', 7, c);
      }
    }

    function clearGridCell(piece) {
      if (piece.row >= 0 && piece.col >= 0 && grid[piece.row]?.[piece.col] === piece) {
        grid[piece.row][piece.col] = null;
      }
    }

    function slideDisplacedPieceBesideBoard(piece, preferredZ) {
      clearGridCell(piece);
      piece.row = -1;
      piece.col = -1;
      const sideSign = piece.color === 'b' ? -1 : 1;
      let tx = sideSign * 4.95;
      let tz = Math.max(-3.6, Math.min(3.6, preferredZ));
      // Evita sobreposicao exata com outra peca fora do tabuleiro
      for (let attempt = 0; attempt < 16; attempt++) {
        let collision = false;
        for (const other of pieces) {
          if (other !== piece && other.row === -1 && Math.hypot(other.targetPos.x - tx, other.targetPos.z - tz) < 0.72) {
            collision = true;
            break;
          }
        }
        if (!collision) break;
        const col = attempt % 2;
        const row = Math.floor(attempt / 2);
        tx = sideSign * (4.9 + col * 0.85);
        tz = -3.2 + row * 0.92;
      }
      piece.targetPos.set(tx, 0.01, tz);
    }

    function placePieceOnTable(piece, localX, localZ) {
      const targetCol = Math.round(localX + 3.5);
      const targetRow = Math.round(localZ + 3.5);

      if (inBounds(targetRow, targetCol) && Math.abs(localX) <= 4.05 && Math.abs(localZ) <= 4.05) {
        const occupant = grid[targetRow][targetCol];
        if (occupant && occupant !== piece) {
          slideDisplacedPieceBesideBoard(occupant, targetRow - 3.5);
          SoundFX.pieceSide();
        } else {
          SoundFX.piecePlace();
        }
        clearGridCell(piece);
        piece.row = targetRow;
        piece.col = targetCol;
        piece.targetPos.set(targetCol - 3.5, 0.03, targetRow - 3.5);
        grid[targetRow][targetCol] = piece;
      } else {
        // Soltou ao lado do tabuleiro -> pousa diretamente sobre o plano da mesa onde foi solta
        clearGridCell(piece);
        piece.row = -1;
        piece.col = -1;
        const cx = Math.max(-8.0, Math.min(8.0, localX));
        const cz = Math.max(-5.0, Math.min(5.0, localZ));
        piece.targetPos.set(cx, 0.01, cz);
        SoundFX.pieceSide();
      }
    }

    function applyBoardVisualMode(mode) {
      if (appState.boardMode === mode) return;
      appState.boardMode = mode;
      const isReal = mode === 'real';
      boardBaseMesh.visible = !isReal;
      lightTileMat.opacity = isReal ? 0.05 : 0.92;
      darkTileMat.opacity = isReal ? 0.09 : 0.90;
    }

    // =========================================================================
    // 6. INTERACAO POR PINCELADA (SOMENTE PEGAR E SOLTAR PECAS)
    // =========================================================================
    const raycaster = new THREE.Raycaster();
    const dragPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -0.95);
    const boardGroundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);

    function screenToNdc(sx, sy) {
      return new THREE.Vector2(
        (sx / window.innerWidth) * 2 - 1,
        -(sy / window.innerHeight) * 2 + 1
      );
    }

    function worldToBoardLocal(worldPt) {
      return boardGroup.worldToLocal(worldPt.clone());
    }

    function raycastBoardGround(sx, sy) {
      raycaster.setFromCamera(screenToNdc(sx, sy), camera);
      const hit = new THREE.Vector3();
      return raycaster.ray.intersectPlane(boardGroundPlane, hit) ? hit : null;
    }

    function raycastDragPlane(sx, sy) {
      raycaster.setFromCamera(screenToNdc(sx, sy), camera);
      const hit = new THREE.Vector3();
      return raycaster.ray.intersectPlane(dragPlane, hit) ? hit : null;
    }

    function findPieceNear(sx, sy) {
      raycaster.setFromCamera(screenToNdc(sx, sy), camera);
      const hits = raycaster.intersectObjects(pieceHitMeshes, false);
      if (hits.length > 0) {
        return hits[0].object.userData.piece;
      }

      const groundWorld = raycastBoardGround(sx, sy);
      if (!groundWorld) return null;
      const local = worldToBoardLocal(groundWorld);

      let bestPiece = null;
      let bestDist = 0.68;
      for (const p of pieces) {
        const d = Math.hypot(p.targetPos.x - local.x, p.targetPos.z - local.z);
        if (d < bestDist) {
          bestDist = d;
          bestPiece = p;
        }
      }
      return bestPiece;
    }

    function startPinchAction(sx, sy) {
      SoundFX.unlock();
      if (appState.heldPiece) return;
      const piece = findPieceNear(sx, sy);
      if (piece) {
        appState.heldPiece = piece;
        SoundFX.pinchGrab();
      }
    }

    function movePinchAction(sx, sy) {
      if (appState.heldPiece) {
        const dragWorld = raycastDragPlane(sx, sy);
        if (dragWorld) {
          const local = worldToBoardLocal(dragWorld);
          appState.heldPiece.targetPos.set(local.x, 1.35, local.z);
        }
      } else {
        appState.hoveredPiece = findPieceNear(sx, sy);
      }
    }

    function endPinchAction(sx, sy) {
      const piece = appState.heldPiece;
      if (!piece) return;
      appState.heldPiece = null;

      const dragWorld = raycastDragPlane(sx, sy) || raycastBoardGround(sx, sy);
      const local = dragWorld ? worldToBoardLocal(dragWorld) : piece.targetPos.clone();
      placePieceOnTable(piece, local.x, local.z);
    }

    let pointerDownActive = false;
    threeCanvas.addEventListener('pointerdown', (e) => {
      pointerDownActive = true;
      startPinchAction(e.clientX, e.clientY);
    });
    window.addEventListener('pointermove', (e) => {
      movePinchAction(e.clientX, e.clientY);
    });
    window.addEventListener('pointerup', (e) => {
      if (pointerDownActive) {
        pointerDownActive = false;
        endPinchAction(e.clientX, e.clientY);
      }
    });

    // =========================================================================
    // 7. TRACKER AR AUTOMATICO (TABULEIRO REAL + ANCORA DE SUPERFICIE TIPO MINECRAFT EARTH)
    // =========================================================================
    const cvW = 160;
    const cvH = 120;
    const cvCanvas = document.createElement('canvas');
    cvCanvas.width = cvW;
    cvCanvas.height = cvH;
    const cvCtx = cvCanvas.getContext('2d', { willReadFrequently: true });
    let lastCvTime = 0;

    // Estado do rastreador de tabuleiro fisico
    let realBoardHits = 0;
    let realBoardMisses = 0;

    // Estado do rastreador de superficie plana (Optical Flow SAD em patches)
    const surfacePatches = [];
    let gyroPitchBias = 0;
    let gyroRollBias = 0;
    let lastGyroBeta = null;
    let lastGyroGamma = null;

    if (window.DeviceOrientationEvent) {
      window.addEventListener('deviceorientation', (ev) => {
        if (ev.beta === null || ev.gamma === null) return;
        if (lastGyroBeta !== null) {
          let db = ev.beta - lastGyroBeta;
          let dg = ev.gamma - lastGyroGamma;
          if (Math.abs(db) < 15 && Math.abs(dg) < 15) {
            gyroPitchBias += db;
            gyroRollBias += dg;
          }
        }
        lastGyroBeta = ev.beta;
        lastGyroGamma = ev.gamma;
      }, { passive: true });
    }

    function extractPatch(gray, cx, cy, half = 3) {
      const size = half * 2 + 1;
      const buf = new Uint8Array(size * size);
      let mean = 0;
      let k = 0;
      for (let dy = -half; dy <= half; dy++) {
        const rowOff = (cy + dy) * cvW;
        for (let dx = -half; dx <= half; dx++) {
          const val = gray[rowOff + cx + dx];
          buf[k++] = val;
          mean += val;
        }
      }
      mean /= buf.length;
      let variance = 0;
      for (let i = 0; i < buf.length; i++) {
        const d = buf[i] - mean;
        variance += d * d;
      }
      return { buf, variance: variance / buf.length };
    }

    function seedSurfacePatches(gray) {
      surfacePatches.length = 0;
      // Procura regioes na metade inferior-central (onde mesas/superficies planas aparecem)
      const candidates = [];
      for (let y = 42; y <= 104; y += 10) {
        for (let x = 26; x <= 134; x += 12) {
          const { buf, variance } = extractPatch(gray, x, y, 3);
          // Queremos micro-textura suficiente para rastrear, mas sem bordas extremas de objetos altos
          if (variance >= 28 && variance <= 1800) {
            candidates.push({ x, y, buf, variance });
          }
        }
      }

      // Escolhe ate 6 patches bem distribuidos pela superficie
      candidates.sort((a, b) => b.variance - a.variance);
      for (const c of candidates) {
        let tooClose = false;
        for (const p of surfacePatches) {
          if (Math.hypot(p.x - c.x, p.y - c.y) < 20) {
            tooClose = true;
            break;
          }
        }
        if (!tooClose) {
          surfacePatches.push({ x: c.x, y: c.y, buf: c.buf });
          if (surfacePatches.length >= 6) break;
        }
      }
    }

    function trackSurfacePlane(gray) {
      if (surfacePatches.length < 3) {
        seedSurfacePatches(gray);
        return;
      }

      const half = 3;
      const searchR = 9;
      const tracked = [];

      for (const p of surfacePatches) {
        if (p.x < half + searchR + 2 || p.x >= cvW - half - searchR - 2 ||
            p.y < half + searchR + 2 || p.y >= cvH - half - searchR - 2) {
          continue;
        }

        let bestSad = Infinity;
        let bestX = p.x;
        let bestY = p.y;

        for (let sy = -searchR; sy <= searchR; sy++) {
          for (let sx = -searchR; sx <= searchR; sx++) {
            const cx = p.x + sx;
            const cy = p.y + sy;
            let sad = 0;
            let k = 0;
            for (let dy = -half; dy <= half; dy++) {
              const rowOff = (cy + dy) * cvW;
              for (let dx = -half; dx <= half; dx++) {
                sad += Math.abs(gray[rowOff + cx + dx] - p.buf[k++]);
              }
            }
            if (sad < bestSad) {
              bestSad = sad;
              bestX = cx;
              bestY = cy;
            }
          }
        }

        // Aceita apenas correspondencia fiel da superficie (ignora oclusao da mao)
        if (bestSad / 49 < 22) {
          tracked.push({
            oldX: p.x,
            oldY: p.y,
            newX: bestX,
            newY: bestY,
            dx: bestX - p.x,
            dy: bestY - p.y,
            patch: p
          });
        }
      }

      if (tracked.length >= 3) {
        const dxs = tracked.map(t => t.dx).sort((a, b) => a - b);
        const dys = tracked.map(t => t.dy).sort((a, b) => a - b);
        const medDx = dxs[Math.floor(dxs.length / 2)];
        const medDy = dys[Math.floor(dys.length / 2)];

        // Deadzone contra ruido estatico de webcam parada
        const moveMag = Math.hypot(medDx, medDy);
        if (moveMag > 0.4) {
          const normDx = (appState.mirrorVideo ? -medDx : medDx) / cvW;
          const normDy = medDy / cvH;

          // Projeta movimento da superficie ancorada para o mundo 3D
          const worldStepX = normDx * 14.5;
          const worldStepZ = normDy * 11.0;

          appState.targetBoardPos.x = Math.max(-4.5, Math.min(4.5, appState.targetBoardPos.x + worldStepX));
          appState.targetBoardPos.z = Math.max(-3.5, Math.min(3.5, appState.targetBoardPos.z + worldStepZ));
        }

        // Calcula mudanca de escala aparente entre pares de pontos da superficie
        if (tracked.length >= 3) {
          let sumOld = 0, sumNew = 0;
          for (let i = 0; i < tracked.length; i++) {
            for (let j = i + 1; j < tracked.length; j++) {
              const dOld = Math.hypot(tracked[i].oldX - tracked[j].oldX, tracked[i].oldY - tracked[j].oldY);
              const dNew = Math.hypot(tracked[i].newX - tracked[j].newX, tracked[i].newY - tracked[j].newY);
              if (dOld > 12) {
                sumOld += dOld;
                sumNew += dNew;
              }
            }
          }
          if (sumOld > 0) {
            const ratio = sumNew / sumOld;
            if (Math.abs(ratio - 1) > 0.012 && Math.abs(ratio - 1) < 0.25) {
              appState.targetBoardScale = Math.max(0.55, Math.min(1.85, appState.targetBoardScale * ratio));
            }
          }
        }

        // Atualiza posicoes e templates dos patches rastreados
        surfacePatches.length = 0;
        for (const t of tracked) {
          const refreshed = extractPatch(gray, t.newX, t.newY, half);
          surfacePatches.push({ x: t.newX, y: t.newY, buf: refreshed.buf });
        }

        // Repoe patches perdidos para manter ancora continua durante movimento
        if (surfacePatches.length < 5) {
          for (let y = 42; y <= 104 && surfacePatches.length < 6; y += 14) {
            for (let x = 28; x <= 132 && surfacePatches.length < 6; x += 18) {
              if (surfacePatches.some(p => Math.hypot(p.x - x, p.y - y) < 18)) continue;
              const cand = extractPatch(gray, x, y, half);
              if (cand.variance >= 32 && cand.variance <= 1600) {
                surfacePatches.push({ x, y, buf: cand.buf });
              }
            }
          }
        }
      } else {
        seedSurfacePatches(gray);
      }

      // Compensacao suave por giroscopio se disponivel em dispositivo movel
      if (Math.abs(gyroRollBias) > 0.05 || Math.abs(gyroPitchBias) > 0.05) {
        appState.targetBoardYaw = Math.max(-0.45, Math.min(0.45, appState.targetBoardYaw - gyroRollBias * 0.008));
        gyroRollBias = 0;
        gyroPitchBias = 0;
      }
    }

    function detectPhysicalChessboard(gray) {
      const corners = [];
      const r = 3;
      const threshold = 32;

      for (let y = r + 2; y < cvH - r - 2; y += 2) {
        for (let x = r + 2; x < cvW - r - 2; x += 2) {
          const tl = gray[(y - r) * cvW + (x - r)];
          const tr = gray[(y - r) * cvW + (x + r)];
          const bl = gray[(y + r) * cvW + (x - r)];
          const br = gray[(y + r) * cvW + (x + r)];

          const diagDiff = ((tl + br) * 0.5) - ((tr + bl) * 0.5);
          const absD = Math.abs(diagDiff);
          if (absD < threshold) continue;

          if (Math.abs(tl - br) < absD * 0.45 && Math.abs(tr - bl) < absD * 0.45) {
            corners.push({ x, y, sign: diagDiff > 0 ? 1 : -1 });
          }
        }
      }

      const filtered = [];
      for (const c of corners) {
        let tooClose = false;
        for (const f of filtered) {
          if (Math.abs(f.x - c.x) < 7 && Math.abs(f.y - c.y) < 7) {
            tooClose = true;
            break;
          }
        }
        if (!tooClose) filtered.push(c);
      }

      if (filtered.length >= 16) {
        let posCount = 0, negCount = 0;
        let sumX = 0, sumY = 0;
        let minX = cvW, maxX = 0, minY = cvH, maxY = 0;

        for (const c of filtered) {
          if (c.sign > 0) posCount++;
          else negCount++;
          sumX += c.x;
          sumY += c.y;
          if (c.x < minX) minX = c.x;
          if (c.x > maxX) maxX = c.x;
          if (c.y < minY) minY = c.y;
          if (c.y > maxY) maxY = c.y;
        }

        const spanW = maxX - minX;
        const spanH = maxY - minY;
        if (posCount >= 5 && negCount >= 5 && spanW >= 32 && spanH >= 26 && spanW <= 145 && spanH <= 110) {
          realBoardHits++;
          realBoardMisses = 0;
          if (realBoardHits >= 3) {
            const normCx = (sumX / filtered.length) / cvW;
            const normCy = (sumY / filtered.length) / cvH;
            const mappedCx = appState.mirrorVideo ? (1 - normCx) : normCx;
            const estScale = Math.min(1.65, Math.max(0.60, (spanW / cvW) * 1.48));

            if (appState.boardMode !== 'real') {
              applyBoardVisualMode('real');
              SoundFX.boardDetected();
            }

            appState.targetBoardPos.set((mappedCx - 0.5) * 4.5, 0, (normCy - 0.5) * 2.8);
            appState.targetBoardScale = estScale;
          }
          return true;
        }
      }

      realBoardHits = Math.max(0, realBoardHits - 1);
      realBoardMisses++;
      if (realBoardMisses > 12 && appState.boardMode === 'real') {
        applyBoardVisualMode('virtual');
      }
      return false;
    }

    function runArVisionStep() {
      if (!appState.videoReady || videoEl.videoWidth === 0) return;

      cvCtx.drawImage(videoEl, 0, 0, cvW, cvH);
      const data = cvCtx.getImageData(0, 0, cvW, cvH).data;
      const gray = new Uint8Array(cvW * cvH);
      for (let i = 0, j = 0; i < data.length; i += 4, j++) {
        gray[j] = (data[i] * 77 + data[i + 1] * 150 + data[i + 2] * 29) >> 8;
      }

      const foundRealBoard = detectPhysicalChessboard(gray);
      if (!foundRealBoard) {
        // Sem tabuleiro fisico -> ancora e rastreia superficie plana (mesa/chao) estilo Minecraft Earth
        trackSurfacePlane(gray);
      }
    }

    // =========================================================================
    // 8. MEDIAPIPE HANDS + PINCELADA POR CONTATO FISICO + MAO TRANSPARENTE
    // =========================================================================
    const handTracker = {
      isPinching: false,
      confirmFrames: 0,
      sx: 0,
      sy: 0,
      initialized: false,
      lmScreen: null
    };
    let latestLandmarks = [];
    let isProcessingHand = false;
    let mpHands = null;

    function videoToScreen(nx, ny) {
      const sw = window.innerWidth;
      const sh = window.innerHeight;
      const vw = videoEl.videoWidth || 1280;
      const vh = videoEl.videoHeight || 720;
      const scale = Math.max(sw / vw, sh / vh);
      const dw = vw * scale;
      const dh = vh * scale;
      const ox = (sw - dw) * 0.5;
      const oy = (sh - dh) * 0.5;
      const px = appState.mirrorVideo ? ox + (1 - nx) * dw : ox + nx * dw;
      const py = oy + ny * dh;
      return { x: px, y: py };
    }

    function onHandResults(results) {
      isProcessingHand = false;
      latestLandmarks = results.multiHandLandmarks || [];

      if (latestLandmarks.length === 0) {
        if (handTracker.isPinching) {
          handTracker.isPinching = false;
          endPinchAction(handTracker.sx, handTracker.sy);
        }
        handTracker.confirmFrames = 0;
        handTracker.initialized = false;
        handTracker.lmScreen = null;
        appState.hoveredPiece = null;
        return;
      }

      const lm = latestLandmarks[0];
      const pts = lm.map(p => videoToScreen(p.x, p.y));
      handTracker.lmScreen = pts;

      // Medicao isotropica para exigir contato real entre ponta do polegar e indicador
      const aspectV = (videoEl.videoHeight || 720) / Math.max(videoEl.videoWidth || 1280, 1);
      const tipDist = Math.hypot(lm[4].x - lm[8].x, (lm[4].y - lm[8].y) * aspectV);
      const palmLen = Math.hypot(lm[0].x - lm[9].x, (lm[0].y - lm[9].y) * aspectV);
      const indexDipPipDist = Math.hypot(lm[8].x - lm[6].x, (lm[8].y - lm[6].y) * aspectV);
      const ratio = tipDist / Math.max(palmLen, 0.08);

      const rawX = (pts[4].x + pts[8].x) * 0.5;
      const rawY = (pts[4].y + pts[8].y) * 0.5;
      if (!handTracker.initialized) {
        handTracker.sx = rawX;
        handTracker.sy = rawY;
        handTracker.initialized = true;
      } else {
        handTracker.sx += (rawX - handTracker.sx) * 0.42;
        handTracker.sy += (rawY - handTracker.sy) * 0.42;
      }

      // So ativa quando ponta do polegar (4) encosta fisicamente na ponta do indicador (8)
      const touchingNow = ratio < 0.17 && tipDist < 0.035 && tipDist < indexDipPipDist * 0.92;
      const releasedNow = ratio > 0.24 || tipDist > 0.048;

      if (!handTracker.isPinching) {
        if (touchingNow) {
          handTracker.confirmFrames++;
          if (handTracker.confirmFrames >= 2) {
            handTracker.isPinching = true;
            handTracker.confirmFrames = 0;
            startPinchAction(handTracker.sx, handTracker.sy);
          }
        } else {
          handTracker.confirmFrames = 0;
        }
      } else if (releasedNow) {
        handTracker.isPinching = false;
        handTracker.confirmFrames = 0;
        endPinchAction(handTracker.sx, handTracker.sy);
      }

      movePinchAction(handTracker.sx, handTracker.sy);
    }

    const FINGER_CHAINS = [
      [0, 1, 2, 3, 4],
      [0, 5, 6, 7, 8],
      [0, 9, 10, 11, 12],
      [0, 13, 14, 15, 16],
      [0, 17, 18, 19, 20]
    ];

    function renderTransparentHand() {
      const sw = handCanvas.width;
      const sh = handCanvas.height;
      handCtx.clearRect(0, 0, sw, sh);

      const pts = handTracker.lmScreen;
      if (!pts) return;

      const isPinch = handTracker.isPinching;
      handCtx.save();

      // Contorno ultra fino e altamente transparente para nunca esconder as pecas atras
      handCtx.strokeStyle = 'rgba(255, 255, 255, 0.18)';
      handCtx.lineWidth = 1.2;
      handCtx.lineCap = 'round';
      handCtx.lineJoin = 'round';

      for (const chain of FINGER_CHAINS) {
        handCtx.beginPath();
        chain.forEach((idx, k) => {
          if (k === 0) handCtx.moveTo(pts[idx].x, pts[idx].y);
          else handCtx.lineTo(pts[idx].x, pts[idx].y);
        });
        handCtx.stroke();
      }

      // Apenas dois anéis finos vazados nas pontas do polegar (4) e indicador (8)
      for (const tipIdx of [4, 8]) {
        handCtx.beginPath();
        handCtx.arc(pts[tipIdx].x, pts[tipIdx].y, 4, 0, Math.PI * 2);
        handCtx.lineWidth = isPinch ? 1.8 : 1.4;
        handCtx.strokeStyle = isPinch ? 'rgba(200, 62, 123, 0.78)' : 'rgba(130, 200, 243, 0.55)';
        handCtx.stroke();
      }

      if (isPinch) {
        handCtx.beginPath();
        handCtx.arc(handTracker.sx, handTracker.sy, 2.5, 0, Math.PI * 2);
        handCtx.fillStyle = 'rgba(200, 62, 123, 0.82)';
        handCtx.fill();
      }

      handCtx.restore();
    }

    async function initMediaPipeHands() {
      if (typeof window.Hands === 'undefined') return;
      mpHands = new window.Hands({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
      });
      mpHands.setOptions({
        maxNumHands: 1,
        modelComplexity: 1,
        minDetectionConfidence: 0.62,
        minTrackingConfidence: 0.62
      });
      mpHands.onResults(onHandResults);
    }

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            width: { ideal: 1280 },
            height: { ideal: 720 },
            facingMode: { ideal: 'environment' }
          },
          audio: false
        });
        videoEl.srcObject = stream;
        await videoEl.play();
        const track = stream.getVideoTracks()[0];
        const settings = track && track.getSettings ? track.getSettings() : {};
        appState.mirrorVideo = settings.facingMode !== 'environment';
        videoEl.classList.toggle('mirrored', appState.mirrorVideo);
        appState.videoReady = true;
        videoEl.classList.add('active');
      } catch (err) {
        appState.videoReady = false;
      }
    }

    window.addEventListener('resize', updateCameraViewport);

    // =========================================================================
    // 9. LOOP PRINCIPAL
    // =========================================================================
    let lastHandInferTime = 0;

    function animate(now) {
      requestAnimationFrame(animate);

      appState.boardScale += (appState.targetBoardScale - appState.boardScale) * 0.16;
      boardGroup.scale.setScalar(appState.boardScale);
      appState.boardPos.lerp(appState.targetBoardPos, 0.16);
      boardGroup.position.copy(appState.boardPos);
      appState.boardYaw += (appState.targetBoardYaw - appState.boardYaw) * 0.12;
      boardGroup.rotation.y = appState.boardYaw;

      const activeFocusPiece = appState.heldPiece || appState.hoveredPiece;
      if (activeFocusPiece) {
        if (appState.heldPiece) {
          const sx = Math.abs(activeFocusPiece.targetPos.x) <= 4.05 && Math.abs(activeFocusPiece.targetPos.z) <= 4.05
            ? Math.round(activeFocusPiece.targetPos.x + 3.5) - 3.5
            : activeFocusPiece.targetPos.x;
          const sz = Math.abs(activeFocusPiece.targetPos.x) <= 4.05 && Math.abs(activeFocusPiece.targetPos.z) <= 4.05
            ? Math.round(activeFocusPiece.targetPos.z + 3.5) - 3.5
            : activeFocusPiece.targetPos.z;
          focusRingMesh.position.set(sx, 0.045, sz);
          focusRingMat.color.setHex(0xF6B3D0);
          focusRingMat.opacity = 0.72;
        } else {
          focusRingMesh.position.set(activeFocusPiece.targetPos.x, 0.045, activeFocusPiece.targetPos.z);
          focusRingMat.color.setHex(0x82C8F3);
          focusRingMat.opacity = 0.56;
        }
      } else {
        focusRingMat.opacity = 0;
      }

      for (const p of pieces) {
        const lerpSpeed = p === appState.heldPiece ? 0.44 : 0.24;
        p.mesh.position.lerp(p.targetPos, lerpSpeed);

        if (p === appState.heldPiece) {
          p.mat.emissive.setHex(0xF6B3D0);
          p.mat.emissiveIntensity = 0.44;
        } else if (p === appState.hoveredPiece) {
          p.mat.emissive.setHex(0x82C8F3);
          p.mat.emissiveIntensity = 0.36;
        } else {
          p.mat.emissive.setHex(0x000000);
          p.mat.emissiveIntensity = 0;
        }
      }

      renderer.render(scene, camera);
      renderTransparentHand();

      if (appState.videoReady && mpHands && !isProcessingHand && videoEl.readyState >= 2 && (now - lastHandInferTime > 30)) {
        isProcessingHand = true;
        lastHandInferTime = now;
        mpHands.send({ image: videoEl }).catch(() => {
          isProcessingHand = false;
        });
      }

      if (now - lastCvTime > 65) {
        lastCvTime = now;
        runArVisionStep();
      }
    }

    updateCameraViewport();
    setupBoard();
    initMediaPipeHands();
    startCamera();
    requestAnimationFrame(animate);
  })();
  </script>
</body>
</html>
